<meta name="claude:viewport-fit-sides" content="cover">
<title>Burgwacht</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: ein Bildschirm im Hochformat. Spielfeld füllt alles, oben schwebt die Anzeige, unten liegt die Waffenleiste. */
:root{
  --grass:#7cc463; --grass-deep:#3c7f4a; --ink:#33283a; --panel:#fff6df; --panel-edge:#d9c59a;
  --gold:#f5b93a; --heart:#e9524f; --muted:#8a7d86; --xp:#5aa9e6;
  --display:"Lilita One","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--grass-deep);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:relative;height:100%;width:100%;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pill{background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;
  font-family:var(--display);font-size:16px;box-shadow:0 3px 0 rgba(51,40,58,.35);white-space:nowrap}
#hearts{font-size:13px;letter-spacing:0;padding:6px 10px;color:var(--heart)}
#hearts .off{color:#d8cdbb}
#toast{position:absolute;top:96px;left:50%;transform:translate(-50%,-12px);max-width:calc(100% - 32px);text-align:center;
  background:var(--ink);color:#fff6df;border:2px solid var(--gold);border-radius:14px;padding:8px 16px;
  font-family:var(--display);font-size:17px;line-height:1.25;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-family:var(--body);font-weight:800;font-size:13px;color:var(--gold)}
#hint{position:absolute;left:50%;bottom:136px;transform:translateX(-50%);background:rgba(51,40,58,.78);color:#fff6df;
  border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#bar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,rgba(40,70,50,.75),rgba(40,70,50,0))}
.wp{position:relative;min-width:0;display:grid;justify-items:center;row-gap:2px;
  background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:6px 6px 8px;font:inherit;color:inherit;
  box-shadow:0 4px 0 rgba(51,40,58,.4);cursor:pointer;overflow:hidden;text-align:center;opacity:.82;transition:transform .12s,opacity .12s}
.wp:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
.wp[aria-pressed="true"]{opacity:1;transform:translateY(-4px);background:#fffdf4;
  box-shadow:0 0 0 3px var(--gold),0 6px 0 rgba(51,40,58,.4)}
.wp canvas{width:34px;height:34px;display:block}
.wp .nm{font-family:var(--display);font-size:14px;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
.wp .lv{display:block;font-family:var(--body);font-weight:800;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wp .xp{width:100%;height:6px;margin-top:2px;border-radius:99px;background:#e6d9bb;overflow:hidden}
.wp .xp i{display:block;height:100%;width:0;background:var(--xp);border-radius:99px}
.wavectl{display:flex;align-items:center;gap:6px;padding:3px 4px;pointer-events:auto}
.wavectl button{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--ink);background:var(--gold);color:var(--ink);
  font-size:13px;line-height:1;cursor:pointer;padding:0;display:grid;place-items:center}
.wavectl button:disabled{background:#e6d9bb;color:#b7a98c;border-color:#b7a98c;cursor:default}
.wavectl button:focus-visible,.shopcard button:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
#wave{min-width:60px;text-align:center;font-size:15px}
#hud .right{display:grid;justify-items:end;gap:6px;min-width:0}
#gold{font-variant-numeric:tabular-nums}
@media (max-width:350px){#hearts{font-size:11px;padding:6px 8px}#wave{min-width:54px;font-size:14px}}
#gold::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);margin-right:6px;vertical-align:-2px}
.wp.locked{opacity:.6;background:#e9e1cf}
.wp.locked canvas{filter:grayscale(1);opacity:.55}
#shop{position:absolute;inset:0;display:grid;place-items:center;background:rgba(40,30,45,.62);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.shopcard{width:min(340px,100%);max-height:100%;overflow:auto;background:var(--panel);border:3px solid var(--ink);border-radius:18px;
  padding:16px;box-shadow:0 6px 0 rgba(51,40,58,.45);display:grid;gap:10px}
.shopcard h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;text-align:center;text-wrap:balance}
.shopcard p{margin:0;font-weight:600;font-size:13px;color:var(--muted);text-align:center}
.shopcard .purse{justify-self:center}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border-top:2px dashed var(--panel-edge);padding-top:10px}
.item b{display:block;font-family:var(--display);font-weight:400;font-size:16px}
.item span{display:block;font-weight:600;font-size:12px;color:var(--muted);line-height:1.3}
.item button,#shopgo{font-family:var(--display);font-size:15px;border:2px solid var(--ink);border-radius:12px;background:var(--gold);color:var(--ink);
  padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 rgba(51,40,58,.4);white-space:nowrap;min-width:84px}
.item button:disabled{background:#e6d9bb;color:#9c8f79;box-shadow:none;cursor:default}
.item button.own{background:#bfe3a8;color:#2f6b2f}
#shopgo{background:#7ddc5a;padding:11px 12px;font-size:17px}
.wp .cd{position:absolute;inset:0;background:rgba(51,40,58,.5);transform-origin:bottom;transform:scaleY(0);pointer-events:none}
@media (prefers-reduced-motion:reduce){.wp,#toast{transition:none}}
</style>

<div id="game">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="pill wavectl"><button id="wdown" type="button" aria-label="Eine Welle runter">▼</button><span id="wave">Welle 1</span><button id="wup" type="button" aria-label="Eine Welle hoch">▲</button></div>
    <div class="right"><div class="pill" id="hearts"></div><div class="pill" id="gold">0</div></div>
  </div>
  <div id="toast" role="status"></div>
  <div id="hint">Tippe aufs Feld, um anzugreifen</div>
  <div id="bar">
    <button class="wp" id="wp-sword" data-w="sword" aria-pressed="true"><canvas width="72" height="72"></canvas><span class="nm">Schwert<span class="lv"></span></span><span class="xp"><i></i></span><span class="cd"></span></button>
    <button class="wp" id="wp-dagger" data-w="dagger" aria-pressed="false"><canvas width="72" height="72"></canvas><span class="nm">Dolche<span class="lv"></span></span><span class="xp"><i></i></span><span class="cd"></span></button>
    <button class="wp" id="wp-star" data-w="star" aria-pressed="false"><canvas width="72" height="72"></canvas><span class="nm">Morgenstern<span class="lv"></span></span><span class="xp"><i></i></span><span class="cd"></span></button>
  </div>
  <div id="shop" hidden>
    <div class="shopcard" role="dialog" aria-labelledby="shoptitle">
      <h2 id="shoptitle">Die Burg ist gefallen</h2>
      <p>Gib dein Gold aus. Danach geht es bei Welle 1 weiter.</p>
      <div class="pill purse" id="shopgold">0</div>
      <div id="items"></div>
      <button id="shopgo" type="button">Weiter bei Welle 1</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const TAU=Math.PI*2, PI=Math.PI, cos=Math.cos, sin=Math.sin, atan2=Math.atan2;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const game=$('game'), cv=$('c'), ctx=cv.getContext('2d');
const MAXLV=100, MAXHP=10, SAVE='burgwacht-v2';
const NAMES={sword:'Schwert',dagger:'Dolche',star:'Morgenstern'};
const MS={
 sword:{5:'Doppelschwert',10:'Dreier-Fächer',15:'Echo-Hieb',25:'Kreisende Schwerter',30:'Klingenwelle',40:'Geisterschwert',50:'Riesenschwert',60:'Schwertsplitter',70:'Zeitriss',80:'Spiegelhieb',90:'Kettenblitz',100:'Schwertregen'},
 dagger:{5:'Dolchfächer',10:'Abpraller',15:'Durchbohren',25:'Ansteckendes Gift',30:'Schattenklon',40:'Splitterdolche',50:'Bumerang',60:'Giftwolke',70:'Dolchfallen',80:'Zielsuchend',90:'Dolchwirbel',100:'Kettenreaktion'},
 star:{5:'Schockwelle',10:'Rollende Kugel',15:'Betäubung',25:'Stachelhagel',30:'Nachbeben',40:'Brennender Boden',50:'Kettenschwung',60:'Schwarzes Loch',70:'Kugelsplitter',80:'Erdspalte',90:'Zwillingsstern',100:'Meteor'}
};
const BASE={sword:10,dagger:7,star:16};

/* ---------- Zustand ---------- */
const S={lv:{sword:1,dagger:1,star:1},xp:{sword:0,dagger:0,star:0},wave:1,active:'sword',
  gold:0,cleared:0,heal:1,own:{dagger:false,star:false,soldier:false}};
try{const d=JSON.parse(localStorage.getItem(SAVE)||'null');
  if(d){for(const w in S.lv){S.lv[w]=Math.min(MAXLV,Math.max(1,d.lv?.[w]|0||1));S.xp[w]=+d.xp?.[w]||0}
    S.gold=Math.max(0,d.gold|0);S.cleared=Math.max(0,d.cleared|0);S.heal=Math.min(3,Math.max(1,d.heal|0||1));
    for(const k in S.own)S.own[k]=!!d.own?.[k];
    S.wave=Math.min(S.cleared+1,Math.max(1,d.wave|0||1));
    if(d.active==='sword'||S.own[d.active])S.active=d.active}}catch(e){}
const owned=w=>w==='sword'||S.own[w];
const save=()=>{try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}};
const need=L=>Math.round(4+L*1.4+L*L*.035);
const dmgOf=w=>BASE[w]*(1+.09*(S.lv[w]-1));
const cdOf=w=>3.5-2*(S.lv[w]-1)/99;

let W=360,H=640,DPR=1,U=1,cx=180,cy=300,CR=24,ground=null;
let hp=MAXHP,enemies=[],projs=[],zones=[],fx=[],parts=[],texts=[],timers=[];
let cd=0,cdMax=1,atkCount=0,shake=0,castleFlash=0,time=0,fallen=false,started=false,paused=false,soldiers=[],solT=2;
let queue=[],spawnT=0,spawnGap=1,pause=1.5;
const after=(t,fn)=>timers.push({t,fn});

/* ---------- Anzeige ---------- */
const toastEl=$('toast');let toastQ=[],toastBusy=false;
function toast(a,b){toastQ.push([a,b]);if(!toastBusy)nextToast()}
function nextToast(){const t=toastQ.shift();if(!t){toastBusy=false;return}toastBusy=true;
  toastEl.textContent=t[0];if(t[1]){const s=document.createElement('small');s.textContent=t[1];toastEl.appendChild(s)}
  toastEl.classList.add('on');setTimeout(()=>{toastEl.classList.remove('on');setTimeout(nextToast,280)},t[1]?2600:1500)}
function hud(){
  $('wave').textContent='Welle '+S.wave;$('wdown').disabled=S.wave<=1;$('wup').disabled=S.wave>S.cleared;
  $('gold').textContent=S.gold;$('gold').setAttribute('aria-label',S.gold+' Gold');
  const h=$('hearts');h.textContent='';
  for(let i=0;i<MAXHP;i++){const s=document.createElement('span');s.textContent='♥';if(i>=hp)s.className='off';h.appendChild(s)}
  h.setAttribute('aria-label',hp+' von '+MAXHP+' Leben');
  for(const w in NAMES){const b=$('wp-'+w),L=S.lv[w],ok=owned(w);
    b.classList.toggle('locked',!ok);b.setAttribute('aria-pressed',String(S.active===w));
    b.querySelector('.lv').textContent=!ok?'Gesperrt':L>=MAXLV?'Lvl 100 MAX':'Lvl '+L;
    b.querySelector('.xp i').style.width=(!ok?0:L>=MAXLV?100:Math.min(100,S.xp[w]/need(L)*100))+'%'}
}
function gainXP(w,a){
  if(S.lv[w]>=MAXLV)return;
  S.xp[w]+=a;let up=false;
  while(S.lv[w]<MAXLV&&S.xp[w]>=need(S.lv[w])){S.xp[w]-=need(S.lv[w]);S.lv[w]++;up=true;
    const m=MS[w][S.lv[w]];
    if(m)toast(NAMES[w]+' Lvl '+S.lv[w],'Neu: '+m);
    else texts.push({x:cx,y:cy-70*U,s:NAMES[w]+' Lvl '+S.lv[w],t:0,c:'#ffe08a',big:1})}
  if(S.lv[w]>=MAXLV)S.xp[w]=0;
  if(up){ring(cx,cy,90*U,'245,185,58',.6);save()}
  hud();
}

/* ---------- Gegner ---------- */
const TYPES={
 slime:{r:13,hp:10,sp:20,xp:1,col:'#59c36a'},
 bat:{r:10,hp:6,sp:38,xp:1,col:'#9a6bd6'},
 ogre:{r:19,hp:42,sp:13,xp:4,col:'#4f9aa8'},
 boss:{r:30,hp:260,sp:9,xp:25,col:'#e07a3f'}
};
function buildWave(){
  const w=S.wave;queue=[];
  for(let i=0;i<6+w*2;i++){const r=Math.random();
    queue.push(w>=3&&r<Math.min(.25,.04*w)?'ogre':w>=2&&r<Math.min(.25,.04*w)+Math.min(.3,.06*w)?'bat':'slime')}
  if(w%5===0)queue.splice(Math.floor(queue.length/2),0,'boss');
  spawnGap=Math.max(.35,1.6-w*.05);spawnT=0;
}
function spawn(type){
  const T=TYPES[type],w=S.wave,a=rnd(TAU),dx=cos(a),dy=sin(a);
  const t=Math.min((W/2+30)/Math.abs(dx||1e-6),((dy<0?cy:H-cy)+30)/Math.abs(dy||1e-6));
  const f=1+.22*(w-1)+.015*(w-1)*(w-1);
  enemies.push({type,x:cx+dx*t,y:cy+dy*t,r:T.r*U,hp:T.hp*f,max:T.hp*f,sp:T.sp*(1+Math.min(.5,w*.02)),xp:T.xp*(1+.12*w),
    col:T.col,boss:type==='boss',ph:rnd(TAU),kx:0,ky:0,stun:0,freeze:0,poison:0,pdps:0,pacc:0,flash:0,oc:0,atk:0,blocked:0,dead:false});
}
function nearest(x,y,maxD,excl){let b=null,bd=maxD||1e9;
  for(const e of enemies){if(e.dead||(excl&&excl.has(e)))continue;const d=dist(x,y,e.x,e.y);if(d<bd){bd=d;b=e}}return b}
function hurt(e,d,src){
  if(e.dead)return;e.hp-=d;e.flash=.12;
  if(!src.dot&&texts.length<40)texts.push({x:e.x+rnd(-6,6),y:e.y-e.r*1.7,s:String(Math.max(1,Math.round(d))),t:0,c:src.c||'#fff'});
  if(e.hp<=0)kill(e,src);
}
function kill(e,src){
  e.dead=true;puff(e.x,e.y,e.col,e.boss?26:10);gainXP(S.active,e.xp);
  const Ld=S.lv.dagger,Ls=S.lv.sword;
  if(e.poison>0){
    if(Ld>=25){let n=0;for(const o of enemies){if(n>=2)break;if(o.dead||o===e||dist(o.x,o.y,e.x,e.y)>90*U)continue;
      o.poison=4;o.pdps=Math.max(o.pdps,e.pdps);n++}}
    if(Ld>=60)cloud(e.x,e.y,e.pdps);
  }
  if(src.w==='sword'&&Ls>=60&&!src.mini){const a0=rnd(TAU);
    for(let i=0;i<3;i++){const a=a0+i*TAU/3;projs.push({k:'mini',x:e.x,y:e.y,vx:cos(a)*300*U,vy:sin(a)*300*U,r:8*U,dmg:dmgOf('sword')*.4,life:.5,pierce:0,hit:new Set([e]),src:{w:'sword',mini:true,c:'#eaf2ff'}})}}
  if(src.w==='dagger'&&Ld>=100&&(src.gen||0)<4&&projs.length<70){const t=nearest(e.x,e.y,400*U);
    if(t)mkDagger(e.x,e.y,atan2(t.y-e.y,t.x-e.x),{simple:true,chain:true,gen:(src.gen||0)+1,m:.8,life:1})}
}
function aoe(x,y,r,d,src,cb){for(const e of enemies){if(e.dead)continue;if(dist(x,y,e.x,e.y)<r+e.r){if(cb)cb(e);hurt(e,d,src)}}}
function knock(e,f){const a=atan2(e.y-cy,e.x-cx),k=f*U/(e.boss?3:1);e.kx+=cos(a)*k;e.ky+=sin(a)*k}

/* ---------- Effekte ---------- */
function puff(x,y,col,n){for(let i=0;i<n&&parts.length<260;i++){const a=rnd(TAU),s=rnd(30,140)*U;
  parts.push({x,y,vx:cos(a)*s,vy:sin(a)*s-40*U,l:rnd(.3,.6),m:.6,col,sz:rnd(2,5)*U})}}
function ring(x,y,r,rgb,dur=.4,under){fx.push({t:0,dur,under,d(k){ctx.strokeStyle=`rgba(${rgb},${1-k})`;ctx.lineWidth=(6-5*k)*U;
  ctx.beginPath();ctx.ellipse(x,y,r*(.3+.7*k),r*(.3+.7*k)*.8,0,0,TAU);ctx.stroke()}})}
function slashFx(x,y,a,R,rgb='255,255,255'){fx.push({t:0,dur:.28,d(k){const sw=Math.min(1,k*3.2);
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.globalAlpha=1-k*k;ctx.fillStyle=`rgb(${rgb})`;ctx.shadowColor=`rgba(${rgb},.9)`;ctx.shadowBlur=14*U;
  ctx.beginPath();ctx.arc(-R*.4,0,R*1.2,-1.1,-1.1+2.2*sw);ctx.arc(-R*.8,0,R*1.38,(-1.1+2.2*sw)*.82,-1.1*.82,true);ctx.closePath();ctx.fill();ctx.restore()}})}
function drawSword(c,x,y,a,len,blade='#eef4ff',grip='#8a5a3c'){
  c.save();c.translate(x,y);c.rotate(a);c.lineJoin='round';c.lineWidth=Math.max(1,len*.035);c.strokeStyle='#33283a';
  const w=len*.075;c.fillStyle=blade;c.beginPath();c.moveTo(0,-w);c.lineTo(len*.74,-w);c.lineTo(len*.9,0);c.lineTo(len*.74,w);c.lineTo(0,w);c.closePath();c.fill();c.stroke();
  c.fillStyle='rgba(120,150,190,.45)';c.fillRect(len*.04,0,len*.72,w*.8);
  c.fillStyle=grip;c.fillRect(-len*.2,-w*.6,len*.2,w*1.2);c.strokeRect(-len*.2,-w*.6,len*.2,w*1.2);
  c.fillStyle='#f5b93a';c.fillRect(-len*.035,-len*.15,len*.07,len*.3);c.strokeRect(-len*.035,-len*.15,len*.07,len*.3);
  c.beginPath();c.arc(-len*.22,0,w*.9,0,TAU);c.fill();c.stroke();c.restore()}
function drawBall(c,x,y,r,rot=0){
  c.save();c.translate(x,y);c.rotate(rot);c.strokeStyle='#33283a';c.lineWidth=Math.max(1,r*.12);c.lineJoin='round';c.fillStyle='#cfd6de';
  for(let i=0;i<8;i++){const a=i*TAU/8;c.beginPath();c.moveTo(cos(a-.22)*r*.9,sin(a-.22)*r*.9);c.lineTo(cos(a)*r*1.5,sin(a)*r*1.5);c.lineTo(cos(a+.22)*r*.9,sin(a+.22)*r*.9);c.closePath();c.fill();c.stroke()}
  const g=c.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);g.addColorStop(0,'#aab3c0');g.addColorStop(1,'#59606e');
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,TAU);c.fill();c.stroke();c.restore()}
function fallSword(x,y,scale,delay,cb){
  fx.push({t:0,dur:delay,d(k){const e=k*k;ctx.fillStyle=`rgba(0,0,0,${.12+.2*k})`;ctx.beginPath();ctx.ellipse(x,y,22*U*scale*k,9*U*scale*k,0,0,TAU);ctx.fill();
    drawSword(ctx,x,y-(1-e)*420*U-58*U*scale,PI/2,64*U*scale)}});
  after(delay,()=>{cb();fx.push({t:0,dur:.35,d(k){ctx.globalAlpha=1-k;drawSword(ctx,x,y-58*U*scale,PI/2,64*U*scale);ctx.globalAlpha=1}})});
}
function lightning(x,y,d){
  const pts=[[x,y]],hit=new Set();let px=x,py=y;
  for(let i=0;i<7;i++){const e=nearest(px,py,170*U,hit);if(!e)break;hit.add(e);pts.push([e.x,e.y]);px=e.x;py=e.y;hurt(e,d,{w:'sword',c:'#fff59a'})}
  if(pts.length<2)pts.push([x+rnd(-40,40)*U,y-60*U]);
  fx.push({t:0,dur:.3,d(k){ctx.save();ctx.globalAlpha=1-k;ctx.strokeStyle='#fff59a';ctx.shadowColor='#ffe24a';ctx.shadowBlur=16*U;ctx.lineWidth=3*U;ctx.lineJoin='round';ctx.beginPath();

const ATK={sword:atkSword,dagger:atkDagger,star:atkStar};

/* ---------- Geschosse ---------- */
function endProj(p){
  if(p.k==='dagger'&&p.boom&&!p.ret){p.ret=true;p.hit.clear();p.life=3;return}
  if(p.k==='ball'&&p.split){const a=atan2(p.vy,p.vx);for(const s of[-.7,0,.7])ballProj(p.x,p.y,a+s,{sp:p.sp,r:p.r*.6,d:p.dmg*.6,range:150*U,split:false});puff(p.x,p.y,'#aab3c0',8)}
  p.dead=true;
}
function onHit(p,e){
  if(p.k==='dagger'){
    if(S.lv.dagger>=25){e.poison=4;e.pdps=Math.max(e.pdps,p.dmg*.35)}
    if(p.split&&!p.didSplit){p.didSplit=true;const a=atan2(p.vy,p.vx);for(const s of[-.6,.6]){const c=mkDagger(p.x,p.y,a+s,{simple:true,m:.5,life:.5});c.hit.add(e)}}
    if(p.ret)return;
    if(p.pierce>0){p.pierce--;return}
    if(p.bounce>0){const t=nearest(p.x,p.y,220*U,p.hit);if(t){p.bounce--;const a=atan2(t.y-p.y,t.x-p.x);p.vx=cos(a)*p.sp;p.vy=sin(a)*p.sp;p.life=Math.max(p.life,.6);return}}
    endProj(p);
  }else if(p.k==='mini'||p.k==='spike'){if(p.pierce>0)p.pierce--;else p.dead=true}
  else if(p.k==='ball')knock(e,130);
}
function updProjs(dt){
  for(let i=0;i<projs.length;i++){const p=projs[i];if(p.dead)continue;p.life-=dt;
    if(p.ret){const a=atan2(cy-p.y,cx-p.x);p.vx=cos(a)*p.sp;p.vy=sin(a)*p.sp;if(dist(p.x,p.y,cx,cy)<26*U||p.life<=0){p.dead=true;continue}}
    else if(p.home){const t=nearest(p.x,p.y,170*U,p.hit);if(t){let c=atan2(p.vy,p.vx),q=atan2(t.y-p.y,t.x-p.x)-c;q=atan2(sin(q),cos(q));c+=Math.max(-6*dt,Math.min(6*dt,q));p.vx=cos(c)*p.sp;p.vy=sin(c)*p.sp}}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.k==='ball'){p.trav+=p.sp*dt;if(p.trav>=p.range){endProj(p);continue}}
    if(!p.ret&&(p.life<=0||p.x<-40||p.x>W+40||p.y<-40||p.y>H+40)){endProj(p);if(p.dead)continue}
    for(const e of enemies){if(e.dead||p.hit.has(e))continue;
      if(dist(p.x,p.y,e.x,e.y)<p.r+e.r){p.hit.add(e);hurt(e,p.dmg,p.src);onHit(p,e);if(p.dead)break}}
  }
}
function drawProj(p){

function castleHit(){hp--;castleFlash=.3;shake=Math.max(shake,10);puff(cx,cy,'#efe7d4',8);hud();if(hp<=0)fallen=true}
function update(dt){
  time+=dt;cd-=dt;shake=Math.max(0,shake-dt*40);castleFlash=Math.max(0,castleFlash-dt);
  for(let i=0;i<timers.length;i++){const t=timers[i];t.t-=dt;if(t.t<=0){t.done=true;t.fn()}}
  timers=timers.filter(t=>!t.done);
  if(pause>0)pause-=dt;
  else if(queue.length){spawnT-=dt;if(spawnT<=0){spawn(queue.shift());spawnT=spawnGap}}
  else if(!enemies.length){const w=S.wave;let g=0;if(w>S.cleared){S.cleared=w;g=w;S.gold+=g}
    hp=Math.min(MAXHP,hp+S.heal);S.wave++;save();pause=2.5;buildWave();hud();toast('Welle '+w+' geschafft',g?'+'+g+' Gold':'')}
  for(const e of enemies){if(e.dead)continue;e.flash-=dt;e.oc-=dt;e.atk-=dt;e.blocked-=dt;
    if(e.poison>0){e.poison-=dt;e.pacc+=dt;if(e.pacc>=.5){e.pacc=0;hurt(e,e.pdps*.5,{w:'dagger',dot:true})}}
    if(e.dead)continue;
    e.x+=e.kx*dt;e.y+=e.ky*dt;const dec=Math.exp(-5*dt);e.kx*=dec;e.ky*=dec;
    if(e.freeze>0)e.freeze-=dt;else if(e.stun>0)e.stun-=dt;else if(e.blocked>0){}
    else{const a=atan2(cy-e.y,cx-e.x),sp=e.sp*U,wb=e.type==='bat'?sin(time*4+e.ph)*.7:0;e.x+=(cos(a)-sin(a)*wb)*sp*dt;e.y+=(sin(a)+cos(a)*wb)*sp*dt}
    e.x=Math.max(-60,Math.min(W+60,e.x));e.y=Math.max(-60,Math.min(H+60,e.y));
    if(dist(e.x,e.y,cx,cy)<CR+e.r){e.dead=true;puff(e.x,e.y,e.col,6);castleHit()}}
  updSoldiers(dt);updProjs(dt);
  for(const z of zones){z.t+=dt;if(z.t<z.dur)z.u(z,dt)}
  zones=zones.filter(z=>z.t<z.dur);
  for(const f of fx)f.t+=dt;fx=fx.filter(f=>f.t<f.dur);
  for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*U*dt}parts=parts.filter(p=>p.l>0);
  for(const t of texts){t.t+=dt;t.y-=28*U*dt}texts=texts.filter(t=>t.t<(t.big?1.4:.7));
  enemies=enemies.filter(e=>!e.dead);projs=projs.filter(p=>!p.dead);
  if(fallen){fallen=false;resetField(true);openShop()}
  const b=$('wp-'+S.active).querySelector('.cd');b.style.transform=`scaleY(${Math.max(0,cd)/cdMax})`;
}

  if(!started){started=true;$('hint').style.opacity=0}
  atkCount++;cdMax=cdOf(S.active);cd=cdMax;ATK[S.active](x,y);
}
