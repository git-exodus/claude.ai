    ctx.arc(-p.r * 1.1, 0, p.r * 1.45, 0.86, -0.86, true);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  },
};

PROJECTILE_KINDS.swordSplinter = {
  onHit(p) { p.dead = true; },
  draw(p, angle) { drawSword(ctx, p.x, p.y, angle, 18 * U); },
};

/** Lvl 60: enemies killed by the sword burst into three small swords (which do not burst again). */
KILL_HOOKS.push((enemy, source) => {
  if (source.weapon !== 'sword' || source.splinter || S.lv.sword < 60) return;
  const startAngle = rnd(TAU);
  for (let i = 0; i < 3; i++) {
    addProjectile({
      kind: 'swordSplinter', x: enemy.x, y: enemy.y, angle: startAngle + i * TAU / 3, speed: 300 * U, r: 8 * U,
      dmg: damageOf('sword') * 0.4, life: 0.5, hit: new Set([enemy]),
      source: { weapon: 'sword', splinter: true, color: '#eaf2ff' },
    });
  }
});

/* ===== 11-weapon-dagger.js ===== */
/*
 * Daggers: fast throws from the castle towards the tapped point, later with
 * poison, bounces and chain reactions.
 */

const DAGGER_COLOR = '#c9f7e4';
const POISON_SHARE = 0.7;    // poison damage per second as a share of the dagger's hit damage

/**
 * Throws one dagger.
 *   opts.share       damage multiplier
 *   opts.minor       a spawned dagger (split or chain): no pierce, split or boomerang
 *   opts.chain       spawned by the lvl-100 chain reaction: full size, bounces once
 *   opts.generation  chain depth, limits the chain reaction
 */
function throwDagger(x, y, angle, opts = {}) {
  const level = S.lv.dagger;
  const main = !opts.minor;
  return addProjectile({
    kind: 'dagger', x, y, angle, speed: 420 * U, r: 8 * U,
    dmg: (opts.share || 1) * damageOf('dagger'),
    life: opts.life || 1.4,
    pierce: main && level >= 15 ? 1 : 0,
    bounce: main ? (level >= 10 ? 2 : 0) : (opts.chain ? 1 : 0),
    splits: main && level >= 40,
    boomerang: main && level >= 50,
    homing: level >= 80,
    scale: main || opts.chain ? 1 : 0.7,
    source: { weapon: 'dagger', generation: opts.generation || 0, color: DAGGER_COLOR },
  });
}

/* ---------- Abilities ---------- */

/** Lvl 1/5: one dagger or a fan of three, thrown from the castle. */
function daggerVolley(angle, share) {
  const count = S.lv.dagger >= 5 ? 3 : 1;
  for (let i = 0; i < count; i++) {
    throwDagger(cx + cos(angle) * 16 * U, cy + sin(angle) * 16 * U, angle + (i - (count - 1) / 2) * 0.2, { share });
  }
}

/** Lvl 30: a shadow clone throws a second volley at the enemy closest to the castle. */
function daggerShadowClone(a) {
  after(0.25, () => {
    const target = nearestEnemy(cx, cy);
    const angle = target ? atan2(target.y - cy, target.x - cx) : a.angle + PI;
    daggerVolley(angle, 0.7);
    const x = cx + cos(angle) * 34 * U, y = cy + sin(angle) * 34 * U;
    addEffect(0.5, k => {
      ctx.fillStyle = `rgba(60,40,90,${0.7 * (1 - k)})`;
      fillCircle(ctx, x, y - 14 * U, 8 * U);
      ctx.beginPath();
      ctx.moveTo(x - 11 * U, y + 8 * U);
      ctx.quadraticCurveTo(x, y - 22 * U, x + 11 * U, y + 8 * U);
      ctx.fill();
    });
  });
}

/** Lvl 70: a dagger stuck in the ground at the tap point; the first enemy to step on it is hit hard. */
function daggerTrap(a) {
  const traps = world.zones.filter(zone => zone.tag === 'daggerTrap');
  if (traps.length >= 6) traps[0].t = Infinity;   // at most 6 traps: the oldest one goes
  const { x, y } = a;
  addZone({
    tag: 'daggerTrap', dur: 25, under: true,
    update(zone) {
      for (const e of world.enemies) {
        if (e.dead || dist(x, y, e.x, e.y) >= 14 * U + e.r) continue;
        if (a.level >= 25) applyPoison(e, a.damage * POISON_SHARE);
        hurt(e, a.damage * 2.5, { weapon: 'dagger', color: DAGGER_COLOR });
        ring(x, y, 30 * U, '201,247,228', 0.3);
        zone.t = Infinity;
        break;
      }
    },
    draw() {
      ctx.fillStyle = 'rgba(0,0,0,.2)';
      fillEllipse(ctx, x, y + 2 * U, 9 * U, 4 * U);
      drawSword(ctx, x, y - 20 * U, PI / 2, 22 * U, DAGGER_BLADE, DAGGER_GRIP);
    },
  });
}

/** Lvl 90: a ring of spinning daggers at the tap point for 2 s (max. 3). */
function daggerWhirl(a) {
  if (zoneCount('daggerWhirl') >= 3) return;
  const { x, y } = a;
  addZone({
    tag: 'daggerWhirl', dur: 2, tick: 0.2,
    update(zone, dt) {
      zone.tick += dt;
      if (zone.tick < 0.2) return;
      zone.tick = 0;
      areaDamage(x, y, 58 * U, a.damage * 0.3, { weapon: 'dagger', color: DAGGER_COLOR }, e => {
        if (a.level >= 25) applyPoison(e, a.damage * POISON_SHARE);
      });
    },
    draw(zone) {
      ctx.globalAlpha = zoneFade(zone, 5, 3);
      for (let i = 0; i < 6; i++) {
        const g = zone.t * 11 + i * TAU / 6;
        drawSword(ctx, x + cos(g) * 40 * U, y + sin(g) * 40 * U * 0.85, g + PI / 2, 22 * U, DAGGER_BLADE, DAGGER_GRIP);
      }
      ctx.globalAlpha = 1;
    },
  });
}

/** Lvl 60: a poison cloud that lingers where a poisoned enemy died. */
function poisonCloud(x, y, dps) {
  if (world.zones.length > 40) return;
  const radius = 45 * U;
  addZone({
    dur: 3, under: true, tick: 0.5,
    update(zone, dt) {
      zone.tick += dt;
      if (zone.tick < 0.5) return;
      zone.tick = 0;
      areaDamage(x, y, radius, dps * 0.5, { weapon: 'dagger', dot: true }, e => applyPoison(e, dps));
    },
    draw(zone) {
      const alpha = 0.5 * zoneFade(zone, 5, 2);
      ctx.fillStyle = `rgba(140,210,70,${alpha * 0.5})`;
      for (let i = 0; i < 5; i++) {
        const g = i * 1.26 + zone.t * 0.6;
        fillCircle(ctx, x + cos(g) * radius * 0.4, y + sin(g) * radius * 0.3, radius * 0.6);
      }
    },
  });
}

/* ---------- Attack ---------- */

WEAPONS.dagger.attack = function (x, y) {
  const level = S.lv.dagger;
  const a = { x, y, level, damage: damageOf('dagger'), angle: atan2(y - cy, x - cx) };

  daggerVolley(a.angle, 1);
  if (level >= 30) daggerShadowClone(a);
  if (level >= 70) daggerTrap(a);
  if (level >= 90) daggerWhirl(a);
  // Lvl 10 bounce, 15 pierce, 25 poison, 40 split, 50 boomerang and 80 homing live in the projectile below.
};

/* ---------- Projectile kind and kill hooks ---------- */

PROJECTILE_KINDS.dagger = {
  onHit(p, enemy) {
    if (S.lv.dagger >= 25) applyPoison(enemy, p.dmg * POISON_SHARE);
    if (p.splits && !p.hasSplit) {
      // Lvl 40: the first hit splits off two small daggers
      p.hasSplit = true;
      const angle = atan2(p.vy, p.vx);
      for (const spread of [-0.6, 0.6]) {
        const child = throwDagger(p.x, p.y, angle + spread, { minor: true, share: 0.5, life: 0.5 });
        child.hit.add(enemy);
      }
    }
    if (p.returning) return;                 // on the way back it cuts through everything
    if (pierceOrBounce(p, 220 * U, 0.6)) return;
    expireProjectile(p);
  },
  onExpire(p) {
    if (p.boomerang && !p.returning) {
      // Lvl 50: fly back to the castle and hit everything again
      p.returning = true;
      p.hit.clear();
      p.life = 3;
      return;
    }
    p.dead = true;
  },
  draw(p, angle) {
    const back = 10 * U * p.scale;   // the sprite's origin is the hilt, the hit point is further forward
    drawSword(ctx, p.x - cos(angle) * back, p.y - sin(angle) * back, angle, 24 * U * p.scale, DAGGER_BLADE, DAGGER_GRIP);
  },
};

/** Lvl 25: poison jumps to two neighbours when its carrier dies. Lvl 60: it also leaves a cloud. */
KILL_HOOKS.push(enemy => {
  if (enemy.poison <= 0) return;
  const level = S.lv.dagger;
  if (level >= 25) {
    let spread = 0;
    for (const other of world.enemies) {
      if (spread >= 2) break;
      if (other.dead || other === enemy || dist(other.x, other.y, enemy.x, enemy.y) > 90 * U) continue;
      applyPoison(other, enemy.poisonDps);
      spread++;
    }
  }
  if (level >= 60) poisonCloud(enemy.x, enemy.y, enemy.poisonDps);
});

/** Lvl 100: every dagger kill throws a new dagger at the nearest enemy (up to 4 links deep). */
KILL_HOOKS.push((enemy, source) => {
  if (source.weapon !== 'dagger' || S.lv.dagger < 100) return;
  const generation = source.generation || 0;
  if (generation >= 4 || world.projectiles.length >= 70) return;
  const target = nearestEnemy(enemy.x, enemy.y, 400 * U);
  if (!target) return;
  throwDagger(enemy.x, enemy.y, atan2(target.y - enemy.y, target.x - enemy.x),
    { minor: true, chain: true, generation: generation + 1, share: 0.8, life: 1 });
});

/* ===== 12-weapon-star.js ===== */
/*
 * Morning star: slow, heavy area hits at the tapped point.
 */

const STAR_SOURCE = { weapon: 'star', color: '#ffd9a0' };
const STAR_DOT = { weapon: 'star', dot: true };

/**
 * The impact itself, used by the attack and by the twin star.
 * Includes lvl 5 shockwave, lvl 15 stun and lvl 25 spikes. Returns the hit radius.
 */
function starSlam(x, y, share) {
  const level = S.lv.star;
  const damage = damageOf('star') * share;
  const radius = 60 * U * (1 + level * 0.003);

  addEffect(0.3, k => {
    ctx.globalAlpha = 1 - k * k;
    drawBall(ctx, x, y - 10 * U, 20 * U * (1.25 - 0.25 * Math.min(1, k * 4)), k * 2);
    ctx.globalAlpha = 1;
  });
  areaDamage(x, y, radius, damage, STAR_SOURCE, e => {
    if (level >= 15) e.stun = Math.max(e.stun, 1);
  });
  ring(x, y, radius, '255,217,160', 0.35, true);
  session.shake = Math.max(session.shake, 7);
  puff(x, y, '#c9a877', 10);

  if (level >= 5) {
    for (const e of world.enemies) {
      if (!e.dead && dist(x, y, e.x, e.y) < radius * 1.8 + e.r) knockback(e, 170);
    }
    ring(x, y, radius * 1.8, '255,255,255', 0.5, true);
  }
  if (level >= 25) {
    for (let i = 0; i < 8; i++) {
      addProjectile({
        kind: 'spike', x, y, angle: i * TAU / 8 + 0.39, speed: 330 * U, r: 7 * U,
        dmg: damage * 0.4, life: 0.7, pierce: 1, source: STAR_SOURCE,
      });
    }
  }
  return radius;
}

/** Ball that rolls a fixed distance through enemies; `splits` makes it break into three at the end. */
function rollBall(x, y, angle, { speed, r, dmg, range, splits }) {
  addProjectile({
    kind: 'ball', x, y, angle, speed, r, dmg, range, splits,
    travelled: 0, life: 5, pierce: 99, heavy: true, source: STAR_SOURCE,
  });
}

/* ---------- Abilities ---------- */

/** Lvl 60: a black hole pulls enemies to the impact point for 0.9 s (max. 3). */
function starBlackHole(a) {
  if (zoneCount('blackHole') >= 3) return;
  const { x, y } = a;
  addZone({
    tag: 'blackHole', dur: 0.9, under: true,
    update(zone, dt) {
      for (const e of world.enemies) {
        if (e.dead) continue;
        const d = dist(x, y, e.x, e.y);
        if (d >= 170 * U || d <= 6) continue;
        const step = (e.boss ? 35 : 110) * U * dt / d;
        e.x += (x - e.x) * step;
        e.y += (y - e.y) * step;
      }
    },
    draw(zone) {
      const alpha = zoneFade(zone, 6, 5);
      const hole = ctx.createRadialGradient(x, y, 2, x, y, 70 * U);
      hole.addColorStop(0, `rgba(20,8,40,${0.85 * alpha})`);
      hole.addColorStop(1, 'rgba(60,20,110,0)');
      ctx.fillStyle = hole;
      fillCircle(ctx, x, y, 70 * U);
      ctx.strokeStyle = `rgba(190,140,255,${0.7 * alpha})`;
      ctx.lineWidth = 2 * U;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(x, y, (22 + i * 16) * U, zone.t * 9 + i * 2, zone.t * 9 + i * 2 + 2.2);
        ctx.stroke();
      }
    },
  });
}

/** Lvl 30: a second, wider impact; it waits for the black hole when that is unlocked. */
function starAftershock(a) {
  const { x, y } = a;
  after(a.level >= 60 ? 1 : 0.5, () => {
    areaDamage(x, y, a.radius * 1.3, a.damage * 0.5, STAR_SOURCE);
    ring(x, y, a.radius * 1.3, '255,190,120', 0.45, true);
    session.shake = Math.max(session.shake, 6);
    puff(x, y, '#c9a877', 8);
  });
}

/** Lvl 40: the ground burns for 4 s (max. 6 patches). */
function starBurningGround(a) {
  if (zoneCount('burningGround') >= 6) return;
  const { x, y, radius } = a;
  addZone({
    tag: 'burningGround', dur: 4, under: true, tick: 0,
    update(zone, dt) {
      zone.tick += dt;
      if (zone.tick < 0.5) return;
      zone.tick = 0;
      areaDamage(x, y, radius, a.damage * 0.2, STAR_DOT);
    },
    draw(zone) {
      const alpha = zoneFade(zone, 4, 2);
      const glow = ctx.createRadialGradient(x, y, 2, x, y, radius);
      glow.addColorStop(0, `rgba(255,200,60,${0.55 * alpha})`);
      glow.addColorStop(0.7, `rgba(240,90,30,${0.4 * alpha})`);
      glow.addColorStop(1, 'rgba(240,90,30,0)');
      ctx.fillStyle = glow;
      fillEllipse(ctx, x, y, radius, radius * 0.8);
      for (let i = 0; i < 6; i++) {   // rising sparks
        const q = i * 1.05 + 1, rise = (zone.t * 1.6 + i * 0.37) % 1;
        ctx.fillStyle = `rgba(255,${150 + i * 15},40,${alpha * (1 - rise)})`;
        fillCircle(ctx, x + cos(q * 2.3) * radius * 0.6, y + sin(q * 1.7) * radius * 0.4 - rise * 22 * U, (5 - 3 * rise) * U);
      }
    },
  });
}

/** Lvl 50: the ball swings once around the castle on its chain. */
function starChainSwing(a) {
  addZone({
    dur: 0.8, struck: new Set(),
    update(zone) {
      zone.angle = a.angle + zone.t / zone.dur * TAU;
      zone.x = cx + cos(zone.angle) * 120 * U;
      zone.y = cy + sin(zone.angle) * 120 * U * 0.85;
      for (const e of world.enemies) {
        if (e.dead || zone.struck.has(e) || dist(zone.x, zone.y, e.x, e.y) >= 22 * U + e.r) continue;
        zone.struck.add(e);
        knockback(e, 140);
        hurt(e, a.damage, STAR_SOURCE);
      }
    },
    draw(zone) {
      if (zone.x === undefined) return;
      ctx.strokeStyle = '#59606e';
      ctx.lineWidth = 3 * U;
      ctx.setLineDash([5 * U, 4 * U]);
      ctx.beginPath();
      ctx.moveTo(cx, cy - 20 * U);
      ctx.lineTo(zone.x, zone.y);
      ctx.stroke();
      ctx.setLineDash([]);
      drawBall(ctx, zone.x, zone.y, 16 * U, zone.angle * 3);
    },
  });
}

/** Lvl 80: a fissure tears from the impact to the screen edge. */
function starFissure(a) {
  const { x, y, angle } = a;
  const length = 640 * U;
  const endX = x + cos(angle) * length, endY = y + sin(angle) * length;
  for (const e of world.enemies) {
    if (!e.dead && distToSegment(e.x, e.y, x, y, endX, endY) < 16 * U + e.r) hurt(e, a.damage * 1.2, STAR_SOURCE);
  }
  const zigzag = [];
  for (let i = 0; i <= 14; i++) zigzag.push(rnd(-9, 9) * U);
  addEffect(1.4, k => {
    const grown = Math.min(1, k * 6);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.globalAlpha = 1 - k * k;
    ctx.lineJoin = 'round';
    for (const [color, width] of [[INK, 9], ['#ff9a3c', 3]]) {   // dark crack with a glowing core
      ctx.strokeStyle = color;
      ctx.lineWidth = width * U * (1 - k * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (let i = 1; i <= 14 * grown; i++) ctx.lineTo(length * i / 14, zigzag[i]);
      ctx.stroke();
    }
    ctx.restore();
  }, { under: true });
}

/** Lvl 90: a second, slightly weaker slam on a random enemy. */
function starTwin(a) {
  after(0.25, () => {
    const alive = world.enemies.filter(e => !e.dead);
    const target = alive.length ? alive[Math.floor(rnd(alive.length))] : null;
    starSlam(target ? target.x : 2 * cx - a.x, target ? target.y : 2 * cy - a.y, 0.8);
  });
}

/** Lvl 100: a meteor hits 0.8 s later and leaves a burning crater (max. 4). */
function starMeteor(a) {
  const { x, y, radius } = a;
  addEffect(0.8, k => {
    const fall = k * k;
    const mx = x + (1 - fall) * 160 * U, my = y - (1 - fall) * 460 * U;
    ctx.fillStyle = `rgba(0,0,0,${0.3 * k})`;
    fillEllipse(ctx, x, y, radius * 2 * k, radius * 1.5 * k);
    ctx.strokeStyle = 'rgba(255,150,40,.7)';
    ctx.lineWidth = 20 * U;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mx + 50 * U, my - 140 * U);
    ctx.lineTo(mx, my);
    ctx.stroke();
    ctx.lineCap = 'butt';
    drawBall(ctx, mx, my, 34 * U, k * 8);
  });
  after(0.8, () => {
    areaDamage(x, y, radius * 2.2, a.damage * 4, STAR_SOURCE);
    ring(x, y, radius * 2.4, '255,160,60', 0.7);
    ring(x, y, radius * 1.5, '255,255,255', 0.5);
    session.shake = Math.max(session.shake, 18);
    puff(x, y, '#ff9a3c', 24);
    if (zoneCount('crater') >= 4) return;
    addZone({
      tag: 'crater', dur: 5, under: true, tick: 0,
      update(zone, dt) {
        zone.tick += dt;
        if (zone.tick < 0.5) return;
        zone.tick = 0;
        areaDamage(x, y, radius * 1.7, a.damage * 0.3, STAR_DOT);
      },
      draw(zone) {
        const alpha = Math.min(1, zone.dur - zone.t);
        const glow = ctx.createRadialGradient(x, y, 2, x, y, radius * 1.7);
        glow.addColorStop(0, `rgba(40,20,20,${0.75 * alpha})`);
        glow.addColorStop(0.6, `rgba(200,70,20,${0.5 * alpha})`);
        glow.addColorStop(1, 'rgba(255,140,40,0)');
        ctx.fillStyle = glow;
        fillEllipse(ctx, x, y, radius * 1.7, radius * 1.35);
      },
    });
  });
}

/* ---------- Attack ---------- */

WEAPONS.star.attack = function (x, y) {
  const level = S.lv.star;
  const a = { x, y, level, damage: damageOf('star'), angle: atan2(y - cy, x - cx) };

  a.radius = starSlam(x, y, 1);
  if (level >= 60) starBlackHole(a);
  if (level >= 10) rollBall(x, y, a.angle, { speed: 210 * U, r: 18 * U, dmg: a.damage * 0.6, range: 230 * U, splits: level >= 70 });
  if (level >= 30) starAftershock(a);
  if (level >= 40) starBurningGround(a);
  if (level >= 50) starChainSwing(a);
  if (level >= 80) starFissure(a);
  if (level >= 90) starTwin(a);
  if (level >= 100) starMeteor(a);
};

/* ---------- Projectile kinds ---------- */

PROJECTILE_KINDS.spike = {
  onHit(p) {
    if (p.pierce > 0) p.pierce--;
    else p.dead = true;
  },
  draw(p, angle) {
    ctx.fillStyle = '#cfd6de';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5 * U;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(9 * U, 0);
    ctx.lineTo(-6 * U, -4 * U);
    ctx.lineTo(-6 * U, 4 * U);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  },
};

PROJECTILE_KINDS.ball = {
  onHit(p, enemy) { knockback(enemy, 130); },
  onExpire(p) {
    if (p.splits) {
      // Lvl 70: break into three smaller balls that roll on
      const angle = atan2(p.vy, p.vx);
      for (const spread of [-0.7, 0, 0.7]) {
        rollBall(p.x, p.y, angle + spread, { speed: p.speed, r: p.r * 0.6, dmg: p.dmg * 0.6, range: 150 * U, splits: false });
      }
      puff(p.x, p.y, '#aab3c0', 8);
    }
    p.dead = true;
  },
  draw(p) {
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    fillEllipse(ctx, p.x, p.y + p.r * 0.7, p.r, p.r * 0.4);
    drawBall(ctx, p.x, p.y - p.r * 0.3, p.r * 0.8, p.travelled / p.r);
  },
};

/* ===== 13-weapon-bow.js ===== */
/*
 * Bow: fast, precise arrows from the castle towards the tapped point.
 */

const BOW_COLOR = '#ffe9b0';
const BOW_SOURCE = { weapon: 'bow', color: BOW_COLOR };
const PROJECTILE_LIMIT = 260;   // arrows and phoenixes are not fired above this many projectiles

/**
 * Shoots one arrow from the castle.
 *   opts.share   damage multiplier
 *   opts.minor   automatic arrow (ghost archer, arrow storm): never critical, bouncing or explosive
 *   opts.giant   the lvl-90 giant arrow: big, flies through everything
 */
function shootArrow(angle, opts = {}) {
  if (world.projectiles.length > PROJECTILE_LIMIT) return;
  const level = S.lv.bow;
  const aimed = !opts.minor && !opts.giant;
  let critical = false;
  if (aimed) {
    combat.bowShots++;
    critical = level >= 15 && combat.bowShots % 4 === 0;   // Lvl 15: every 4th aimed arrow deals triple damage
  }
  addProjectile({
    kind: 'arrow',
    x: cx + cos(angle) * 14 * U, y: cy - 4 * U + sin(angle) * 14 * U,
    angle, speed: (opts.giant ? 520 : 640) * U, r: (opts.giant ? 18 : 6) * U,
    dmg: damageOf('bow') * (opts.share || 1) * (critical ? 3 : 1),
    life: 1.6,
    pierce: opts.giant ? 99 : (level >= 10 ? 2 : 0),
    bounce: aimed && level >= 60 ? 2 : 0,
    explosive: aimed && level >= 40,
    giant: !!opts.giant, heavy: !!opts.giant, critical,
    source: { weapon: 'bow', color: critical ? '#ffe14a' : BOW_COLOR },
  });
}

/* ---------- Abilities ---------- */

/** Lvl 1/30: one arrow or a fan of five. */
function bowVolley(a) {
  if (a.level >= 30) for (let i = -2; i <= 2; i++) shootArrow(a.angle + i * 0.13);
  else shootArrow(a.angle);
}

/** Lvl 50: ten arrows rain on the tap point over one second. */
function bowHail(a) {
  for (let i = 0; i < 10; i++) {
    after(0.1 + i * 0.09, () => {
      const g = rnd(TAU), spread = rnd(0, 50) * U;
      const x = a.x + cos(g) * spread, y = a.y + sin(g) * spread * 0.85;
      addEffect(0.18, k => drawArrow(ctx, x + (1 - k) * 30 * U, y - (1 - k) * 150 * U, 1.77, 20 * U), { cap: FX_CAP_RARE });
      after(0.18, () => {
        areaDamage(x, y, 15 * U, a.damage * 0.7, BOW_SOURCE, e => {
          if (a.level >= 70) e.slow = 2.5;
          if (a.level >= 25) applyBurn(e, a.damage * 0.2);
        });
        ring(x, y, 15 * U, '255,233,176', 0.2, true);
      });
    });
  }
}

/** Lvl 80: a ghost archer on the tower shoots the nearest enemy for 4 s; attacking again extends him. */
function bowGhostArcher() {
  const existing = findZone('ghostArcher');
  if (existing) { existing.dur = existing.t + 4; return; }
  addZone({
    tag: 'ghostArcher', dur: 4, tick: 0,
    update(zone, dt) {
      zone.tick += dt;
      if (zone.tick < 0.35) return;
      zone.tick = 0;
      const target = nearestEnemy(cx, cy, 330 * U);
      if (target) shootArrow(atan2(target.y - cy, target.x - cx), { minor: true, share: 0.6 });
    },
    draw(zone) {
      const alpha = 0.75 * zoneFade(zone, 4, 3);
      const x = cx, y = cy - 52 * U * CASTLE_SCALE - 10 * U;   // just above the keep's roof
      ctx.fillStyle = `rgba(170,220,255,${alpha})`;
      fillCircle(ctx, x, y - 7 * U, 4 * U);
      ctx.beginPath();
      ctx.moveTo(x - 5 * U, y + 6 * U);
      ctx.quadraticCurveTo(x, y - 10 * U, x + 5 * U, y + 6 * U);
      ctx.fill();
      ctx.globalAlpha = alpha;
      drawBow(ctx, x + 5 * U, y - U, 0, 6 * U);
      ctx.globalAlpha = 1;
    },
  });
}

/* ---------- Attack ---------- */

WEAPONS.bow.attack = function (x, y) {
  const level = S.lv.bow;
  const a = { x, y, level, damage: damageOf('bow'), angle: atan2(y - cy, x - cx) };

  bowVolley(a);
  if (level >= 5) after(0.09, () => bowVolley(a));                           // double shot
  if (level >= 50) bowHail(a);
  if (level >= 80) bowGhostArcher();
  if (level >= 90 && combat.attackCount % 3 === 0) shootArrow(a.angle, { giant: true, share: 3 });
  if (level >= 100) {
    for (let i = 0; i < 16; i++) shootArrow(a.angle + (i + 0.5) * TAU / 16, { minor: true, share: 0.7 });   // arrow storm
  }
  // Lvl 10 pierce, 15 critical, 25 fire, 40 explosive, 60 ricochet and 70 frost live in the projectile below.
};

/* ---------- Projectile kind ---------- */

PROJECTILE_KINDS.arrow = {
  onHit(p, enemy) {
    const level = S.lv.bow;
    if (level >= 25) applyBurn(enemy, p.dmg * 0.25);
    if (level >= 70) enemy.slow = 2.5;
    if (p.explosive && !p.hasExploded) {
      p.hasExploded = true;
      areaDamage(p.x, p.y, 30 * U, p.dmg * 0.6, p.source);
      ring(p.x, p.y, 30 * U, '255,200,120', 0.25);
    }
    if (pierceOrBounce(p, 200 * U, 0.5)) return;
    p.dead = true;
  },
  draw(p, angle) {
    const level = S.lv.bow;
    if (p.critical || p.giant) {
      ctx.shadowColor = p.critical ? '#ffe14a' : '#9fd8ff';
      ctx.shadowBlur = 10 * U;
    }
    drawArrow(ctx, p.x, p.y, angle, (p.giant ? 46 : 20) * U, level >= 25 ? '#ffb36b' : '#f3e3c0', level >= 70 ? '#bfe9ff' : '#dfe6ee');
    ctx.shadowBlur = 0;
  },
};

/* ===== 14-weapon-wand.js ===== */
/*
 * Fire wand: fireballs that explode at the tapped point and set enemies on fire.
 */

const WAND_SOURCE = { weapon: 'wand', color: '#ffb36b' };
const WAND_DOT = { weapon: 'wand', dot: true };
const BURN_SHARE = 0.25;   // burn damage per second as a share of the wand's hit damage

/** Explosion: damages everything in `radius`; from lvl 5 it also sets enemies on fire. */
function explode(x, y, radius, damage, source) {
  areaDamage(x, y, radius, damage, source, e => {
    if (S.lv.wand >= 5) applyBurn(e, damageOf('wand') * BURN_SHARE);
  });
  addEffect(0.3, k => {
    const r = radius * (0.55 + 0.6 * k);
    const flash = ctx.createRadialGradient(x, y, 1, x, y, r);
    flash.addColorStop(0, `rgba(255,244,180,${0.95 * (1 - k)})`);
    flash.addColorStop(0.6, `rgba(255,140,40,${0.7 * (1 - k)})`);
    flash.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = flash;
    fillCircle(ctx, x, y, r);
  }, { cap: FX_CAP_RARE });
  if (world.particles.length < 200) puff(x, y, '#ff9a3c', 4);
}

/** A fireball arcs from the keep to (x, y) and explodes there. */
function throwFireball(x, y, radius, damage) {
  const startX = cx, startY = cy - 30 * U * CASTLE_SCALE;
  const flight = clamp(dist(startX, startY, x, y) / (420 * U), 0.12, 0.5);
  addEffect(flight, k => {
    const bx = startX + (x - startX) * k;
    const by = startY + (y - startY) * k - sin(k * PI) * 26 * U;
    ctx.fillStyle = 'rgba(255,150,40,.35)';
    fillCircle(ctx, bx, by, 10 * U);
    drawFlame(ctx, bx, by + 3 * U, 7 * U, k * 30);
  });
  after(flight, () => {
    explode(x, y, radius, damage, WAND_SOURCE);
    session.shake = Math.max(session.shake, 3);
  });
}

/** A burning line on the ground; enemies touching it burn and take `share` of the damage per tick. */
function fireLine(tag, limit, x1, y1, x2, y2, dur, width, share, damage) {
  if (zoneCount(tag) >= limit) return;
  const flames = Math.max(3, Math.round(dist(x1, y1, x2, y2) / (14 * U)));
  addZone({
    tag, dur, under: true, tick: 0.4,
    update(zone, dt) {
      zone.tick += dt;
      if (zone.tick < 0.4) return;
      zone.tick = 0;
      for (const e of world.enemies) {
        if (e.dead || distToSegment(e.x, e.y, x1, y1, x2, y2) >= width + e.r) continue;
        applyBurn(e, damage * BURN_SHARE);
        hurt(e, damage * share, WAND_DOT);
      }
    },
    draw(zone) {
      const alpha = zoneFade(zone, 5, 2);
      ctx.strokeStyle = `rgba(255,110,30,${0.4 * alpha})`;
      ctx.lineWidth = width * 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.globalAlpha = alpha;
      for (let i = 0; i <= flames; i++) {
        const q = i / flames;
        drawFlame(ctx, x1 + (x2 - x1) * q, y1 + (y2 - y1) * q, width * (0.7 + 0.25 * sin(zone.t * 9 + i * 2.1)), zone.t * 12 + i);
      }
      ctx.globalAlpha = 1;
    },
  });
}

/* ---------- Abilities ---------- */

/** Lvl 40: a fire spirit circles the castle for 5 s; attacking again extends it. */
function wandSpirit(a) {
  const existing = findZone('fireSpirit');
  if (existing) { existing.dur = existing.t + 5; return; }
  addZone({
    tag: 'fireSpirit', dur: 5,
    update(zone) {
      const g = zone.t * 3.2;
      zone.x = cx + cos(g) * 78 * U;
      zone.y = cy + sin(g) * 78 * U * 0.85;
      for (const e of world.enemies) {
        if (e.dead || e.orbitCd > 0 || dist(zone.x, zone.y, e.x, e.y) >= 16 * U + e.r) continue;
        e.orbitCd = 0.35;
        applyBurn(e, a.damage * BURN_SHARE);
        hurt(e, a.damage * 0.6, WAND_SOURCE);
      }
    },
    draw(zone) {
      if (zone.x === undefined) return;
      ctx.globalAlpha = zoneFade(zone, 4, 3);
      drawFlame(ctx, zone.x, zone.y, 13 * U, zone.t * 16);
      ctx.fillStyle = INK;   // eyes
      ctx.beginPath();
      ctx.arc(zone.x - 3 * U, zone.y - 2 * U, 1.5 * U, 0, TAU);
      ctx.arc(zone.x + 3 * U, zone.y - 2 * U, 1.5 * U, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    },
  });
}

/** Lvl 50: a lava pool at the tap point burns and slows for 5 s (max. 4). */
function wandLavaPool(a) {
  if (zoneCount('lavaPool') >= 4) return;
  const { x, y } = a;
  addZone({
    tag: 'lavaPool', dur: 5, under: true, tick: 0,
    update(zone, dt) {
      zone.tick += dt;
      if (zone.tick < 0.5) return;
      zone.tick = 0;
      areaDamage(x, y, 48 * U, a.damage * 0.3, WAND_DOT, e => {
        e.slow = Math.max(e.slow, 1);
        applyBurn(e, a.damage * BURN_SHARE);
      });
    },
    draw(zone) {
      const alpha = zoneFade(zone, 4, 2);
      const lava = ctx.createRadialGradient(x, y, 2, x, y, 48 * U);
      lava.addColorStop(0, `rgba(255,220,90,${0.8 * alpha})`);
      lava.addColorStop(0.6, `rgba(240,90,20,${0.65 * alpha})`);
      lava.addColorStop(1, `rgba(90,20,10,${0.5 * alpha})`);
      ctx.fillStyle = lava;
      fillEllipse(ctx, x, y, 48 * U, 38 * U);
      ctx.fillStyle = `rgba(255,240,170,${0.7 * alpha})`;
      for (let i = 0; i < 5; i++) {   // bubbles
        const q = (zone.t * 0.9 + i * 0.21) % 1, g = i * 1.9;
        fillCircle(ctx, x + cos(g) * 26 * U, y + sin(g) * 18 * U, (1 - Math.abs(q - 0.5) * 2) * 5 * U);
      }
    },
  });
}

/** Lvl 60, every 2nd attack: a phoenix crosses the field at the tap height, alternating sides. */
function wandPhoenix(a) {
  if (world.projectiles.length >= PROJECTILE_LIMIT) return;
  const fromLeft = combat.attackCount % 4 === 0;
  addProjectile({
    kind: 'phoenix', x: fromLeft ? -30 : W + 30, y: a.y, angle: fromLeft ? 0 : PI, speed: 520 * U, r: 24 * U,
    dmg: a.damage * 2, life: 3, pierce: 99, heavy: true, source: WAND_SOURCE,
  });
}

/** Lvl 70: eight embers rain around the tap point. */
function wandEmberRain(a) {
  for (let i = 0; i < 8; i++) {
    after(0.15 + i * 0.11, () => {
      const g = rnd(TAU), spread = rnd(20, 90) * U;
      const x = a.x + cos(g) * spread, y = a.y + sin(g) * spread * 0.85;
      addEffect(0.2, k => drawFlame(ctx, x + (1 - k) * 40 * U, y - (1 - k) * 170 * U, 6 * U, k * 20), { cap: FX_CAP_RARE });
      after(0.2, () => explode(x, y, 22 * U, a.damage * 0.6, WAND_SOURCE));
    });
  }
}

/** Lvl 80: a fire tornado wanders towards enemies for 5 s (max. 2). */
function wandTornado(a) {
  if (zoneCount('fireTornado') >= 2) return;
  addZone({
    tag: 'fireTornado', dur: 5, tick: 0, x: a.x, y: a.y,
    update(zone, dt) {
      const target = nearestEnemy(zone.x, zone.y, 400 * U);
      if (target) {
        const d = dist(zone.x, zone.y, target.x, target.y) || 1;
        zone.x += (target.x - zone.x) / d * 60 * U * dt;
        zone.y += (target.y - zone.y) / d * 60 * U * dt;
      }
      zone.tick += dt;
      if (zone.tick < 0.3) return;
      zone.tick = 0;
      areaDamage(zone.x, zone.y, 30 * U, a.damage * 0.4, WAND_DOT, e => applyBurn(e, a.damage * BURN_SHARE));
    },
    draw(zone) {
      const alpha = zoneFade(zone, 4, 2);
      for (let i = 0; i < 6; i++) {   // stacked rings, wider towards the top
        const q = i / 5, width = (8 + q * 20) * U;
        ctx.fillStyle = `rgba(255,${190 - i * 20},${70 - i * 8},${0.45 * alpha})`;
        fillEllipse(ctx, zone.x + sin(zone.t * 9 + i * 1.3) * 5 * U, zone.y - q * 46 * U, width, width * 0.32);
      }
    },
  });
}

/** Lvl 90, every 3rd attack: a sun beam from the castle through the tap point to the screen edge. */
function wandSunBeam(a) {
  const length = 640 * U;
  const x1 = cx + cos(a.angle) * 16 * U, y1 = cy + sin(a.angle) * 16 * U;
  const x2 = x1 + cos(a.angle) * length, y2 = y1 + sin(a.angle) * length;
  for (const e of world.enemies) {
    if (e.dead || distToSegment(e.x, e.y, x1, y1, x2, y2) >= 18 * U + e.r) continue;
    applyBurn(e, a.damage * BURN_SHARE);
    hurt(e, a.damage * 2.5, WAND_SOURCE);
  }
  addEffect(0.35, k => {
    ctx.save();
    ctx.translate(x1, y1);
    ctx.rotate(a.angle);
    ctx.globalAlpha = 1 - k * k;
    ctx.fillStyle = 'rgba(255,170,50,.55)';
    ctx.fillRect(0, -18 * U * (1 - k * 0.5), length, 36 * U * (1 - k * 0.5));
    ctx.fillStyle = '#fff6c8';
    ctx.fillRect(0, -6 * U * (1 - k), length, 12 * U * (1 - k));
    ctx.restore();
  });
}

/** Lvl 100, every 4th attack: after a short charge a supernova hits everything around the castle. */
function wandSupernova(a) {
  const reach = 330 * U;
  addEffect(0.6, k => {
    ctx.globalAlpha = k;
    drawFlame(ctx, cx, cy - 40 * U * CASTLE_SCALE, (10 + k * 26) * U, k * 30);
    ctx.globalAlpha = 1;
  });
  after(0.6, () => {
    areaDamage(cx, cy, reach, a.damage * 4, WAND_SOURCE, e => applyBurn(e, a.damage * BURN_SHARE, 4));
    session.shake = Math.max(session.shake, 14);
    addEffect(0.6, k => {
      const r = reach * k;
      const shell = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r + 1);
      shell.addColorStop(0, 'rgba(255,160,40,0)');
      shell.addColorStop(0.8, `rgba(255,200,90,${0.6 * (1 - k)})`);
      shell.addColorStop(1, 'rgba(255,255,220,0)');
      ctx.fillStyle = shell;
      fillCircle(ctx, cx, cy, r + 1);
    });
  });
}

/* ---------- Attack ---------- */

WEAPONS.wand.attack = function (x, y) {
  const level = S.lv.wand;
  const a = { x, y, level, damage: damageOf('wand'), angle: atan2(y - cy, x - cx) };
  const radius = 44 * U * (1 + level * 0.003);
  // unit vector across the throwing direction, for the twin fireballs and the flame wall
  const sideX = cos(a.angle + PI / 2), sideY = sin(a.angle + PI / 2);

  if (level >= 10) {
    throwFireball(x + sideX * 26 * U, y + sideY * 26 * U, radius, a.damage);
    throwFireball(x - sideX * 26 * U, y - sideY * 26 * U, radius, a.damage);
  } else {
    throwFireball(x, y, radius, a.damage);
  }
  if (level >= 15) {   // fire trail from the castle to the tap point
    fireLine('fireTrail', 5, cx + cos(a.angle) * 30 * U, cy + sin(a.angle) * 30 * U, x, y, 2.5, 9 * U, 0.15, a.damage);
  }
  if (level >= 30) {   // flame wall across the tap point
    fireLine('flameWall', 4, x - sideX * 60 * U, y - sideY * 60 * U, x + sideX * 60 * U, y + sideY * 60 * U, 4, 11 * U, 0.3, a.damage);
  }
  if (level >= 40) wandSpirit(a);
  if (level >= 50) wandLavaPool(a);
  if (level >= 60 && combat.attackCount % 2 === 0) wandPhoenix(a);
  if (level >= 70) wandEmberRain(a);
  if (level >= 80) wandTornado(a);
  if (level >= 90 && combat.attackCount % 3 === 0) wandSunBeam(a);
  if (level >= 100 && combat.attackCount % 4 === 0) wandSupernova(a);
};

/* ---------- Projectile kind and kill hook ---------- */

PROJECTILE_KINDS.phoenix = {
  onHit(p, enemy) { applyBurn(enemy, damageOf('wand') * BURN_SHARE); },
  draw(p) {
    const dir = p.vx > 0 ? 1 : -1, flap = sin(session.time * 18) * 0.5;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(dir, 1);
    ctx.fillStyle = 'rgba(255,150,40,.85)';
    for (const side of [-1, 1]) {   // wings
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-8 * U, side * (18 + flap * 10) * U, -30 * U, side * (22 + flap * 14) * U);
      ctx.quadraticCurveTo(-12 * U, side * 6 * U, -22 * U, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    drawFlame(ctx, p.x, p.y + 4 * U, 13 * U, session.time * 20);
    ctx.fillStyle = 'rgba(255,170,60,.3)';   // trail
    fillEllipse(ctx, p.x - dir * 26 * U, p.y, 30 * U, 7 * U);
  },
};

/**
 * Lvl 25: burning enemies explode when they die. The explosion can ignite and
 * kill further enemies, so the chain is limited to 3 links and 10 per frame.
 */
KILL_HOOKS.push((enemy, source) => {
  if (enemy.burn <= 0 || S.lv.wand < 25) return;
  const link = source.chain || 0;
  if (link >= 3 || combat.chainBooms >= 10) return;
  combat.chainBooms++;
  const { x, y } = enemy;
  after(0.08, () => explode(x, y, 30 * U, damageOf('wand') * 0.5, { weapon: 'wand', chain: link + 1, color: '#ffb36b' }));
});

/* ===== 20-defenders.js ===== */
/*
 * What defends the castle besides the player's weapon: the wall, the castle's
 * own lives and the little soldiers.
 */

/** An enemy reached the wall: it loses one hit point. */
function wallHit(x, y) {
  sound(160, 0.12, 'square', 0.05, -60);
  vibrate(25);
  S.wallHp--;
  session.shake = Math.max(session.shake, 4);
  puff(x, y, '#b9b4ad', 7);
  renderHud();
  if (S.wallHp <= 0) {
    puff(cx, wallCenterY(), '#b9b4ad', 30);
    toast('Die Mauer ist gefallen');
  }
}

/** An enemy reached the castle: it loses one life; at zero the battle is lost. */
function castleHit() {
  sound(90, 0.2, 'sawtooth', 0.07);
  vibrate(60);
  castle.hp--;
  castle.flash = 0.3;
  session.shake = Math.max(session.shake, 10);
  puff(cx, cy, '#efe7d4', 8);
  renderHud();
  if (castle.hp <= 0) castle.fallen = true;   // handled at the end of update(), see 40-main.js
}

/* ---------- Soldiers ---------- */

const SOLDIER_RADIUS = () => 5.5 * U;
const SOLDIER_HIT_INTERVAL = 0.8;    // seconds between a soldier's hits
const ENEMY_HIT_INTERVAL = 1.2;      // seconds between an enemy's hits on a soldier

function spawnSoldier() {
  world.soldiers.push({
    x: cx, y: cy + 13 * U,           // the castle gate
    hp: soldierHp(), maxHp: soldierHp(),   // 3 hits, 5 with the armour upgrade
    attackCd: 0,
    flash: 0, swing: 0,              // hit flash and sword swing, seconds
    walking: false, facing: 1,       // facing: 1 = right, -1 = left
    phase: rnd(TAU),
    guardAngle: rnd(0.25, PI - 0.25),   // where he waits in front of the castle when idle
  });
}

/** Soldier damage is deliberately tiny: they are there to hold enemies up, not to kill. */
const soldierDamage = () => 2 * (1 + 0.15 * (S.wave - 1));

function updateSoldiers(dt) {
  if (S.own.soldier) {
    session.soldierTimer -= dt;
    if (session.soldierTimer <= 0) {
      session.soldierTimer = SOLDIER_INTERVALS[S.solLv];
      if (world.soldiers.length < soldierCap()) spawnSoldier();
    }
  }

  for (const soldier of world.soldiers) {
    soldier.flash -= dt;
    soldier.attackCd -= dt;
    soldier.swing -= dt;
    soldier.walking = false;

    const enemy = nearestEnemy(soldier.x, soldier.y, 260 * U);
    if (!enemy) {
      walkToGuardPost(soldier, dt);
      continue;
    }
    soldier.facing = enemy.x < soldier.x ? -1 : 1;
    const gap = dist(soldier.x, soldier.y, enemy.x, enemy.y);
    if (gap > enemy.r + SOLDIER_RADIUS() + 2 * U) {
      moveTowards(soldier, enemy.x, enemy.y, 48 * U * dt);
      continue;
    }
    // In contact: the enemy stops walking and trades blows with the soldier.
    if (enemy.freeze <= 0 && enemy.stun <= 0) {
      enemy.blocked = 0.15;   // refreshed every frame while in contact
      if (enemy.attackCd <= 0) {
        enemy.attackCd = ENEMY_HIT_INTERVAL;
        soldier.hp--;
        soldier.flash = 0.15;
        puff(soldier.x, soldier.y - 6 * U, '#cfe3ff', 4);
      }
    }
    if (soldier.attackCd <= 0) {
      soldier.attackCd = SOLDIER_HIT_INTERVAL;
      soldier.swing = 0.2;
      hurt(enemy, soldierDamage(), { weapon: 'soldier', color: '#cfe3ff' });
    }
  }
  world.soldiers = world.soldiers.filter(soldier => soldier.hp > 0);
}

/* ---------- Tower archer ---------- */

const TOWER_INTERVAL = 1.5;          // seconds between shots
const TOWER_RANGE = () => 300 * U;

/** Shop upgrade: an archer on the keep shoots the nearest enemy on his own. */
function updateTowerArcher(dt) {
  if (!S.own.tower) return;
  session.towerTimer -= dt;
  if (session.towerTimer > 0) return;
  const target = nearestEnemy(cx, cy, TOWER_RANGE());
  if (!target) return;                       // stay ready and shoot as soon as someone comes close
  session.towerTimer = TOWER_INTERVAL;
  const fromY = cy - 50 * U * CASTLE_SCALE;
  addProjectile({
    kind: 'towerBolt', x: cx, y: fromY, angle: atan2(target.y - fromY, target.x - cx), speed: 520 * U, r: 6 * U,
    dmg: damageOf(S.active) * 0.5,           // half a hit of the weapon in hand, so he scales with the player
    life: 1.2, source: { weapon: 'tower', color: '#e8e0ff' },
  });
}

PROJECTILE_KINDS.towerBolt = {
  onHit(p) { p.dead = true; },
  draw(p, angle) { drawArrow(ctx, p.x, p.y, angle, 16 * U, '#d9ccff', '#eef4ff'); },
};

function walkToGuardPost(soldier, dt) {
  const postX = cx + cos(soldier.guardAngle) * 64 * U;
  const postY = cy + 20 * U + sin(soldier.guardAngle) * 34 * U;
  if (dist(soldier.x, soldier.y, postX, postY) <= 3 * U) return;
  soldier.facing = postX < soldier.x ? -1 : 1;
  moveTowards(soldier, postX, postY, 40 * U * dt);
}

function moveTowards(soldier, x, y, step) {
  const d = dist(soldier.x, soldier.y, x, y) || 1;
  soldier.x += (x - soldier.x) / d * step;
  soldier.y += (y - soldier.y) / d * step;
  soldier.walking = true;
}

/* ===== 21-waves.js ===== */
/*
 * Wave flow: building a wave, spawning it, clearing it, choosing a wave with
 * the arrows, and what happens after a defeat.
 */

/** Fills the spawn queue for the current wave S.wave. */
function buildWave() {
  const waveNo = S.wave;
  const count = currentWorld().count(waveNo);
  wave.queue = [];
  for (let i = 0; i < count; i++) wave.queue.push(rollEnemyType(waveNo));
  if (waveNo % BOSS_EVERY === 0) wave.queue.splice(Math.floor(wave.queue.length / 2), 0, 'boss');   // boss arrives mid-wave
  wave.spawnGap = spawnGapFor(count);
  wave.spawnTimer = 0;
  wave.total = wave.queue.length;
}

/** Clears the field and starts the current wave over. `all` also removes the soldiers. */
function restartWave(all) {
  clearField(all);
  wave.pause = 1.5;
  buildWave();
}

/** One frame of wave flow: wait, spawn, or finish the wave when nothing is left. */
function updateWave(dt) {
  if (wave.pause > 0) {
    wave.pause -= dt;
  } else if (wave.queue.length) {
    // Enemies come one by one. If the field is full the timer may run up to
    // three spawns behind, so the backlog arrives quickly once there is room.
    wave.spawnTimer = Math.max(wave.spawnTimer - dt, -wave.spawnGap * 3);
    while (wave.spawnTimer <= 0 && wave.queue.length && world.enemies.length < MAX_ENEMIES_ALIVE) {
      spawnEnemy(wave.queue.shift());
      wave.spawnTimer += wave.spawnGap;
    }
  } else if (!world.enemies.length) {
    completeWave();
  }
}

function completeWave() {
  const waveNo = S.wave;
  let gold = 0;
  if (waveNo > S.cleared) {     // gold only for waves cleared for the first time
    const wasLocked = !lavaUnlocked();
    S.cleared = waveNo;
    gold = Math.round(waveNo * currentWorld().goldMult * goldFactor());
    earnGold(gold);
    sound(1200, 0.07, 'triangle', 0.05);
    if (wasLocked && lavaUnlocked()) toast('Die Lava-Welt ist offen!', 'Wechsle die Welt mit dem Knopf oben');
  }
  castle.hp = Math.min(maxHp(), castle.hp + S.heal);
  if (!S.hold) S.wave++;
  wave.pause = 2.5;
  buildWave();
  toast('Welle ' + waveNo + ' geschafft', gold ? '+' + gold + ' Gold' : '');
  checkAchievements();
  save();
  renderHud();
  if (waveNo % CHEST_EVERY === 0) offerChest(waveNo);
}

/** Wave arrows: jump to any wave up to the first one not cleared yet. Resets the enemies. */
function setWave(waveNo) {
  waveNo = clamp(waveNo, 1, S.cleared + 1);
  if (waveNo === S.wave || session.paused) return;
  S.wave = waveNo;
  restartWave(false);
  renderHud();
  save();
  toast('Welle ' + waveNo);
}

/** The castle fell: stop all feedback and open the shop. */
function handleDefeat() {
  castle.fallen = false;
  S.stats.defeats++;
  session.shake = 0;        // otherwise the frozen screen would keep shaking behind the shop
  castle.flash = 0;
  combo.count = 0;
  sound(220, 0.5, 'sawtooth', 0.07, -160);
  vibrate(200);
  restartWave(true);
  openShop();
}

/** Leaving the shop after a defeat: back to wave 1 with full lives and a repaired wall; chest boons end. */
function continueAfterDefeat() {
  S.wave = 1;
  S.wallHp = wallMax();
  S.run = { boons: {}, chests: [] };
  castle.hp = maxHp();
  combat.cooldown = 0;
  restartWave(true);
}

/** Switches to another world; each world keeps its own wave and progress. */
function switchWorld(id) {
  if (id === S.world || !WORLDS[id]) return;
  const leaving = { wave: S.wave, cleared: S.cleared };
  S.wave = S.parked.wave;
  S.cleared = S.parked.cleared;
  S.parked = leaving;
  S.world = id;
  makeGround();
  restartWave(true);
  renderHud();
  save();
  toast(WORLDS[id].name, 'Welle ' + S.wave);
}

/** Share of the wave that is already dealt with, 0..100, for the progress bar. */
const waveProgress = () => Math.round((1 - (wave.queue.length + world.enemies.length) / Math.max(1, wave.total)) * 100);

/* ===== 22-progress.js ===== */
/*
 * Long-term progress: statistics, achievements and the chest that appears
 * every tenth wave.
 */

/** All gold income goes through here so the statistics stay correct. */
function earnGold(amount) {
  S.gold += amount;
  S.stats.goldEarned += amount;
}

/** Called for every enemy killed by the player's side (not for enemies that reach the castle). */
function recordKill(enemy) {
  S.stats.kills++;
  if (enemy.boss) S.stats.bosses++;
  if (combo.count + 1 > S.stats.bestCombo) S.stats.bestCombo = combo.count + 1;
}

/* ---------- Achievements ---------- */

/*
 * Each achievement pays its gold reward once per save.
 *   done()  true as soon as the goal is reached
 */
const highestWave = worldId => (S.world === worldId ? S.cleared : S.parked.cleared);
const highestLevel = () => Math.max(...WEAPON_IDS.map(id => S.lv[id]));

const ACHIEVEMENTS = [
  { id: 'kills100', name: 'Monsterjäger', text: '100 Gegner besiegt', gold: 5, done: () => S.stats.kills >= 100 },
  { id: 'kills1000', name: 'Monsterschreck', text: '1.000 Gegner besiegt', gold: 25, done: () => S.stats.kills >= 1000 },
  { id: 'kills10000', name: 'Legende', text: '10.000 Gegner besiegt', gold: 100, done: () => S.stats.kills >= 10000 },
  { id: 'combo25', name: 'In Fahrt', text: 'Serie von 25 Treffern', gold: 5, done: () => S.stats.bestCombo >= 25 },
  { id: 'combo100', name: 'Unaufhaltsam', text: 'Serie von 100 Treffern', gold: 30, done: () => S.stats.bestCombo >= 100 },
  { id: 'boss', name: 'Königsmörder', text: 'Ersten Boss besiegt', gold: 5, done: () => S.stats.bosses >= 1 },
  { id: 'wave10', name: 'Standhaft', text: 'Welle 10 geschafft', gold: 10, done: () => highestWave('meadow') >= 10 },
  { id: 'wave25', name: 'Bollwerk', text: 'Welle 25 geschafft', gold: 25, done: () => highestWave('meadow') >= 25 },
  { id: 'wave50', name: 'Festung', text: 'Welle 50 geschafft', gold: 60, done: () => highestWave('meadow') >= 50 },
  { id: 'wave100', name: 'Herr der Wiese', text: 'Welle 100 geschafft', gold: 200, done: () => highestWave('meadow') >= 100 },
  { id: 'arsenal', name: 'Waffenkammer', text: 'Alle fünf Waffen im Besitz', gold: 30, done: () => WEAPON_IDS.every(owned) },
  { id: 'level50', name: 'Meister', text: 'Eine Waffe auf Level 50', gold: 30, done: () => highestLevel() >= 50 },
  { id: 'level100', name: 'Großmeister', text: 'Eine Waffe auf Level 100', gold: 100, done: () => highestLevel() >= 100 },
  { id: 'lava', name: 'Feuertaufe', text: 'Erste Lava-Welle geschafft', gold: 50, done: () => highestWave('lava') >= 1 },
];

/** Rewards every achievement that was reached since the last check. Cheap; called about once a second. */
function checkAchievements() {
  if (!debugFlags.achievements || slot < 0) return;
  for (const achievement of ACHIEVEMENTS) {
    if (S.ach[achievement.id] || !achievement.done()) continue;
    S.ach[achievement.id] = true;
    earnGold(achievement.gold);
    toast('Erfolg: ' + achievement.name, '+' + achievement.gold + ' Gold');
    sound(1000, 0.1, 'triangle', 0.05, 400);
    renderHud();
    save();
  }
}

/** Statistics and achievement list, opened from the pause menu. */
function showStats() {
  const row = (label, value, className = '') => {
    const el = document.createElement('div');
    el.className = 'stat ' + className;
    const name = document.createElement('span'), amount = document.createElement('b');
    name.textContent = label;
    amount.textContent = value;
    el.append(name, amount);
    return el;
  };
  const number = n => n.toLocaleString('de-DE');
  const body = [
    row('Besiegte Gegner', number(S.stats.kills)),
    row('Besiegte Bosse', number(S.stats.bosses)),
    row('Längste Serie', '×' + number(S.stats.bestCombo)),
    row('Höchste Welle (Wiese)', highestWave('meadow')),
  ];
  if (lavaUnlocked()) body.push(row('Höchste Welle (Lava)', highestWave('lava')));
  body.push(row('Gold verdient', number(S.stats.goldEarned)), row('Niederlagen', number(S.stats.defeats)));

  const boons = activeBoonNames();
  if (boons.length) body.push(row('Truhen-Boni', boons.join(', '), 'wide'));

  const heading = document.createElement('h3');
  heading.textContent = 'Erfolge ' + Object.keys(S.ach).length + ' / ' + ACHIEVEMENTS.length;
  body.push(heading);
  for (const achievement of ACHIEVEMENTS) {
    body.push(row(achievement.name + ' – ' + achievement.text, S.ach[achievement.id] ? '✓' : achievement.gold + ' Gold', S.ach[achievement.id] ? 'done' : 'open'));
  }
  showDialog({ title: 'Statistik', body, buttons: [{ label: 'Schließen' }] });
}

/* ---------- Chest every tenth wave ---------- */

const CHEST_EVERY = 10;

/*
 * Boons from the chest. Lasting boons are counted in S.run.boons and read via
 * boonFactor() in 03-state.js; they end with the next defeat. Instant boons
 * apply once. `available()` hides boons that would do nothing right now.
 */
const BOONS = [
  { id: 'damage', name: 'Scharfe Klingen', text: '+25 % Schaden für alle Waffen' },
  { id: 'speed', name: 'Flinke Hände', text: 'Alle Waffen greifen 20 % schneller an' },
  { id: 'xp', name: 'Lehrmeister', text: '+50 % XP' },
  { id: 'gold', name: 'Schatzkarte', text: '+50 % Gold für neue Wellen' },
  { id: 'feast', name: 'Festmahl', text: 'Die Burg wird sofort voll geheilt', instant: () => { castle.hp = maxHp(); }, available: () => castle.hp < maxHp() },
  { id: 'mason', name: 'Maurer', text: 'Die Mauer wird sofort repariert', instant: () => { S.wallHp = wallMax(); }, available: () => S.wallHp < wallMax() },
];

const activeBoonNames = () => BOONS.filter(boon => S.run.boons[boon.id]).map(boon => boon.name + (S.run.boons[boon.id] > 1 ? ' ×' + S.run.boons[boon.id] : ''));

function takeBoon(boon) {
  if (boon.instant) boon.instant();
  else S.run.boons[boon.id] = (S.run.boons[boon.id] || 0) + 1;
  sound(880, 0.12, 'triangle', 0.05, 440);
  save();
  renderHud();
}

/** After clearing wave 10, 20, ...: pick one of three random boons. Once per wave number and run. */
function offerChest(waveNo) {
  const key = S.world + ':' + waveNo;
  if (!debugFlags.chests || S.run.chests.includes(key)) return;
  S.run.chests.push(key);
  const pool = BOONS.filter(boon => !boon.available || boon.available());
  const choices = [];
  while (choices.length < 3 && pool.length) choices.push(pool.splice(Math.floor(rnd(pool.length)), 1)[0]);
  showDialog({
    title: 'Schatztruhe',
    text: 'Wähle einen Bonus. Dauerhafte Boni gelten bis zur nächsten Niederlage.',
    dismissable: false,
    buttons: choices.map(boon => ({ label: boon.name, detail: boon.text, action: () => takeBoon(boon) })),
  });
}

/* ===== 30-hud.js ===== */
/*
 * In-game interface: toasts, the top bar, the weapon bar with its info line,
 * and gaining XP (which is mostly a display matter: bars, toasts, level-ups).
 */

/* ---------- Toasts ---------- */

const toastEl = $('toast');
const toastQueue = [];
let toastBusy = false;

/** Shows a short message below the top bar; `detail` is an optional second line. */
function toast(title, detail) {
  toastQueue.push([title, detail]);
  if (!toastBusy) showNextToast();
}
function showNextToast() {
  const next = toastQueue.shift();
  if (!next) { toastBusy = false; return; }
  toastBusy = true;
  const [title, detail] = next;
  toastEl.textContent = title;
  if (detail) {
    const line = document.createElement('small');
    line.textContent = detail;
    toastEl.appendChild(line);
  }
  toastEl.classList.add('on');
  setTimeout(() => {
    toastEl.classList.remove('on');
    setTimeout(showNextToast, 280);
  }, detail ? 2600 : 1500);
}

/* ---------- Top bar and weapon bar ---------- */

/** Redraws every DOM part of the HUD from the current state. Cheap enough to call on any change. */
function renderHud() {
  $('wave').textContent = 'Welle ' + S.wave;
  $('wdown').disabled = S.wave <= 1;
  $('wup').disabled = S.wave > S.cleared;
  $('b-hold').setAttribute('aria-pressed', String(S.hold));
  $('b-speed').textContent = 'x' + DB.opts.speed;
  $('wave').classList.toggle('lava', S.world === 'lava');
  $('b-world').hidden = !lavaUnlocked();
  $('gold').textContent = S.gold;
  $('gold').setAttribute('aria-label', S.gold + ' Gold');
  renderHearts();
  renderWallBricks();
  renderWeaponBar();
  renderWeaponInfo();
}

function renderHearts() {
  const box = $('hearts'), max = maxHp();
  box.textContent = '';
  box.classList.toggle('many', max > 10);   // more than ten hearts wrap into two rows
  for (let i = 0; i < max; i++) {
    const heart = document.createElement('span');
    heart.textContent = '♥';
    if (i >= castle.hp) heart.className = 'off';
    box.appendChild(heart);
  }
  box.setAttribute('aria-label', castle.hp + ' von ' + max + ' Leben');
}

/** One brick per wall hit point; lost ones are dimmed. Wraps into several rows. */
function renderWallBricks() {
  const box = $('wall'), max = wallMax();
  box.hidden = !max;
  box.textContent = '';
  box.setAttribute('aria-label', 'Mauer ' + S.wallHp + ' von ' + max);
  for (let i = 0; i < max; i++) {
    const brick = document.createElement('i');
    if (i >= S.wallHp) brick.className = 'off';
    box.appendChild(brick);
  }
}

/** Round weapon buttons: level badge when owned, price when locked. */
function renderWeaponBar() {
  for (const id of WEAPON_IDS) {
    const button = $('wp-' + id), weapon = WEAPONS[id], has = owned(id);
    button.classList.toggle('locked', !has);
    button.setAttribute('aria-pressed', String(S.active === id));
    button.querySelector('.badge').textContent = has ? S.lv[id] : weapon.price;
    button.setAttribute('aria-label', weapon.name + (has ? ', Level ' + S.lv[id] : ', gesperrt, ' + weapon.price + ' Gold'));
  }
}

/** Info line under the weapons: name and level, damage, attack interval, next ability; plus the XP bar. */
function renderWeaponInfo() {
  const id = S.active, level = S.lv[id];
  const line = $('winfo');
  line.textContent = '';
  const chip = (text, tag = 'span', className = '') => {
    const el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = text;
    line.appendChild(el);
  };
  chip(WEAPONS[id].name + ' Lvl ' + level, 'b');
  chip('Schaden ' + Math.round(damageOf(id)));
  chip('alle ' + cooldownOf(id).toFixed(1).replace('.', ',') + ' s');
  const next = nextMilestone(id);
  chip(next ? 'Neu ab Lvl ' + next : 'MAX', 'span', 'nx');

  // Shrink the font until the line fits; long weapon names would overflow otherwise.
  let fontSize = 12.5;
  line.style.fontSize = fontSize + 'px';
  while (line.scrollWidth > line.clientWidth + 1 && fontSize > 9) {
    fontSize -= 0.5;
    line.style.fontSize = fontSize + 'px';
  }
  const share = level >= MAX_LEVEL ? 1 : Math.min(1, S.xp[id] / xpNeeded(level));
  $('wxp').firstElementChild.style.width = share * 100 + '%';
}

/** Per-frame HUD parts: wave progress bar and the cooldown ring on the active weapon. */
function updateHudMeters() {
  const progress = waveProgress();
  if (progress !== session.lastProgress) {
    session.lastProgress = progress;
    $('wprog').style.width = Math.max(0, progress) + '%';
  }
  const left = clamp(combat.cooldown / combat.cooldownMax, 0, 1);
  $('wp-' + S.active).querySelector('.cd').style.setProperty('--p', left.toFixed(3));
}

function clearCooldownRings() {
  document.querySelectorAll('.wp .cd').forEach(el => el.style.setProperty('--p', 0));
}

/* ---------- XP ---------- */

/** Gives XP to a weapon and handles level-ups, including the announcement of new abilities. */
function gainXp(id, amount) {
  if (S.lv[id] >= MAX_LEVEL) return;
  S.xp[id] += amount * xpFactor();
  let leveledUp = false;
  while (S.lv[id] < MAX_LEVEL && S.xp[id] >= xpNeeded(S.lv[id])) {
    S.xp[id] -= xpNeeded(S.lv[id]);
    S.lv[id]++;
    leveledUp = true;
    const title = WEAPONS[id].name + ' Lvl ' + S.lv[id];
    const ability = WEAPONS[id].milestones[S.lv[id]];
    if (ability) toast(title, 'Neu: ' + ability);
    else floatText(cx, cy - 70 * U, title, '#ffe08a', true);
  }
  if (S.lv[id] >= MAX_LEVEL) S.xp[id] = 0;
  if (leveledUp) {
    sound(660, 0.09, 'triangle', 0.05);
    setTimeout(() => sound(880, 0.14, 'triangle', 0.05), 90);
    vibrate(30);
    ring(cx, cy, 90 * U, '245,185,58', 0.6);
    checkAchievements();
    save();
  }
  renderWeaponBar();     // only these two parts change with XP; kills are frequent, so skip the rest
  renderWeaponInfo();
}

/* ===== 31-shop.js ===== */
/*
 * The shop, which only opens after a defeat.
 *
 * The shop is data-driven: SHOP_TABS lists the tabs, SHOP_ITEMS the offers.
 * An offer has
 *   id         unique; the buy button gets the DOM id "buy-<id>"
 *   tab        id of the tab it is listed under
 *   name       title of the card
 *   tierNames  optional names of the tiers, shown as "name: tier"
 *   text       description
 *   prices     gold per tier (one entry = one-time purchase), OR
 *   price(n)   price of tier n for offers without an upper limit (forge)
 *   level()    tiers already bought
 *   buy()      applies the next tier
 *   requires   optional { met(), label } shown on the button while not met
 *   visible()  optional; hides the offer while false
 */

const SHOP_TABS = [
  { id: 'weapons', name: 'Waffen' },
  { id: 'castle', name: 'Burg' },
  { id: 'troops', name: 'Truppen' },
  { id: 'boni', name: 'Boni' },
  { id: 'forge', name: 'Schmiede', visible: lavaUnlocked },   // gold for weapon damage, from the lava world on
];

/* Helpers that build the common kinds of offers. */
const weaponOffer = (id, text) => ({
  id, tab: 'weapons', name: WEAPONS[id].name, text, prices: [WEAPONS[id].price],
  level: () => +S.own[id],
  buy: () => { S.own[id] = true; },
});
const unlockOffer = (id, tab, name, price, text, requires) => ({
  id, tab, name, text, prices: [price], requires,
  level: () => +S.own[id],
  buy: () => { S.own[id] = true; },
});
const needsSoldier = { met: () => S.own.soldier, label: 'Erst Soldat' };

const FORGE_BASE_PRICE = 100, FORGE_PRICE_GROWTH = 1.35;
const forgeOffer = id => ({
  id: 'forge-' + id, tab: 'forge', name: WEAPONS[id].name + ' schmieden',
  text: '+10 % Schaden für diese Waffe. Beliebig oft, wird jedes Mal teurer.',
  price: stage => Math.round(FORGE_BASE_PRICE * Math.pow(FORGE_PRICE_GROWTH, stage)),
  level: () => S.forge[id],
  buy: () => { S.forge[id]++; },
  visible: () => owned(id),
});

const SHOP_ITEMS = [
  weaponOffer('dagger', 'Schnelle Würfe mit Gift und Abprallern.'),
  weaponOffer('star', 'Langsame, wuchtige Flächenschläge.'),
  weaponOffer('bow', 'Schneller Fernschuss, stark gegen einzelne Gegner.'),
  weaponOffer('wand', 'Feuerbälle, die explodieren und Gegner in Brand setzen.'),

  {
    id: 'heal', tab: 'castle', name: 'Heilung', tierNames: ['+2', '+3'], prices: [20, 32],
    text: 'Leben, die die Burg nach jeder geschafften Welle zurückbekommt.',
    level: () => S.heal - 1,
    buy: () => { S.heal++; },
  },
  {
    id: 'wall', tab: 'castle', name: 'Mauer', tierNames: ['3 HP', '5 HP', '10 HP', '25 HP'], prices: [15, 30, 120, 300],
    text: 'Fängt Treffer vor der Burg ab. Wird nur nach einer Niederlage repariert.',
    level: () => S.wall,
    buy: () => { S.wall++; },
  },
  {
    id: 'hp', tab: 'castle', name: 'Burg-Leben', tierNames: ['12 Leben', '15 Leben'], prices: [60, 150],
    text: 'Die Burg hält mehr Treffer aus.',
    level: () => S.hpLv,
    buy: () => { S.hpLv++; },
  },
  unlockOffer('tower', 'castle', 'Turmschütze', 120, 'Schießt von selbst auf den nächsten Gegner.'),

  unlockOffer('soldier', 'troops', 'Soldat', 2, 'Alle 5 Sekunden kommt ein kleiner Soldat aus der Burg und hält Gegner auf.'),
  {
    id: 'soldierSpeed', tab: 'troops', name: 'Soldaten-Tempo', tierNames: ['alle 4 s', 'alle 3 s'], prices: [25, 80],
    text: 'Soldaten kommen schneller aus der Burg.',
    level: () => S.solLv,
    buy: () => { S.solLv++; },
    requires: needsSoldier,
  },
  unlockOffer('armor', 'troops', 'Rüstung', 50, 'Soldaten halten 5 statt 3 Schläge aus.', needsSoldier),
  unlockOffer('squad', 'troops', 'Verstärkung', 90, 'Bis zu 6 statt 4 Soldaten gleichzeitig.', needsSoldier),

  {
    id: 'goldBonus', tab: 'boni', name: 'Goldbonus', tierNames: ['+25 %', '+50 %'], prices: [80, 200],
    text: 'Mehr Gold für jede neu geschaffte Welle.',
    level: () => S.goldLv,
    buy: () => { S.goldLv++; },
  },
  {
    id: 'xpBonus', tab: 'boni', name: 'XP-Bonus', tierNames: ['+25 %', '+50 %'], prices: [60, 160],
    text: 'Waffen leveln schneller.',
    level: () => S.xpLv,
    buy: () => { S.xpLv++; },
  },

  ...WEAPON_IDS.map(forgeOffer),
];

const offerMaxLevel = offer => (offer.prices ? offer.prices.length : Infinity);
const offerPrice = (offer, level) => (offer.prices ? offer.prices[level] : offer.price(level));
const offerVisible = offer => !offer.visible || offer.visible();

let shopTab = 'weapons';

function renderShop() {
  $('shopgold').textContent = S.gold + ' Gold';

  const tabs = $('shoptabs');
  tabs.textContent = '';
  for (const tab of SHOP_TABS) {
    if (tab.visible && !tab.visible()) continue;
    const offers = SHOP_ITEMS.filter(offer => offer.tab === tab.id && offerVisible(offer));
    const button = document.createElement('button');
    button.type = 'button';
    button.id = 'tab-' + tab.id;
    button.textContent = tab.name;
    button.setAttribute('aria-pressed', String(tab.id === shopTab));
    // a dot marks tabs with something affordable
    if (offers.some(canBuy)) button.classList.add('hot');
    button.addEventListener('click', () => { shopTab = tab.id; renderShop(); });
    tabs.appendChild(button);
  }

  const list = $('items');
  list.textContent = '';
  for (const offer of SHOP_ITEMS) {
    if (offer.tab === shopTab && offerVisible(offer)) list.appendChild(shopCard(offer));
  }
}

/** True if the next tier of the offer can be bought right now. */
function canBuy(offer) {
  const level = offer.level();
  if (level >= offerMaxLevel(offer)) return false;
  if (offer.requires && !offer.requires.met()) return false;
  return S.gold >= offerPrice(offer, level);
}

function shopCard(offer) {
  const level = offer.level(), maxLevel = offerMaxLevel(offer);
  const soldOut = level >= maxLevel;
  const price = soldOut ? 0 : offerPrice(offer, level);

  const card = document.createElement('div');
  card.className = 'item';
  const label = document.createElement('div');
  const title = document.createElement('b');
  // tiered offers show the tier that is for sale next (or the last one when sold out)
  title.textContent = offer.name + (offer.tierNames ? ': ' + offer.tierNames[Math.min(level, maxLevel - 1)] : '');
  label.appendChild(title);
  label.appendChild(tierPips(level, maxLevel));
  const text = document.createElement('span');
  text.textContent = offer.text;
  label.appendChild(text);

  const button = document.createElement('button');
  button.type = 'button';
  button.id = 'buy-' + offer.id;
  if (soldOut) {
    button.textContent = maxLevel > 1 ? 'Maximal' : 'Gekauft';
    button.disabled = true;
    button.className = 'own';
  } else if (offer.requires && !offer.requires.met()) {
    button.textContent = offer.requires.label;
    button.disabled = true;
  } else {
    button.textContent = price + ' Gold';
    button.disabled = S.gold < price;
    button.addEventListener('click', () => {
      if (S.gold < price || offer.level() !== level) return;   // guards against double taps
      sound(900, 0.08, 'triangle', 0.05, 300);
      S.gold -= price;
      offer.buy();
      checkAchievements();
      save();
      renderHud();
      renderShop();
    });
  }
  card.append(label, button);
  return card;
}

/** Row of dots showing bought and open tiers; unlimited offers show their stage as a number instead. */
function tierPips(level, maxLevel) {
  const pips = document.createElement('i');
  pips.className = 'pips';
  if (maxLevel === Infinity) {
    pips.textContent = 'Stufe ' + level;
  } else if (maxLevel > 1) {
    for (let i = 0; i < maxLevel; i++) {
      const pip = document.createElement('u');
      if (i < level) pip.className = 'on';
      pips.appendChild(pip);
    }
  }
  return pips;
}

function openShop() {
  shopTab = 'weapons';
  save();
  renderShop();
  $('shop').hidden = false;
  refreshPause();
}

function closeShop() {
  $('shop').hidden = true;
  continueAfterDefeat();
  refreshPause();
  renderHud();
  save();
  toast('Welle 1');
  showWaveHintOnce();
}

const OVERLAY_IDS = ['menu', 'shop', 'pausep', 'abil', 'dialog'];

/** The game is paused exactly while any overlay is open. Call after showing or hiding one. */
function refreshPause() {
  session.paused = OVERLAY_IDS.some(isOpen);
  if (session.paused) session.holdPoint = null;   // a finger that was down must not keep firing afterwards
}

/* The Android app injects `window.Android` (see MainActivity.java); in a browser there is no Exit. */
const androidApp = window.Android;
const canExit = !!(androidApp && androidApp.exit);

/* ---------- Main menu and save slots ---------- */

let slotMode = 'new';      // 'new' = pick a slot for a new game, 'load' = pick a slot to load

function showMenu() {
  save();
  slot = -1;
  game.classList.add('inmenu');
  for (const id of OVERLAY_IDS) $(id).hidden = id !== 'menu';
  showMenuPage('m-main');
  $('m-load').disabled = !DB.slots[0] && !DB.slots[1];

  $('m-slots').hidden = id !== 'm-slots';
}

function showSlots(mode) {
  slotMode = mode;
  confirmSlot = -1;
  showMenuPage('m-slots');
  $('m-slottitle').textContent = mode === 'new' ? 'Neues Spiel: Platz wählen' : 'Spielstand laden';
  renderSlots();

/** One-line summary of a save for the slot buttons. */
function slotSummary(data) {
  const weapons = WEAPON_IDS.filter(id => id === 'sword' || data.own[id]).map(id => ' · ' + WEAPONS[id].name + ' ' + data.lv[id]);
  return 'Welle ' + data.wave + ' · ' + data.gold + ' Gold' + weapons.join('');
}

function renderSlots() {
  const list = $('slotlist');
  list.textContent = '';
  [0, 1].forEach(index => {
    const data = DB.slots[index];
    const button = document.createElement('button');
    const title = document.createElement('b');
    const info = document.createElement('span');
    button.type = 'button';
    button.id = 'slot-' + index;
    button.className = 'slot' + (confirmSlot === index ? ' warn' : '');
    title.textContent = 'Spielstand ' + (index + 1);
    info.textContent = confirmSlot === index ? 'Überschreiben? Zum Bestätigen noch einmal tippen.' : data ? slotSummary(data) : 'Leer';
    button.append(title, info);
    if (slotMode === 'load' && !data) button.disabled = true;
    button.addEventListener('click', () => {
      // starting a new game on an occupied slot needs a second tap
      if (slotMode === 'new' && data && confirmSlot !== index) {
        confirmSlot = index;
        renderSlots();
        return;
      }
      startGame(index, slotMode === 'new');
      if (slotMode === 'new') showIntro();
    });
    list.appendChild(button);
  });
}

/** Leaves the menu and starts playing slot `index`; `fresh` starts a new game there. */
function startGame(index, fresh) {
  loadSlotIntoState(index, fresh);
  castle.hp = maxHp();
  makeGround();                                  // the slot may be in another world than the last one played
  combat.cooldown = 0;
  combat.cooldownMax = 1;
  combat.attackCount = 0;
  restartWave(true);
  $('menu').hidden = true;
  game.classList.remove('inmenu');
  session.started = !fresh;                      // a new game shows the "tap to attack" hint
  $('hint').style.opacity = fresh ? 1 : 0;
  clearCooldownRings();
  refreshPause();
  renderHud();
  save();
  toast('Welle ' + S.wave);
}
