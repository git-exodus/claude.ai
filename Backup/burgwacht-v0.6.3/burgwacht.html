<style>
/* Layout: ein Bildschirm im Hochformat. Oben eine schlanke Glasleiste mit Welle, Leben, Mauer und Gold, unten die runden Waffen mit Infozeile. */
:root{
  --bg:#2f6a41; --glass:rgba(16,20,28,.74); --glass2:rgba(18,22,31,.96); --line:rgba(255,255,255,.16); --soft:rgba(255,255,255,.09);
  --fg:#f4f6fa; --dim:#aeb7c6; --ink:#141821; --gold:#f5b93a; --heart:#ff6b6b; --xp:#5ab4ff; --ok:#6fdc7a;
  --display:"Lilita One","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--xp);outline-offset:2px}
#game{position:relative;height:100%;width:100%;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud,#bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  background:var(--glass);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.25)}
#hud{top:8px;border-radius:14px;padding:7px 9px 10px;display:grid;gap:7px;overflow:hidden}
.r1,.r2{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.r2{align-items:flex-start}
.wavectl{display:flex;align-items:center;gap:3px}
.wavectl button,.tools button{border:1px solid var(--line);background:var(--soft);cursor:pointer;padding:0;display:grid;place-items:center}
.wavectl button{width:28px;height:28px;border-radius:50%;font-size:11px;line-height:1}
.wavectl button:disabled{opacity:.3;cursor:default}
#wave{min-width:66px;text-align:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
#hearts{color:var(--heart);font-size:12px;line-height:1;white-space:nowrap;letter-spacing:.5px}
#hearts .off{color:rgba(255,255,255,.2)}
#hearts.many{display:flex;flex-wrap:wrap;justify-content:center;max-width:100px;font-size:11px;line-height:1.1;white-space:normal;letter-spacing:0}
#wave.lava{color:#ffb36b}
#gold{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
#gold::before,.purse::before,.wp.locked .badge::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:5px}
.tools{display:flex;gap:5px}
.tools button{width:36px;height:28px;border-radius:9px;font-weight:800;font-size:12px}
.tools button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.tools svg{width:15px;height:15px}
#wall{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px;max-width:120px;padding-top:2px}
#wall i{width:9px;height:6px;border-radius:1.5px;background:#d5d9e0}
#wall i.off{background:rgba(255,255,255,.14)}
#wprog{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--xp)}
#toast{position:absolute;top:118px;left:50%;transform:translate(-50%,-10px);max-width:calc(100% - 32px);text-align:center;
  background:var(--glass2);border:1px solid rgba(245,185,58,.55);border-radius:12px;padding:7px 16px;
  font-weight:800;font-size:15px;line-height:1.25;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-size:12px;color:var(--gold)}
#hint{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-weight:800;font-size:12.5px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#bar{bottom:8px;border-radius:18px;padding:9px 10px 9px;display:grid;gap:7px}
.wps{display:flex;justify-content:space-between;gap:4px}
.wp{position:relative;flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--soft);padding:0;
  display:grid;place-items:center;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;transition:transform .12s,border-color .12s}
.wp canvas{width:34px;height:34px;display:block}
.wp[aria-pressed="true"]{border-color:var(--gold);background:rgba(245,185,58,.16);box-shadow:0 0 0 4px rgba(245,185,58,.2);transform:translateY(-2px)}
.wp.locked{border-style:dashed}
.wp.locked canvas{filter:grayscale(1);opacity:.4}
.wp .badge{position:absolute;right:-5px;bottom:-5px;min-width:22px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);
  border:1px solid var(--line);font-weight:800;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.wp[aria-pressed="true"] .badge{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.wp.locked .badge{color:var(--gold)}
.wp.locked .badge::before{width:7px;height:7px;margin-right:3px}
.wp .cd{position:absolute;inset:-2px;border-radius:50%;pointer-events:none;
  background:conic-gradient(rgba(8,10,14,.74) calc(var(--p,0)*1turn),transparent 0)}
#winfo{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
#winfo b{color:var(--gold);font-weight:800}
#winfo .nx{color:var(--xp)}
#wxp{height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
#wxp i{display:block;height:100%;width:0;background:var(--xp)}
.inmenu #hud,.inmenu #bar,.inmenu #hint,.inmenu #toast{visibility:hidden}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,8,12,.62);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.shopcard{width:min(344px,100%);max-height:100%;overflow:auto;background:var(--glass2);border:1px solid var(--line);border-radius:18px;
  padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.45);display:grid;gap:10px}
.shopcard h2{margin:0;font-family:var(--display);font-weight:400;font-size:23px;text-align:center;text-wrap:balance}
.shopcard p{margin:0;font-weight:600;font-size:13px;color:var(--dim);text-align:center}
.purse{justify-self:center;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.item b{display:block;font-weight:800;font-size:15px}
.item span{display:block;font-weight:600;font-size:12px;color:var(--dim);line-height:1.3}
.item button,#shopgo,.big{border:0;border-radius:12px;background:var(--gold);color:var(--ink);font-weight:800;cursor:pointer}
.item button{font-size:14px;padding:9px 12px;white-space:nowrap;min-width:86px}
.item button:disabled{background:var(--soft);color:var(--dim);cursor:default}
.item button.own{background:rgba(111,220,122,.16);color:var(--ok)}
#shopgo{background:var(--ok);padding:12px;font-size:16px}
.big{font-size:17px;padding:13px}
.big.alt{background:var(--soft);color:var(--fg);border:1px solid var(--line)}
.big:disabled{background:var(--soft);color:rgba(255,255,255,.35);cursor:default}
.shopcard .tip{font-size:12px}
/* shop: header, tabs and the continue button stay put, only the offers of the open tab change */
#shop .shopcard{height:min(560px,100%);grid-template-rows:auto auto auto auto minmax(0,1fr) auto}
#shoptabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#shoptabs button{position:relative;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer}
#shoptabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
#shoptabs button.hot::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid #12161f}
#items{display:grid;gap:10px;align-content:start;overflow:auto;min-height:0}
.pips{display:flex;gap:3px;margin:4px 0 3px;font-style:normal;font-size:11px;font-weight:800;color:var(--gold)}
.pips:empty{display:none}
.pips u{width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);text-decoration:none}
.pips u.on{background:var(--gold)}
/* generic dialog: hints, chest, world picker, statistics */
#dlg-buttons,#dlg-body{display:grid;gap:8px}
#dlg-body:empty{display:none}
.big small{display:block;margin-top:2px;font-size:12px;font-weight:700;opacity:.75}
.stat{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700}
.stat b{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat.wide{flex-direction:column;gap:2px}.stat.wide b{white-space:normal;color:var(--gold)}
.stat.open{color:var(--dim)}.stat.done b{color:var(--ok)}
#dlg-body h3{margin:8px 0 0;font-size:14px;font-weight:800;color:var(--gold)}
#menu{grid-template-rows:auto 1fr auto;justify-items:center;
  background:linear-gradient(rgba(6,8,12,.72),rgba(6,8,12,.1) 36%,rgba(6,8,12,.1) 50%,rgba(6,8,12,.8))}
#menu h1{margin:26px 0 0;font-family:var(--display);font-weight:400;font-size:54px;line-height:1;color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.5);text-align:center}
#menu .sub{margin:8px 0 0;font-weight:800;font-size:14px;color:var(--dim);text-align:center}
.mcol{align-self:end;width:min(300px,100%);display:grid;gap:10px;margin-bottom:14px}
.mcol h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;text-align:center}
.slot{display:grid;gap:3px;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--glass2);cursor:pointer}
.slot b{font-weight:800;font-size:16px}
.slot span{font-weight:700;font-size:12px;color:var(--dim);line-height:1.3}
.slot.warn{border-color:var(--heart)}.slot.warn span{color:var(--heart)}

#credit{font-weight:800;font-size:12px;color:var(--dim);text-align:center}
#abillist{display:grid;gap:5px}
.ab{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:baseline;font-weight:800;font-size:13px;color:rgba(255,255,255,.34)}
.ab.on{color:var(--fg)}.ab.on b{color:var(--ok)}
@media (max-width:350px){#hearts{font-size:10px;letter-spacing:0}#wave{min-width:58px;font-size:13px}.wp{width:46px;height:46px}.wp canvas{width:30px;height:30px}}
@media (prefers-reduced-motion:reduce){.wp,#toast{transition:none}}
</style>

<script>
(() => {
'use strict';

/* ===== 01-core.js ===== */
/*
 * Core helpers shared by every other file.
 *
 * All files in src/js are concatenated into one function scope (see build.py),
 * so everything declared here is visible everywhere without imports.
 */

const TAU = Math.PI * 2;
const PI = Math.PI;
const { cos, sin, atan2 } = Math;

/** rnd() -> 0..1, rnd(a) -> 0..a, rnd(a, b) -> a..b */
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const $ = id => document.getElementById(id);

const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

const game = $('game');
const canvas = $('c');
const ctx = canvas.getContext('2d');

/*
 * View metrics, recomputed by resize() in 40-main.js.
 *   W, H    size of the play field in CSS pixels
 *   DPR     device pixel ratio used for the canvas backing store
 *   U       gameplay unit: every size and speed is a multiple of U so the game
 *           looks the same on small and large phones
 *   cx, cy  centre of the castle; enemies walk towards this point
 */
let W = 360, H = 640, DPR = 1, U = 1, cx = 180, cy = 300;

/** Shortest distance from point (px, py) to the segment (x1, y1)-(x2, y2). */
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lengthSq = dx * dx + dy * dy || 1;
  const t = clamp(((px - x1) * dx + (py - y1) * dy) / lengthSq, 0, 1);
  return dist(px, py, x1 + dx * t, y1 + dy * t);
}

/* Small canvas shortcuts; `c` is any 2D context (the game canvas or an icon canvas). */
function fillCircle(c, x, y, r) {
  c.beginPath();
  c.arc(x, y, r, 0, TAU);
  c.fill();
}
function fillEllipse(c, x, y, rx, ry) {
  c.beginPath();
  c.ellipse(x, y, rx, ry, 0, 0, TAU);
  c.fill();
}

/* ===== 02-config.js ===== */
/*
 * Game data and balance numbers. Nothing in here has side effects, so this is
 * the place to tune the game.
 */

const VERSION = '0.6.3';
const SAVE_KEY = 'burgwacht-v3';
const LEGACY_SAVE_KEY = 'burgwacht-v2';   // single-save format from before the start menu

/*
 * Weapon levels. MAX_LEVEL is the only number to change when the cap is raised
 * (1000 is planned). New abilities only exist up to ABILITY_CAP; above it only
 * damage keeps growing and the cooldown stays at its ABILITY_CAP value.
 */
const MAX_LEVEL = 100;
const ABILITY_CAP = 100;

const CASTLE_HP_TIERS = [10, 12, 15];    // castle lives per shop tier
const BONUS_TIERS = [1, 1.25, 1.5];      // gold and XP multiplier per shop tier
const CASTLE_SCALE = 0.6;          // castle and enemies are drawn at 60 % of their design size
const WALL_TIERS = [0, 3, 5, 10, 25];   // wall hit points per shop tier (index = tier)
const SOLDIER_INTERVALS = [5, 4, 3];    // seconds between soldiers per shop tier
const SOLDIER_CAP = [4, 6];              // soldiers on the field without / with the "squad" upgrade
const SOLDIER_HP = [3, 5];               // hits a soldier survives without / with armour
const MAX_ENEMIES_ALIVE = 260;     // further enemies wait off-screen until there is room

/*
 * Weapons, in the order of the weapon bar.
 *   price        gold needed in the shop (the sword is owned from the start)
 *   baseDamage   damage of one basic hit at level 1
 *   cooldown     [seconds at level 1, seconds at ABILITY_CAP], linear in between
 *   milestones   level -> name of the ability unlocked there; abilities stack
 *   aimLine      weapons thrown from the castle: show a dashed aiming line while the finger is down
 * The attack code lives in 10-weapon-*.js and is attached as WEAPONS[id].attack.
 */
const WEAPONS = {
  sword: {
    name: 'Schwert', price: 0, baseDamage: 10, cooldown: [3.5, 0.5], baseAbility: 'Schwerthieb',
    milestones: { 5: 'Doppelschwert', 10: 'Dreier-Fächer', 15: 'Echo-Hieb', 25: 'Kreisende Schwerter', 30: 'Klingenwelle', 40: 'Geisterschwert', 50: 'Riesenschwert', 60: 'Schwertsplitter', 70: 'Zeitriss', 80: 'Spiegelhieb', 90: 'Kettenblitz', 100: 'Schwertregen' },
  },
  dagger: {
    name: 'Dolche', price: 5, baseDamage: 9, cooldown: [2, 0.3], baseAbility: 'Wurfdolch', aimLine: true,
    milestones: { 5: 'Dolchfächer', 10: 'Abpraller', 15: 'Durchbohren', 25: 'Ansteckendes Gift', 30: 'Schattenklon', 40: 'Splitterdolche', 50: 'Bumerang', 60: 'Giftwolke', 70: 'Dolchfallen', 80: 'Zielsuchend', 90: 'Dolchwirbel', 100: 'Kettenreaktion' },
  },
  star: {
    name: 'Morgenstern', price: 10, baseDamage: 16, cooldown: [5, 1], baseAbility: 'Flächenschlag',
    milestones: { 5: 'Schockwelle', 10: 'Rollende Kugel', 15: 'Betäubung', 25: 'Stachelhagel', 30: 'Nachbeben', 40: 'Brennender Boden', 50: 'Kettenschwung', 60: 'Schwarzes Loch', 70: 'Kugelsplitter', 80: 'Erdspalte', 90: 'Zwillingsstern', 100: 'Meteor' },
  },
  bow: {
    name: 'Bogen', price: 40, baseDamage: 14, cooldown: [2.5, 0.4], baseAbility: 'Pfeilschuss', aimLine: true,
    milestones: { 5: 'Doppelpfeil', 10: 'Durchschuss', 15: 'Kritischer Treffer', 25: 'Brandpfeil', 30: 'Pfeilfächer', 40: 'Explosivpfeil', 50: 'Pfeilhagel', 60: 'Querschläger', 70: 'Frostpfeil', 80: 'Geisterschütze', 90: 'Riesenpfeil', 100: 'Pfeilsturm' },
  },
  wand: {
    name: 'Feuerstab', price: 75, baseDamage: 12, cooldown: [4, 0.8], baseAbility: 'Feuerball',
    milestones: { 5: 'Brand', 10: 'Zwei Feuerbälle', 15: 'Feuerspur', 25: 'Kettenexplosion', 30: 'Flammenwand', 40: 'Feuergeist', 50: 'Lavabecken', 60: 'Phönix', 70: 'Glutregen', 80: 'Feuertornado', 90: 'Sonnenstrahl', 100: 'Supernova' },
  },
};
const WEAPON_IDS = Object.keys(WEAPONS);

/*
 * XP needed to go from `level` to `level + 1`.
 * Tuned together with the flat XP per enemy below so that the weapon used all
 * the time is roughly level 4 / 8 / 15 / 22 / 40 / 80 after wave 5 / 10 / 20 /
 * 30 / 50 / 100 of a first playthrough. The power law keeps working for
 * levels far beyond 100.
 */
const xpNeeded = level => Math.round(4 + 6.4 * Math.pow(level, 1.4));

/*
 * Enemy types. r/sp/xp are the base values (radius in U before CASTLE_SCALE,
 * speed in U per second); worlds and waves scale them, see WORLDS below.
 *   hp, hpStep  hit points in meadow wave 1 and how many are added per wave
 *               until RAMP_UNTIL (see meadowHp below); big enemies grow faster
 *   shielded    projectile hits only deal SHIELD_BLOCK of their damage; area damage is unaffected
 *   ranged      stops at ARCHER_RANGE and shoots the castle instead of walking into it
 */
const ENEMY_TYPES = {
  slime:  { r: 13, hp: 3, hpStep: 1, sp: 20, xp: 1, color: '#59c36a' },
  bat:    { r: 10, hp: 1, hpStep: 1, sp: 38, xp: 1, color: '#9a6bd6' },
  ogre:   { r: 19, hp: 14, hpStep: 3, sp: 13, xp: 3, color: '#4f9aa8' },
  shield: { r: 14, hp: 14, hpStep: 1, sp: 16, xp: 2, color: '#8793b8', shielded: true },
  archer: { r: 11, hp: 4, hpStep: 1, sp: 22, xp: 2, color: '#c9787f', ranged: true },
  boss:   { r: 30, hp: 90, hpStep: 15, sp: 9, xp: 20, color: '#e07a3f' },
};
const BOSS_EVERY = 5;        // a boss joins every 5th wave
const SHIELD_BLOCK = 0.25;   // share of projectile damage that gets through a shield
const ARCHER_RANGE = 105;    // distance from the castle (in U) at which archers stop
const ARCHER_INTERVAL = 4;   // seconds between an archer's shots

/*
 * Enemy hit points in the meadow.
 *   waves 1..RAMP_UNTIL  gentle linear start: hp + hpStep per wave (small enemies +1)
 *   after that           the value of wave RAMP_UNTIL grows with enemyHpFactor, which
 *                        starts at 1, so there is no jump between the two parts
 */
const RAMP_UNTIL = 17;
function meadowHp(type, waveNo) {
  const { hp, hpStep } = ENEMY_TYPES[type];
  const rampEnd = hp + hpStep * (Math.min(waveNo, RAMP_UNTIL) - 1);
  return waveNo <= RAMP_UNTIL ? rampEnd : rampEnd * enemyHpFactor(waveNo - RAMP_UNTIL + 1);
}

/** Number of regular enemies in a wave: +3 per wave up to 5, +5 to 15, +10 to 30, +15 to 50, +20 after. */
function waveCount(waveNo) {
  let n = 8;
  for (let i = 2; i <= waveNo; i++) n += i <= 5 ? 3 : i <= 15 ? 5 : i <= 30 ? 10 : i <= 50 ? 15 : 20;
  return n;
}
const enemyHpFactor = waveNo => 1 + 0.22 * (waveNo - 1) + 0.015 * (waveNo - 1) * (waveNo - 1);
const enemySpeedFactor = waveNo => 1 + Math.min(0.5, waveNo * 0.02);
/** Seconds between two spawns: a wave takes at most ~80 s to enter the field. */
const spawnGapFor = count => clamp(Math.min(80, 10 + count * 0.6) / count, 0.04, 1.5);

/*
 * Worlds. Each world has its own wave counter and progress (see 03-state.js).
 *   count(w)        regular enemies in wave w
 *   enemyHp(t, w)   hit points of an enemy of type t in wave w
 *   speedFactor(w)  multiplier on enemy speed
 *   goldMult        gold per newly cleared wave = wave number * goldMult
 *   xpMult          multiplier on enemy XP
 *   colors          enemy colours that differ from ENEMY_TYPES
 *   splitSlimes     slimes break into two small ones when they die
 * The lava world unlocks after LAVA_UNLOCK_WAVE in the meadow; its wave 1 is
 * about as tough as meadow wave 100.
 */
const LAVA_UNLOCK_WAVE = 100;
const WORLDS = {
  meadow: {
    name: 'Wiese',
    count: waveCount,
    enemyHp: meadowHp,
    speedFactor: enemySpeedFactor,
    goldMult: 1, xpMult: 1, colors: {}, splitSlimes: false,
  },
  lava: {
    name: 'Lava-Welt',
    count: w => waveCount(w + 20),
    enemyHp: (type, w) => meadowHp(type, LAVA_UNLOCK_WAVE) * (1 + 0.15 * (w - 1) + 0.008 * (w - 1) * (w - 1)),
    speedFactor: () => 1.5,
    goldMult: 3, xpMult: 3, splitSlimes: true,
    colors: { slime: '#f0702a', bat: '#ffb23e', ogre: '#7a5560', shield: '#a8553a', archer: '#d94a3a', boss: '#c22b2b' },
  },
};

/** Random type for one regular enemy. Bats come from wave 2, ogres from 3, shield bearers from 8, archers from 12. */
function rollEnemyType(waveNo) {
  let roll = Math.random();
  const shares = [
    ['ogre', waveNo >= 3 ? Math.min(0.25, 0.04 * waveNo) : 0],
    ['bat', waveNo >= 2 ? Math.min(0.3, 0.06 * waveNo) : 0],
    ['shield', waveNo >= 8 ? Math.min(0.1, 0.01 * waveNo) : 0],
    ['archer', waveNo >= 12 ? Math.min(0.05, 0.004 * waveNo) : 0],
  ];
  for (const [type, share] of shares) {
    if (roll < share) return type;
    roll -= share;
  }
  return 'slime';
}

/* Tests set window.__bwQuiet before the game loads so rewards do not disturb what they measure. */
const debugFlags = { achievements: !window.__bwQuiet, chests: !window.__bwQuiet };

/* ===== 03-state.js ===== */
/*
 * Persistent state: the save game `S`, the two save slots and the options.
 *
 * `S` is always the same object. Loading a slot copies the slot's fields into
 * it, so other code (and the test hooks) can keep a reference to it.
 */

/** A brand-new save game. Every persistent field must be listed here. */
function blankSave() {
  const perWeapon = value => Object.fromEntries(WEAPON_IDS.map(id => [id, value]));
  return {
    lv: perWeapon(1),          // weapon levels
    xp: perWeapon(0),          // XP towards the next level
    forge: perWeapon(0),       // forge stages per weapon (lava world shop), +10 % damage each
    active: 'sword',           // weapon selected in the bar
    world: 'meadow',           // world being played, key of WORLDS
    wave: 1,                   // wave currently being played in that world
    cleared: 0,                // highest wave ever cleared there (limits the wave arrows, pays gold once)
    parked: { wave: 1, cleared: 0 },   // wave and cleared of the OTHER world while it is not played
    gold: 0,
    heal: 1,                   // lives restored after each cleared wave (shop: 1..3)
    hold: false,               // "repeat this wave" toggle
    wall: 0,                   // wall tier, index into WALL_TIERS
    wallHp: 0,                 // current wall hit points; only refilled after a defeat
    solLv: 0,                  // soldier speed tier, index into SOLDIER_INTERVALS
    hpLv: 0,                   // castle lives tier, index into CASTLE_HP_TIERS
    goldLv: 0,                 // gold bonus tier, index into BONUS_TIERS
    xpLv: 0,                   // XP bonus tier, index into BONUS_TIERS
    // one-time purchases
    own: { dagger: false, star: false, bow: false, wand: false, soldier: false, armor: false, squad: false, tower: false },
    // things that last until the next defeat: chest boons (id -> times taken) and chests already opened ("world:wave")
    run: { boons: {}, chests: [] },
    hints: { waves: false },   // one-time hint windows already shown
    stats: { kills: 0, bosses: 0, bestCombo: 0, defeats: 0, goldEarned: 0 },
    ach: {},                   // achievement id -> true once rewarded
  };
}

const toCount = (value, max = 1e12) => clamp(Math.floor(+value || 0), 0, max);   // safe non-negative integer

/** Rebuilds a save from untrusted data (old versions, edited storage), clamping every field. */
function sanitizeSave(data) {
  const save = blankSave();
  if (!data) return save;
  for (const id of WEAPON_IDS) {
    save.lv[id] = clamp(data.lv?.[id] | 0 || 1, 1, MAX_LEVEL);
    save.xp[id] = +data.xp?.[id] || 0;
    save.forge[id] = toCount(data.forge?.[id], 9999);
  }
  save.gold = toCount(data.gold);
  save.heal = clamp(data.heal | 0 || 1, 1, 3);
  save.hold = !!data.hold;
  save.wall = toCount(data.wall, WALL_TIERS.length - 1);
  save.wallHp = toCount(data.wallHp, WALL_TIERS[save.wall]);
  save.solLv = toCount(data.solLv, SOLDIER_INTERVALS.length - 1);
  save.hpLv = toCount(data.hpLv, CASTLE_HP_TIERS.length - 1);
  save.goldLv = toCount(data.goldLv, BONUS_TIERS.length - 1);
  save.xpLv = toCount(data.xpLv, BONUS_TIERS.length - 1);
  for (const key in save.own) save.own[key] = !!data.own?.[key];

  save.world = WORLDS[data.world] ? data.world : 'meadow';
  save.cleared = toCount(data.cleared);
  save.wave = clamp(data.wave | 0 || 1, 1, save.cleared + 1);
  save.parked.cleared = toCount(data.parked?.cleared);
  save.parked.wave = clamp(data.parked?.wave | 0 || 1, 1, save.parked.cleared + 1);
  if (data.active === 'sword' || save.own[data.active]) save.active = data.active;

  for (const id in data.run?.boons || {}) save.run.boons[id] = toCount(data.run.boons[id], 99);
  if (Array.isArray(data.run?.chests)) save.run.chests = data.run.chests.filter(key => typeof key === 'string').slice(0, 500);
  save.hints.waves = !!data.hints?.waves;
  for (const key in save.stats) save.stats[key] = toCount(data.stats?.[key]);
  for (const id in data.ach || {}) if (data.ach[id]) save.ach[id] = true;
  return save;
}

const S = blankSave();
const DB = { slots: [null, null], opts: { mute: false, vib: true, speed: 1 } };
let slot = -1;   // index of the slot being played, -1 while in the main menu

/** Reads slots and options from localStorage; storage may be unavailable, then defaults stay. */
function loadDatabase() {
  try {
    const stored = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (stored) {
      DB.slots = [0, 1].map(i => (stored.slots?.[i] ? sanitizeSave(stored.slots[i]) : null));
      DB.opts.mute = !!stored.opts?.mute;
      DB.opts.vib = stored.opts?.vib !== false;
      DB.opts.speed = stored.opts?.speed === 2 ? 2 : 1;
    } else {
      const legacy = JSON.parse(localStorage.getItem(LEGACY_SAVE_KEY) || 'null');
      if (legacy) DB.slots[0] = sanitizeSave(legacy);
    }
  } catch (e) { /* private mode or blocked storage: play without saving */ }
}
loadDatabase();

/** Writes the running game into its slot and everything to localStorage. */
function save() {
  if (slot >= 0) DB.slots[slot] = JSON.parse(JSON.stringify(S));
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(DB)); } catch (e) { /* see loadDatabase */ }
}

/** Copies a slot (or a blank save) into `S`. */
function loadSlotIntoState(index, fresh) {
  const data = fresh || !DB.slots[index] ? blankSave() : sanitizeSave(DB.slots[index]);
  for (const key in data) S[key] = data[key];
  slot = index;
}

/* ---------- Values derived from the save ---------- */

const owned = id => id === 'sword' || S.own[id];
const currentWorld = () => WORLDS[S.world];

/** Highest meadow wave cleared, no matter which world is being played. */
const meadowCleared = () => (S.world === 'meadow' ? S.cleared : S.parked.cleared);
const lavaUnlocked = () => meadowCleared() >= LAVA_UNLOCK_WAVE;

/** Multiplier from chest boons taken this run: `step` per boon, e.g. 1.25 -> x1.25, x1.56, ... */
const boonFactor = (id, step) => Math.pow(step, S.run.boons[id] || 0);

/** Damage of one basic hit of the weapon: level, forge stages and the damage boon. */
function damageOf(id) {
  const byLevel = WEAPONS[id].baseDamage * (1 + 0.09 * (S.lv[id] - 1));
  return byLevel * (1 + 0.1 * S.forge[id]) * boonFactor('damage', 1.25);
}

/** Seconds between attacks; shrinks linearly until ABILITY_CAP and stays there. The speed boon shortens it. */
function cooldownOf(id) {
  const [slow, fast] = WEAPONS[id].cooldown;
  const progress = (Math.min(S.lv[id], ABILITY_CAP) - 1) / (ABILITY_CAP - 1);
  return Math.max(0.1, (slow - (slow - fast) * progress) * boonFactor('speed', 0.8));
}

/** Next milestone level above the weapon's current level, or undefined. */
const nextMilestone = id => Object.keys(WEAPONS[id].milestones).map(Number).find(level => level > S.lv[id]);

const wallMax = () => WALL_TIERS[S.wall];
const maxHp = () => CASTLE_HP_TIERS[S.hpLv];
const soldierCap = () => SOLDIER_CAP[+S.own.squad];
const soldierHp = () => SOLDIER_HP[+S.own.armor];
const goldFactor = () => BONUS_TIERS[S.goldLv] * boonFactor('gold', 1.5);
const xpFactor = () => BONUS_TIERS[S.xpLv] * boonFactor('xp', 1.5);

/* ===== 04-world.js ===== */
/*
 * Runtime state of the running battle (nothing here is saved) and the small
 * registries that weapons use to put things on the field: timers, zones,
 * effects, particles and floating texts.
 */

/*
 * Entity lists. Entries are plain objects; dead ones are filtered out at the
 * end of update() so code may push to these lists while iterating them.
 *   enemies      see spawnEnemy() in 07-enemies.js
 *   projectiles  see addProjectile() in 08-projectiles.js
 *   zones        lingering things with their own update: fields, orbiting swords, traps
 *   effects      pure visuals, drawn with their progress 0..1
 *   particles    little dots from puff()
 *   texts        floating damage numbers and level-up texts
 *   timers       delayed callbacks in game time (they pause with the game)
 *   soldiers     see 20-defenders.js
 */
const world = { enemies: [], projectiles: [], zones: [], effects: [], particles: [], texts: [], timers: [], soldiers: [] };

const castle = { hp: CASTLE_HP_TIERS[0], flash: 0, fallen: false };   // flash: seconds of hit feedback left

const combat = {
  cooldown: 0,        // seconds until the next attack is allowed
  cooldownMax: 1,     // cooldown that was started by the last attack (for the ring displays)
  attackCount: 0,     // attacks this session; drives "every n-th attack" abilities
  bowShots: 0,        // counts aimed arrows for the critical hit
  chainBooms: 0,      // chain explosions started this frame (capped per frame)
};

const combo = { count: 0, timer: 0, punch: 0 };   // kill streak; punch animates the counter

const wave = {
  queue: [],          // enemy types still to spawn
  total: 1,           // size of the wave, for the progress bar
  spawnGap: 1,        // seconds between two spawns
  spawnTimer: 0,
  pause: 1.5,         // breathing time before the first spawn
};

const session = {
  time: 0,            // game time in seconds
  shake: 0,           // screen shake strength, decays quickly
  paused: false,      // true while any overlay is open (see refreshPause in 32-menus.js)
  started: false,     // false until the first attack; hides the hint and gates vibration
  holdPoint: null,    // {x, y} while a finger rests on the field (auto-fire)
  soldierTimer: 2,
  towerTimer: 1,      // tower archer, see 20-defenders.js
  achievementTimer: 0,
  lastKillSound: 0,
  lastProgress: -1,   // last wave progress written to the DOM, to avoid redundant writes
};

/* Effects that can pile up at short cooldowns stop being added above these counts. */
const FX_CAP_COMMON = 160;
const FX_CAP_RARE = 219;
const PARTICLE_CAP = 260;
const TEXT_CAP = 40;

/** Runs `fn` after `delay` seconds of game time. */
function after(delay, fn) {
  world.timers.push({ t: delay, fn });
}

/**
 * Adds a lingering zone.
 *   spec.tag     optional name for zoneCount()/findZone()
 *   spec.dur     lifetime in seconds
 *   spec.under   draw below enemies (ground effects)
 *   spec.update  (zone, dt) called every frame while alive
 *   spec.draw    (zone) called every frame
 * Any other fields are private state of the zone. `zone.t` is its age.
 */
function addZone(spec) {
  const zone = Object.assign({ t: 0, under: false, update() {}, draw() {} }, spec);
  world.zones.push(zone);
  return zone;
}
const findZone = tag => world.zones.find(zone => zone.tag === tag);
function zoneCount(tag) {
  let n = 0;
  for (const zone of world.zones) if (zone.tag === tag) n++;
  return n;
}
/** Fade factor 0..1 for zones: quick fade in, fade out near the end. */
const zoneFade = (zone, inRate, outRate) => Math.min(1, zone.t * inRate, (zone.dur - zone.t) * outRate);

/**
 * Adds a visual effect; `draw(k)` gets the progress 0..1.
 * With `cap`, the effect is skipped while more than `cap` effects are alive.
 */
function addEffect(dur, draw, { under = false, cap = Infinity } = {}) {
  if (world.effects.length > cap) return;
  world.effects.push({ t: 0, dur, under, draw });
}

/** Burst of `count` particles. */
function puff(x, y, color, count) {
  for (let i = 0; i < count && world.particles.length < PARTICLE_CAP; i++) {
    const angle = rnd(TAU), speed = rnd(30, 140) * U;
    world.particles.push({
      x, y, vx: cos(angle) * speed, vy: sin(angle) * speed - 40 * U,
      life: rnd(0.3, 0.6), maxLife: 0.6, color, size: rnd(2, 5) * U,
    });
  }
}

/** Expanding ring; `rgb` is "r,g,b". */
function ring(x, y, radius, rgb, dur = 0.4, under = false) {
  addEffect(dur, k => {
    ctx.strokeStyle = `rgba(${rgb},${1 - k})`;
    ctx.lineWidth = (6 - 5 * k) * U;
    const r = radius * (0.3 + 0.7 * k);
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.8, 0, 0, TAU);
    ctx.stroke();
  }, { under, cap: FX_CAP_COMMON });
}

function floatText(x, y, text, color, big = false) {
  world.texts.push({ x, y, text, color, big, t: 0 });
}

/** Removes everything from the field. `all` also removes soldiers and visuals. */
function clearField(all) {
  world.enemies = [];
  world.projectiles = [];
  world.zones = [];
  world.timers = [];
  if (all) {
    world.soldiers = [];
    session.soldierTimer = 2;
  }
}

/* ===== 05-audio.js ===== */
/*
 * Sound and vibration. Sounds are short synthesised tones (no audio files),
 * so the game stays a single small file.
 */

let audioContext = null;   // created lazily: browsers only allow audio after a user gesture

/**
 * Plays one tone.
 *   freq   start frequency in Hz
 *   dur    length in seconds
 *   type   oscillator shape: 'square' | 'triangle' | 'sawtooth'
 *   volume 0..1
 *   slide  Hz added to the frequency over the duration (negative = falling)
 */
function sound(freq, dur = 0.08, type = 'square', volume = 0.05, slide = 0) {
  if (DB.opts.mute) return;
  try {
    audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') audioContext.resume();
    const now = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), now + dur);
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  } catch (e) { /* no audio available: stay silent */ }
}

/** Vibrates the phone; only after the first attack, because it needs a user gesture too. */
function vibrate(ms) {
  if (!DB.opts.vib || !session.started || !navigator.vibrate) return;
  try { navigator.vibrate(ms); } catch (e) { /* not supported */ }
}

/* Attack sound per weapon: [freq, dur, type, volume, slide]. */
const ATTACK_SOUNDS = {
  sword: [520, 0.1, 'triangle', 0.05, -260],
  dagger: [900, 0.05, 'square', 0.03, 200],
  star: [130, 0.2, 'sawtooth', 0.07, -70],
  bow: [700, 0.07, 'triangle', 0.05, -350],
  wand: [260, 0.16, 'sawtooth', 0.05, 240],
};

/* ===== 06-sprites.js ===== */
/*
 * Everything that is drawn as a picture: weapon shapes, castle, wall, enemies,
 * soldiers and the pre-rendered ground. All art is drawn with canvas calls,
 * there are no image files.
 *
 * Functions taking `c` draw on any 2D context (they are reused for the weapon
 * icons); the others draw on the game canvas `ctx`.
 */

const INK = '#33283a';          // outline colour of all sprites
const DISPLAY_FONT = '"Lilita One","Trebuchet MS",system-ui,sans-serif';

/* ---------- Weapon shapes ---------- */

/** Sword pointing along `angle`, hilt at (x, y). Also used for daggers with other colours. */
function drawSword(c, x, y, angle, len, blade = '#eef4ff', grip = '#8a5a3c') {
  const w = len * 0.075;
  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.lineJoin = 'round';
  c.lineWidth = Math.max(1, len * 0.035);
  c.strokeStyle = INK;
  // blade
  c.fillStyle = blade;
  c.beginPath();
  c.moveTo(0, -w);
  c.lineTo(len * 0.74, -w);
  c.lineTo(len * 0.9, 0);
  c.lineTo(len * 0.74, w);
  c.lineTo(0, w);
  c.closePath();
  c.fill();
  c.stroke();
  c.fillStyle = 'rgba(120,150,190,.45)';
  c.fillRect(len * 0.04, 0, len * 0.72, w * 0.8);
  // grip, guard, pommel
  c.fillStyle = grip;
  c.fillRect(-len * 0.2, -w * 0.6, len * 0.2, w * 1.2);
  c.strokeRect(-len * 0.2, -w * 0.6, len * 0.2, w * 1.2);
  c.fillStyle = '#f5b93a';
  c.fillRect(-len * 0.035, -len * 0.15, len * 0.07, len * 0.3);
  c.strokeRect(-len * 0.035, -len * 0.15, len * 0.07, len * 0.3);
  c.beginPath();
  c.arc(-len * 0.22, 0, w * 0.9, 0, TAU);
  c.fill();
  c.stroke();
  c.restore();
}
const DAGGER_BLADE = '#dff3ff', DAGGER_GRIP = '#2f8f7a';

/** Spiked ball of the morning star. */
function drawBall(c, x, y, r, rotation = 0) {
  c.save();
  c.translate(x, y);
  c.rotate(rotation);
  c.strokeStyle = INK;
  c.lineWidth = Math.max(1, r * 0.12);
  c.lineJoin = 'round';
  c.fillStyle = '#cfd6de';
  for (let i = 0; i < 8; i++) {
    const a = i * TAU / 8;
    c.beginPath();
    c.moveTo(cos(a - 0.22) * r * 0.9, sin(a - 0.22) * r * 0.9);
    c.lineTo(cos(a) * r * 1.5, sin(a) * r * 1.5);
    c.lineTo(cos(a + 0.22) * r * 0.9, sin(a + 0.22) * r * 0.9);
    c.closePath();
    c.fill();
    c.stroke();
  }
  const metal = c.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  metal.addColorStop(0, '#aab3c0');
  metal.addColorStop(1, '#59606e');
  c.fillStyle = metal;
  c.beginPath();
  c.arc(0, 0, r, 0, TAU);
  c.fill();
  c.stroke();
  c.restore();
}

function drawBow(c, x, y, angle, r) {
  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.lineCap = 'round';
  c.lineJoin = 'round';
  for (const [color, width] of [[INK, r * 0.3], ['#b9793f', r * 0.17]]) {
    c.strokeStyle = color;
    c.lineWidth = width;
    c.beginPath();
    c.arc(0, 0, r, -1.25, 1.25);
    c.stroke();
  }
  // string
  c.strokeStyle = '#eef4ff';
  c.lineWidth = r * 0.06;
  c.beginPath();
  c.moveTo(cos(-1.25) * r, sin(-1.25) * r);
  c.lineTo(-r * 0.25, 0);
  c.lineTo(cos(1.25) * r, sin(1.25) * r);
  c.stroke();
  c.restore();
}

function drawArrow(c, x, y, angle, len, shaft = '#f3e3c0', tip = '#dfe6ee') {
  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.lineCap = 'round';
  for (const [color, width] of [[INK, len * 0.16], [shaft, len * 0.08]]) {
    c.strokeStyle = color;
    c.lineWidth = width;
    c.beginPath();
    c.moveTo(-len * 0.5, 0);
    c.lineTo(len * 0.4, 0);
    c.stroke();
  }
  c.fillStyle = tip;
  c.strokeStyle = INK;
  c.lineWidth = len * 0.05;
  c.beginPath();
  c.moveTo(len * 0.55, 0);
  c.lineTo(len * 0.28, -len * 0.13);
  c.lineTo(len * 0.28, len * 0.13);
  c.closePath();
  c.fill();
  c.stroke();
  // fletching
  c.fillStyle = '#e2574c';
  c.beginPath();
  c.moveTo(-len * 0.5, 0);
  c.lineTo(-len * 0.62, -len * 0.12);
  c.lineTo(-len * 0.4, 0);
  c.lineTo(-len * 0.62, len * 0.12);
  c.closePath();
  c.fill();
  c.restore();
}

/** Flame with its base at (x, y); `t` wobbles the tip. */
function drawFlame(c, x, y, r, t = 0) {
  const glow = c.createRadialGradient(x, y, r * 0.1, x, y, r);
  glow.addColorStop(0, '#fff3b0');
  glow.addColorStop(0.45, '#ffb03a');
  glow.addColorStop(1, 'rgba(255,80,20,0)');
  c.fillStyle = glow;
  c.beginPath();
  c.moveTo(x - r * 0.7, y + r * 0.3);
  c.quadraticCurveTo(x - r * 0.9, y - r * 0.5, x + sin(t) * r * 0.2, y - r * 1.5);
  c.quadraticCurveTo(x + r * 0.9, y - r * 0.5, x + r * 0.7, y + r * 0.3);
  c.arc(x, y + r * 0.3, r * 0.7, 0, PI);
  c.fill();
}

/** Paints the 72x72 icon canvases of the weapon bar. */
function drawWeaponIcons() {
  for (const id of WEAPON_IDS) {
    const g = $('wp-' + id).querySelector('canvas').getContext('2d');
    g.clearRect(0, 0, 72, 72);
    if (id === 'sword') {
      drawSword(g, 16, 56, -PI / 4, 58);
    } else if (id === 'dagger') {
      drawSword(g, 10, 44, -0.5, 36, DAGGER_BLADE, DAGGER_GRIP);
      drawSword(g, 24, 62, -0.9, 36, DAGGER_BLADE, DAGGER_GRIP);
    } else if (id === 'star') {
      g.strokeStyle = '#8f97a6';
      g.lineWidth = 4;
      g.setLineDash([6, 4]);
      g.beginPath();
      g.moveTo(10, 64);
      g.lineTo(38, 32);
      g.stroke();
      g.setLineDash([]);
      drawBall(g, 44, 26, 15, 0.3);
    } else if (id === 'bow') {
      drawBow(g, 30, 36, -PI / 4, 26);
      drawArrow(g, 36, 36, -PI / 4, 50);
    } else {
      g.lineCap = 'round';
      for (const [color, width] of [[INK, 9], ['#8a5a3c', 5]]) {
        g.strokeStyle = color;
        g.lineWidth = width;
        g.beginPath();
        g.moveTo(14, 62);
        g.lineTo(44, 26);
        g.stroke();
      }
      drawFlame(g, 48, 24, 15);
    }
  }
}

/* ---------- Castle and wall ---------- */

/** Radius within which an enemy counts as having reached the castle. */
const castleRadius = () => 24 * U * CASTLE_SCALE;

function drawCastle() {
  const s = U * CASTLE_SCALE;
  const hit = castle.flash > 0;
  const squash = hit ? 1 - castle.flash * 0.25 : 1;
  const stone = hit ? '#ffd0c8' : '#efe7d4';
  const roof = '#e2574c';
  const outline = '#4a3b42';

  ctx.fillStyle = 'rgba(0,0,0,.24)';
  fillEllipse(ctx, cx + 4 * s, cy + 20 * s, 50 * s, 15 * s);

  // From here on coordinates are in castle design units, origin at the gate's base.
  ctx.save();
  ctx.translate(cx, cy + 18 * s);
  ctx.scale(s * (2 - squash), s * squash);
  ctx.translate(0, -18);
  ctx.lineWidth = 2;
  ctx.strokeStyle = outline;
  ctx.lineJoin = 'round';

  const block = (x, y, w, h) => {
    ctx.fillStyle = stone;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(74,59,66,.12)';     // shaded right side for depth
    ctx.fillRect(x + w * 0.6, y, w * 0.4, h);
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 2);
    ctx.stroke();
  };
  const cone = (x1, x2, baseY, tipY) => {
    const mid = (x1 + x2) / 2;
    const path = (fromX) => {
      ctx.beginPath();
      ctx.moveTo(fromX, baseY);
      ctx.lineTo(x2, baseY);
      ctx.lineTo(mid, tipY);
      ctx.closePath();
    };
    ctx.fillStyle = roof;
    path(x1);
    ctx.fill();
    ctx.fillStyle = 'rgba(74,59,66,.14)';
    path(mid);
    ctx.fill();
    path(x1);
    ctx.stroke();
  };
  const windowAt = (x, y) => {
    ctx.fillStyle = outline;
    ctx.beginPath();
    ctx.roundRect(x - 3, y, 6, 10, [3, 3, 0, 0]);
    ctx.fill();
    ctx.fillStyle = '#ffd978';
    ctx.fillRect(x - 1.5, y + 3, 3, 6);
  };

  // keep with flag
  block(-14, -46, 28, 48);
  cone(-19, 19, -46, -74);
  windowAt(0, -36);
  ctx.strokeStyle = outline;
  ctx.beginPath();
  ctx.moveTo(0, -74);
  ctx.lineTo(0, -92);
  ctx.stroke();
  const wave_ = sin(session.time * 5) * 3;
  ctx.fillStyle = '#f5b93a';
  ctx.beginPath();
  ctx.moveTo(0, -92);
  ctx.quadraticCurveTo(9, -90 + wave_, 17, -86);
  ctx.quadraticCurveTo(9, -83 - wave_, 0, -81);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // front wall with battlements
  block(-24, -8, 48, 26);
  for (let i = 0; i < 5; i++) block(-24 + i * 10.4, -15, 6.4, 8);
  // side towers
  block(-42, -26, 20, 44);
  cone(-46, -18, -26, -50);
  windowAt(-32, -16);
  block(22, -26, 20, 44);
  cone(18, 46, -26, -50);
  windowAt(32, -16);
  // gate
  ctx.fillStyle = '#8a5a3c';
  ctx.beginPath();
  ctx.roundRect(-8, 0, 16, 18, [8, 8, 0, 0]);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 18);
  ctx.stroke();
  ctx.fillStyle = '#f5b93a';
  fillCircle(ctx, 3, 10, 1.4);
  ctx.restore();
}

/* The wall is an ellipse of stone blocks around the castle. */
const wallRadiusX = () => 44 * U;
const wallRadiusY = () => 23 * U;
const wallCenterY = () => cy + 5 * U;
const WALL_BLOCKS = 26;

/** Draws the back half (front = false, before the castle) or the front half of the wall. */
function drawWall(front) {
  const max = wallMax();
  if (!max) return;
  const standing = Math.ceil(WALL_BLOCKS * S.wallHp / max);   // damaged blocks turn into rubble
  ctx.lineWidth = 1.3 * U;
  ctx.strokeStyle = '#4a3b42';
  ctx.lineJoin = 'round';
  for (let i = 0; i < WALL_BLOCKS; i++) {
    const angle = i / WALL_BLOCKS * TAU + 0.12;
    if ((sin(angle) > 0) !== front) continue;
    const x = cx + cos(angle) * wallRadiusX();
    const y = wallCenterY() + sin(angle) * wallRadiusY();
    const up = (i * 7) % WALL_BLOCKS < standing;       // i*7 spreads the damage around the ring
    const height = up ? (i % 2 ? 9 : 7) * U : 3 * U;
    ctx.fillStyle = up ? (i % 2 ? '#d8d2c6' : '#c4bdb0') : '#8f897f';
    ctx.beginPath();
    ctx.roundRect(x - 5.6 * U, y - height, 11.2 * U, height + 2 * U, 1.5 * U);
    ctx.fill();
    ctx.stroke();
    if (up) {
      ctx.fillStyle = 'rgba(74,59,66,.14)';
      ctx.fillRect(x + U, y - height + U, 3.6 * U, height);
    }
  }
}

/* ---------- Enemies ---------- */

function drawEnemy(e) {
  const t = session.time;
  const bob = sin(t * 8 + e.phase);
  const r = e.r;
  const flyHeight = e.type === 'bat' ? r * 1.1 + bob * 2 * U : 0;
  const x = e.x, y = e.y - flyHeight;
  const moving = e.freeze <= 0 && e.stun <= 0;
  const squash = moving ? 1 + bob * 0.08 : 1;

  ctx.fillStyle = 'rgba(0,0,0,.22)';
  fillEllipse(ctx, e.x, e.y + r * 0.75, r * (flyHeight ? 0.7 : 1), r * 0.35);

  ctx.save();
  ctx.translate(x, y);
  ctx.lineWidth = 2 * U;
  ctx.strokeStyle = INK;
  ctx.lineJoin = 'round';
  ctx.fillStyle = e.flash > 0 ? '#fff' : e.freeze > 0 ? '#bfe9ff' : e.slow > 0 ? '#9fd0ee' : e.color;

  if (e.type === 'bat') {
    const flap = moving ? sin(t * 22 + e.phase) * 0.6 : 0;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * r * 0.5, 0);
      ctx.lineTo(side * r * 2.1, -r * (0.9 + flap));
      ctx.lineTo(side * r * 1.7, r * 0.1);
      ctx.lineTo(side * r * 1.2, -r * 0.1);
      ctx.lineTo(side * r * 0.9, r * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.85, 0, TAU);
    ctx.fill();
    ctx.stroke();
    // ears
    ctx.beginPath();
    for (const side of [-1, 1]) {
      ctx.moveTo(side * r * 0.6, -r * 0.6);
      ctx.lineTo(side * r * 0.45, -r * 1.25);
      ctx.lineTo(side * r * 0.1, -r * 0.8);
    }
    ctx.fill();
    ctx.stroke();
  } else if (e.type === 'ogre') {
    ctx.scale(2 - squash, squash);
    ctx.beginPath();
    ctx.roundRect(-r * 0.95, -r * 1.1, r * 1.9, r * 2, r * 0.6);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#efe7d4';   // horns
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * r * 0.5, -r * 1.05);
      ctx.lineTo(side * r * 0.95, -r * 1.7);
      ctx.lineTo(side * r * 0.85, -r * 0.95);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(51,40,58,.25)';
    ctx.fillRect(-r * 0.6, r * 0.35, r * 1.2, r * 0.18);
    if (e.lava) drawLavaCracks(r);   // lava golem
  } else if (e.type === 'shield') {
    drawShieldBearerBody(e, r, squash);
  } else if (e.type === 'archer') {
    drawArcherBody(e, r, squash);
  } else {
    // slime, and the boss as a crowned slime (in the lava world: a dragon with wings)
    if (e.boss && e.lava) drawDragonWings(r, moving ? sin(t * 9 + e.phase) * 0.35 : 0);
    ctx.scale(2 - squash, squash);
    ctx.beginPath();
    ctx.moveTo(-r, r * 0.8);
    ctx.bezierCurveTo(-r * 1.25, -r * 0.9, r * 1.25, -r * 0.9, r, r * 0.8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.35, -r * 0.15, r * 0.22, r * 0.13, -0.5, 0, TAU);
    ctx.fill();
    if (e.boss) {
      ctx.fillStyle = '#f5b93a';
      ctx.beginPath();
      ctx.moveTo(-r * 0.5, -r * 0.45);
      ctx.lineTo(-r * 0.55, -r * 1.05);
      ctx.lineTo(-r * 0.25, -r * 0.75);
      ctx.lineTo(0, -r * 1.15);
      ctx.lineTo(r * 0.25, -r * 0.75);
      ctx.lineTo(r * 0.55, -r * 1.05);
      ctx.lineTo(r * 0.5, -r * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  // eyes
  const eyeY = e.type === 'ogre' || e.type === 'shield' ? -r * 0.25 : e.type === 'bat' || e.type === 'archer' ? -r * 0.1 : r * 0.15;
  const eyeX = r * 0.36;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-eyeX, eyeY, r * 0.24, 0, TAU);
  ctx.arc(eyeX, eyeY, r * 0.24, 0, TAU);
  ctx.fill();
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(-eyeX, eyeY + r * 0.05, r * 0.12, 0, TAU);
  ctx.arc(eyeX, eyeY + r * 0.05, r * 0.12, 0, TAU);
  ctx.fill();
  if (e.type === 'ogre' || e.boss) {   // angry brows
    ctx.lineWidth = 2 * U;
    ctx.beginPath();
    ctx.moveTo(-eyeX - r * 0.25, eyeY - r * 0.38);
    ctx.lineTo(-eyeX + r * 0.2, eyeY - r * 0.2);
    ctx.moveTo(eyeX + r * 0.25, eyeY - r * 0.38);
    ctx.lineTo(eyeX - r * 0.2, eyeY - r * 0.2);
    ctx.stroke();
  }
  ctx.restore();

  drawEnemyStatus(e, x, y);
}

/** Shield bearer: armoured body with a big shield held towards the castle. */
function drawShieldBearerBody(e, r, squash) {
  const side = cx >= e.x ? 1 : -1;   // the shield faces the castle
  ctx.scale(2 - squash, squash);
  ctx.beginPath();
  ctx.roundRect(-r * 0.8, -r, r * 1.6, r * 1.9, r * 0.5);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = 'rgba(51,40,58,.3)';   // helmet band
  ctx.fillRect(-r * 0.8, -r * 0.62, r * 1.6, r * 0.2);
  ctx.fillStyle = e.flash > 0 ? '#fff' : '#d9dee8';
  ctx.beginPath();
  ctx.roundRect(side * r * 0.75 - r * 0.32, -r * 0.75, r * 0.64, r * 1.6, r * 0.25);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#f5b93a';
  fillCircle(ctx, side * r * 0.75, 0, r * 0.14);
}

/** Archer: small hooded figure with a crossbow. */
function drawArcherBody(e, r, squash) {
  const side = cx >= e.x ? 1 : -1;
  ctx.scale(2 - squash, squash);
  ctx.beginPath();
  ctx.arc(0, r * 0.1, r * 0.85, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();   // pointed hood
  ctx.moveTo(-r * 0.8, -r * 0.25);
  ctx.lineTo(0, -r * 1.55);
  ctx.lineTo(r * 0.8, -r * 0.25);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = '#5b4636';   // crossbow
  ctx.lineWidth = 2.4 * U;
  ctx.beginPath();
  ctx.moveTo(side * r * 0.5, r * 0.45);
  ctx.lineTo(side * r * 1.5, r * 0.45);
  ctx.moveTo(side * r * 1.2, r * 0.05);
  ctx.lineTo(side * r * 1.2, r * 0.85);
  ctx.stroke();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2 * U;
}

/** Glowing cracks on a lava golem. */
function drawLavaCracks(r) {
  ctx.strokeStyle = '#ff9a3c';
  ctx.lineWidth = 1.6 * U;
  ctx.beginPath();
  ctx.moveTo(-r * 0.6, r * 0.1);
  ctx.lineTo(-r * 0.25, r * 0.3);
  ctx.lineTo(-r * 0.35, r * 0.7);
  ctx.moveTo(r * 0.55, -r * 0.05);
  ctx.lineTo(r * 0.2, r * 0.35);
  ctx.lineTo(r * 0.45, r * 0.75);
  ctx.stroke();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2 * U;
}

/** Wings of the lava boss; drawn before the body so they sit behind it. */
function drawDragonWings(r, flap) {
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * r * 0.6, -r * 0.1);
    ctx.lineTo(side * r * 2.0, -r * (1.0 + flap));
    ctx.lineTo(side * r * 1.7, -r * 0.2);
    ctx.lineTo(side * r * 2.1, r * 0.2);
    ctx.lineTo(side * r * 1.3, r * 0.1);
    ctx.lineTo(side * r * 0.8, r * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
}

/** Status markers above an enemy: poison bubbles, flame, stun stars, frost ring, health bar. */
function drawEnemyStatus(e, x, y) {
  const t = session.time, r = e.r;
  if (e.poison > 0) {
    ctx.fillStyle = 'rgba(140,210,70,.9)';
    for (let i = 0; i < 2; i++) {
      const rise = (t * 1.4 + i * 0.5 + e.phase) % 1;
      fillCircle(ctx, x + (i ? 1 : -1) * r * 0.5, y - r * 0.6 - rise * 14 * U, 2.5 * U * (1 - rise));
    }
  }
  if (e.burn > 0) drawFlame(ctx, x, y - r * 0.9, r * 0.55, t * 14 + e.phase);
  if (e.stun > 0) {
    ctx.fillStyle = '#ffe36e';
    for (let i = 0; i < 3; i++) {
      const a = t * 6 + i * 2.1;
      fillCircle(ctx, x + cos(a) * r * 0.8, y - r * 1.3 + sin(a) * r * 0.25, 2.2 * U);
    }
  }
  if (e.freeze > 0) {
    ctx.strokeStyle = 'rgba(190,235,255,.9)';
    ctx.lineWidth = 2 * U;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.25, 0, TAU);
    ctx.stroke();
  }
  if (e.hp < e.max) {
    const width = r * 2, share = Math.max(0, e.hp / e.max);
    ctx.fillStyle = INK;
    ctx.fillRect(x - width / 2 - 1, y - r * 1.75 - 1, width + 2, 5 * U + 2);
    ctx.fillStyle = share > 0.5 ? '#7ddc5a' : share > 0.25 ? '#f5b93a' : '#e9524f';
    ctx.fillRect(x - width / 2, y - r * 1.75, width * share, 5 * U);
  }
}

/* ---------- Soldier ---------- */

function drawSoldier(soldier) {
  const u = U * 0.8;
  const hop = soldier.walking ? Math.abs(sin(session.time * 12 + soldier.phase)) * 2 * u : 0;
  const x = soldier.x, y = soldier.y - hop;
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  fillEllipse(ctx, soldier.x, soldier.y + 7 * u, 7 * u, 3 * u);

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(soldier.facing, 1);
  ctx.lineWidth = 1.5 * u;
  ctx.strokeStyle = INK;
  ctx.lineJoin = 'round';
  ctx.fillStyle = '#4a3b42';   // legs
  ctx.fillRect(-3.5 * u, 3 * u, 2.5 * u, 4 * u);
  ctx.fillRect(u, 3 * u, 2.5 * u, 4 * u);
  ctx.fillStyle = soldier.flash > 0 ? '#fff' : '#4f7fd6';   // tunic
  ctx.beginPath();
  ctx.roundRect(-5 * u, -4 * u, 10 * u, 8.5 * u, 2.5 * u);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#ffd9b3';   // head
  ctx.beginPath();
  ctx.arc(0, -8 * u, 4.2 * u, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#b9c2cf';   // helmet
  ctx.beginPath();
  ctx.arc(0, -8.6 * u, 4.6 * u, PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = INK;
  fillCircle(ctx, 1.8 * u, -7.2 * u, 0.8 * u);
  drawSword(ctx, 5 * u, u, soldier.swing > 0 ? 0.3 : -1.1, 13 * u);
  ctx.fillStyle = '#e2574c';   // shield
  ctx.beginPath();
  ctx.arc(-4.5 * u, u, 3.2 * u, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // one dot per hit the soldier can still take
  for (let i = 0; i < soldier.maxHp; i++) {
    ctx.fillStyle = i < soldier.hp ? '#7ddc5a' : 'rgba(51,40,58,.45)';
    fillCircle(ctx, x - 4 * u + i * 4 * u, y - 17 * u, 1.6 * u);
  }
}

/* ---------- Ground ---------- */

let ground = null;   // off-screen canvas with the static background, rebuilt on resize and world change

/* Colours of the ground per world. Meadows get grass and flowers, the lava world gets lava and embers. */
const GROUND_STYLES = {
  meadow: {
    fill: ['#93d672', '#74bd5e', '#4d9a52'],
    patches: ['rgba(255,255,220,.06)', 'rgba(20,80,40,.07)'],
    yard: '201,168,119', stone: '#b9b4ad', edge: '20,50,40', plants: true,
  },
  lava: {
    fill: ['#5a4442', '#43302f', '#2a1c1e'],
    patches: ['rgba(255,150,60,.05)', 'rgba(0,0,0,.14)'],
    yard: '120,96,88', stone: '#6f6260', edge: '20,6,6', plants: false,
  },
};

function makeGround() {
  const style = GROUND_STYLES[S.world];
  ground = document.createElement('canvas');
  ground.width = W * DPR;
  ground.height = H * DPR;
  const g = ground.getContext('2d');
  g.scale(DPR, DPR);

  // Seeded generator so the meadow looks the same after every resize.
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const far = Math.max(W, H);
  const yardY = cy + 8 * U;   // centre of the trodden ground around the castle

  let fill = g.createRadialGradient(cx, cy, 10, cx, cy, far * 0.75);
  fill.addColorStop(0, style.fill[0]);
  fill.addColorStop(0.55, style.fill[1]);
  fill.addColorStop(1, style.fill[2]);
  g.fillStyle = fill;
  g.fillRect(0, 0, W, H);

  // light and dark patches
  for (let i = 0; i < 46; i++) {
    g.fillStyle = style.patches[i % 2 ? 0 : 1];
    g.beginPath();
    g.ellipse(rand() * W, rand() * H, (20 + rand() * 50) * U, (10 + rand() * 22) * U, rand() * 3, 0, TAU);
    g.fill();
  }
  // castle yard
  if (!style.plants) drawLavaStreams(g, rand, yardY);
  g.fillStyle = `rgba(${style.yard},.6)`;
  fillEllipse(g, cx, yardY, 58 * U, 34 * U);
  g.fillStyle = `rgba(${style.yard},.35)`;
  fillEllipse(g, cx, yardY, 72 * U, 44 * U);
  if (style.plants) drawMeadowPlants(g, rand, yardY);
  // stones
  for (let i = 0; i < 16; i++) {
    const x = rand() * W, y = rand() * H, size = (3 + rand() * 4) * U;
    g.fillStyle = 'rgba(0,0,0,.14)';
    fillEllipse(g, x + U, y + size * 0.5, size * 1.1, size * 0.5);
    g.fillStyle = style.stone;
    fillEllipse(g, x, y, size, size * 0.75);
    g.fillStyle = 'rgba(255,255,255,.35)';
    fillEllipse(g, x - size * 0.25, y - size * 0.25, size * 0.4, size * 0.25);
  }
  // darker edges
  fill = g.createRadialGradient(cx, cy, far * 0.3, cx, cy, far * 0.78);
  fill.addColorStop(0, `rgba(${style.edge},0)`);
  fill.addColorStop(1, `rgba(${style.edge},.5)`);
  g.fillStyle = fill;
  g.fillRect(0, 0, W, H);
}

function drawMeadowPlants(g, rand, yardY) {
  // grass tufts
  g.strokeStyle = 'rgba(40,110,55,.55)';
  g.lineWidth = 1.4 * U;
  g.lineCap = 'round';
  for (let i = 0; i < 260; i++) {
    const x = rand() * W, y = rand() * H;
    if (dist(x, y, cx, yardY) < 60 * U) continue;
    g.beginPath();
    g.moveTo(x - 3 * U, y);
    g.lineTo(x - U, y - 5 * U);
    g.moveTo(x, y);
    g.lineTo(x, y - 6 * U);
    g.moveTo(x + 3 * U, y);
    g.lineTo(x + 1.5 * U, y - 4 * U);
    g.stroke();
  }
  // flowers
  const petals = ['#fff', '#ffe36e', '#ffb3d1', '#cfe3ff'];
  for (let i = 0; i < 46; i++) {
    const x = rand() * W, y = rand() * H;
    if (dist(x, y, cx, yardY) < 66 * U) continue;
    g.fillStyle = petals[i % 4];
    for (let j = 0; j < 5; j++) fillCircle(g, x + cos(j * 1.257) * 2.4 * U, y + sin(j * 1.257) * 2.4 * U, 1.7 * U);
    g.fillStyle = '#f5b93a';
    fillCircle(g, x, y, 1.3 * U);
  }
}

/** Winding lava streams with a bright core, plus scattered embers. */
function drawLavaStreams(g, rand, yardY) {
  g.lineCap = 'round';
  g.lineJoin = 'round';
  for (let i = 0; i < 5; i++) {
    // a stream wanders from one screen edge towards the opposite one, bending around the castle yard
    const points = [];
    let x = rand() * W, y = i % 2 ? -20 : H + 20;
    const stepY = (i % 2 ? 1 : -1) * H / 7;
    for (let j = 0; j < 9; j++) {
      points.push([x, y]);
      x = clamp(x + (rand() - 0.5) * 120 * U, -20, W + 20);
      y += stepY;
      if (dist(x, y, cx, yardY) < 110 * U) x += (x < cx ? -1 : 1) * 90 * U;
    }
    for (const [color, width] of [['rgba(60,10,5,.55)', 20], ['#d9461c', 13], ['#ff9a2e', 7], ['#ffe08a', 2.5]]) {
      g.strokeStyle = color;
      g.lineWidth = width * U;
      g.beginPath();
      g.moveTo(points[0][0], points[0][1]);
      for (const [px, py] of points.slice(1)) g.lineTo(px, py);
      g.stroke();
    }
  }
  for (let i = 0; i < 70; i++) {   // embers
    const x = rand() * W, y = rand() * H;
    g.fillStyle = i % 3 ? 'rgba(255,140,50,.5)' : 'rgba(255,220,130,.6)';
    fillCircle(g, x, y, (0.8 + rand() * 1.4) * U);
  }
}

/* ===== 07-enemies.js ===== */
/*
 * Enemies: spawning, damage, death, status effects and movement.
 *
 * Damage always goes through hurt(enemy, amount, source). `source` describes
 * where the damage came from:
 *   weapon   id of the weapon ('soldier' for soldiers)
 *   color    colour of the floating damage number
 *   dot      true for damage over time: no number is shown
 * plus weapon-specific flags that the kill hooks read (splinter, generation, chain).
 * Projectiles pass `viaProjectile`, which is what shield bearers block.
 */

/** Random point just outside the screen: from the castle along a random direction to the edge (+30 px). */
function spawnPoint() {
  const angle = rnd(TAU), dx = cos(angle), dy = sin(angle);
  const toSide = (W / 2 + 30) / Math.abs(dx || 1e-6);
  const toTopOrBottom = ((dy < 0 ? cy : H - cy) + 30) / Math.abs(dy || 1e-6);
  const reach = Math.min(toSide, toTopOrBottom);
  return { x: cx + dx * reach, y: cy + dy * reach };
}

/**
 * Puts one enemy of `type` on the field, scaled for the current world and wave.
 * `at` overrides the position, `mini` makes one of the two halves of a split slime.
 */
function spawnEnemy(type, { at = spawnPoint(), mini = false } = {}) {
  const base = ENEMY_TYPES[type];
  const worldDef = currentWorld(), waveNo = S.wave;
  let hp = worldDef.enemyHp(type, waveNo);
  if (mini) hp *= 0.3;

  const enemy = {
    type,
    boss: type === 'boss',
    shielded: !!base.shielded,
    ranged: !!base.ranged,
    mini,
    lava: S.world === 'lava',                 // selects the lava look in drawEnemy()
    x: at.x, y: at.y,
    r: base.r * U * CASTLE_SCALE * (mini ? 0.62 : 1),
    hp, max: hp,
    sp: base.sp * worldDef.speedFactor(waveNo),   // in U per second
    xp: base.xp * worldDef.xpMult * (mini ? 0.25 : 1),
    color: worldDef.colors[type] || base.color,
    shotCd: 2,                                // ranged only: seconds until the next shot once in range
    phase: rnd(TAU),                          // desynchronises the idle animation
    dead: false,
    flash: 0,                                 // white hit flash, seconds
    knockX: 0, knockY: 0,                     // knockback velocity, decays
    // status effects: remaining seconds
    stun: 0, freeze: 0, slow: 0, blocked: 0,
    poison: 0, poisonDps: 0, poisonTick: 0,
    burn: 0, burnDps: 0, burnTick: 0,
    orbitCd: 0,                               // re-hit delay for things that circle through enemies
    attackCd: 0,                              // delay between hits on a soldier
  };
  world.enemies.push(enemy);
  return enemy;
}

/** Closest living enemy to (x, y) within `maxDist`, skipping those in the `exclude` set. */
function nearestEnemy(x, y, maxDist = 1e9, exclude = null) {
  let best = null, bestDist = maxDist;
  for (const e of world.enemies) {
    if (e.dead || (exclude && exclude.has(e))) continue;
    const d = dist(x, y, e.x, e.y);
    if (d < bestDist) { bestDist = d; best = e; }
  }
  return best;
}

function hurt(enemy, amount, source, viaProjectile = false) {
  if (enemy.dead) return;
  if (enemy.shielded && viaProjectile) {
    amount *= SHIELD_BLOCK;
    if (world.effects.length < FX_CAP_COMMON) ring(enemy.x, enemy.y, enemy.r * 1.4, '200,215,255', 0.18);   // "clank"
  }
  enemy.hp -= amount;
  enemy.flash = 0.12;
  if (!source.dot && world.texts.length < TEXT_CAP) {
    floatText(enemy.x + rnd(-6, 6), enemy.y - enemy.r * 1.7, String(Math.max(1, Math.round(amount))), source.color || '#fff');
  }
  if (enemy.hp <= 0) kill(enemy, source);
}

/** Damages every enemy touching the circle; `onEach(enemy)` runs before the damage. */
function areaDamage(x, y, radius, amount, source, onEach) {
  for (const e of world.enemies) {
    if (e.dead || dist(x, y, e.x, e.y) >= radius + e.r) continue;
    if (onEach) onEach(e);
    hurt(e, amount, source);
  }
}

/** Pushes an enemy away from the castle; bosses are three times heavier. */
function knockback(enemy, force) {
  const angle = atan2(enemy.y - cy, enemy.x - cx);
  const strength = force * U / (enemy.boss ? 3 : 1);
  enemy.knockX += cos(angle) * strength;
  enemy.knockY += sin(angle) * strength;
}

/* Status effects keep the stronger of the old and new value, they never stack. */
function applyBurn(enemy, dps, seconds = 3) {
  enemy.burn = Math.max(enemy.burn, seconds);
  enemy.burnDps = Math.max(enemy.burnDps, dps);
}
function applyPoison(enemy, dps) {
  enemy.poison = 4;
  enemy.poisonDps = Math.max(enemy.poisonDps, dps);
}

/*
 * Weapons register functions here that run whenever an enemy dies:
 * (enemy, source) => void. See the weapon files for the individual hooks.
 */
const KILL_HOOKS = [];

function kill(enemy, source) {
  enemy.dead = true;
  recordKill(enemy);

  // kill streak
  combo.count++;
  combo.timer = 1.5;
  combo.punch = 1;
  if (combo.count % 10 === 0 || enemy.boss) session.shake = Math.max(session.shake, enemy.boss ? 14 : 4);
  if (Math.abs(session.time - session.lastKillSound) > 0.05) {
    session.lastKillSound = session.time;
    sound(420 + Math.min(30, combo.count) * 18, 0.06, 'square', 0.025, 300);   // pitch rises with the streak
  }

  deathEffect(enemy);
  puff(enemy.x, enemy.y, enemy.color, enemy.boss ? 26 : 8);
  gainXp(S.active, enemy.xp);
  for (const hook of KILL_HOOKS) hook(enemy, source);
}

/** The body is flung away from the castle, spins, flattens and fades. */
function deathEffect(enemy) {
  if (world.effects.length >= 220) return;
  const angle = atan2(enemy.y - cy, enemy.x - cx) + rnd(-0.6, 0.6);
  const speed = rnd(110, 210) * U, spin = rnd(-8, 8);
  const { x, y, r, color } = enemy;
  addEffect(0.4, k => {
    ctx.save();
    ctx.translate(x + cos(angle) * speed * k * 0.4, y + sin(angle) * speed * k * 0.4 - sin(k * PI) * 20 * U);
    ctx.rotate(spin * k);
    ctx.globalAlpha = 1 - k * k;
    ctx.scale(1 + k * 0.6, 1 - k * 0.6);
    ctx.fillStyle = color;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5 * U;
    ctx.beginPath();
    ctx.arc(0, 0, r * (1 - k * 0.3), 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  });
  ring(enemy.x, enemy.y, enemy.r * 2.4, '255,255,255', 0.22);
}

/** One frame of status effects, movement and castle contact for all enemies. */
function updateEnemies(dt) {
  for (const e of world.enemies) {
    if (e.dead) continue;
    e.flash -= dt;
    e.orbitCd -= dt;
    e.attackCd -= dt;
    e.blocked -= dt;
    e.slow -= dt;
    tickDamageOverTime(e, dt);
    if (e.dead) continue;

    // knockback slides the enemy and fades out
    e.x += e.knockX * dt;
    e.y += e.knockY * dt;
    const decay = Math.exp(-5 * dt);
    e.knockX *= decay;
    e.knockY *= decay;

    // frozen, stunned or held up by a soldier: no walking (or shooting) this frame
    if (e.freeze > 0) e.freeze -= dt;
    else if (e.stun > 0) e.stun -= dt;
    else if (e.blocked <= 0) {
      if (e.ranged && dist(e.x, e.y, cx, cy) <= ARCHER_RANGE * U) shootAtCastle(e, dt);
      else walkToCastle(e, dt);
    }

    e.x = clamp(e.x, -60, W + 60);
    e.y = clamp(e.y, -60, H + 60);
    checkCastleContact(e);
  }
}

function tickDamageOverTime(e, dt) {
  if (e.poison > 0) {
    e.poison -= dt;
    e.poisonTick += dt;
    if (e.poisonTick >= 0.5) {
      e.poisonTick = 0;
      hurt(e, e.poisonDps * 0.5, { weapon: 'dagger', dot: true });
    }
  }
  if (e.burn > 0 && !e.dead) {
    e.burn -= dt;
    e.burnTick += dt;
    if (e.burnTick >= 0.5) {
      e.burnTick = 0;
      hurt(e, e.burnDps * 0.5, { weapon: 'wand', dot: true });
    }
  }
}

function walkToCastle(e, dt) {
  const angle = atan2(cy - e.y, cx - e.x);
  const speed = e.sp * U * (e.slow > 0 ? 0.5 : 1);
  const weave = e.type === 'bat' ? sin(session.time * 4 + e.phase) * 0.7 : 0;   // bats fly in a wavy line
  e.x += (cos(angle) - sin(angle) * weave) * speed * dt;
  e.y += (sin(angle) + cos(angle) * weave) * speed * dt;
}

/** Archers in range stand still and fire a bolt at the castle every ARCHER_INTERVAL seconds. */
function shootAtCastle(e, dt) {
  e.shotCd -= dt;
  if (e.shotCd > 0) return;
  e.shotCd = ARCHER_INTERVAL;
  const fromX = e.x, fromY = e.y - e.r;
  // the bolt lands on the wall while it stands, otherwise on the castle
  const angle = atan2(e.y - wallCenterY(), e.x - cx);
  const toX = S.wallHp > 0 ? cx + cos(angle) * wallRadiusX() : cx;
  const toY = S.wallHp > 0 ? wallCenterY() + sin(angle) * wallRadiusY() : cy - 10 * U;
  const flight = 0.4;
  addEffect(flight, k => {
    const x = fromX + (toX - fromX) * k, y = fromY + (toY - fromY) * k - sin(k * PI) * 14 * U;
    drawArrow(ctx, x, y, atan2(toY - fromY, toX - fromX), 12 * U, '#5b4636', '#33283a');
  });
  after(flight, () => {
    if (S.wallHp > 0) wallHit(toX, toY);
    else castleHit();
  });
}

/** Lava world: a slime that dies breaks into two small ones (which do not split again). */
KILL_HOOKS.push(enemy => {
  if (enemy.type !== 'slime' || enemy.mini || !currentWorld().splitSlimes) return;
  if (world.enemies.length >= MAX_ENEMIES_ALIVE + 60) return;
  for (const side of [-1, 1]) {
    spawnEnemy('slime', { at: { x: enemy.x + side * enemy.r * 0.7, y: enemy.y + rnd(-3, 3) * U }, mini: true });
  }
});

/** An enemy that reaches the wall (while it stands) or the castle deals 1 damage and is gone. */
function checkCastleContact(e) {
  if (S.wallHp > 0) {
    const nx = (e.x - cx) / (wallRadiusX() + e.r);
    const ny = (e.y - wallCenterY()) / (wallRadiusY() + e.r);
    if (nx * nx + ny * ny >= 1) return;
    e.dead = true;
    puff(e.x, e.y, e.color, 6);
    wallHit(e.x, e.y);
  } else if (dist(e.x, e.y, cx, cy) < castleRadius() + e.r) {
    e.dead = true;
    puff(e.x, e.y, e.color, 6);
    castleHit();
  }
}

/* ===== 08-projectiles.js ===== */
/*
 * Projectiles: everything that flies and hits enemies on contact.
 *
 * The generic part (movement, lifetime, collision) is here. What a projectile
 * does when it hits, when it expires and how it looks is defined per kind in
 * PROJECTILE_KINDS; the weapon files register their kinds there:
 *   onHit(p, enemy)   after the damage was dealt; set p.dead = true to remove it
 *   onExpire(p)       lifetime, range or screen edge reached; default: remove
 *   draw(p, angle)    angle is the flight direction
 */
const PROJECTILE_KINDS = {};

/**
 * Adds a projectile. Required: kind, x, y, angle, speed, r (radius), dmg, source.
 * Common options: life (seconds), pierce (extra enemies it passes through),
 * heavy (big things like rolling balls: shield bearers cannot block them).
 * Further fields are kind-specific. `p.hit` holds the enemies already damaged.
 */
function addProjectile(spec) {
  const p = Object.assign({ life: 1.5, pierce: 0, dead: false, hit: new Set() }, spec);
  p.vx = cos(spec.angle) * spec.speed;
  p.vy = sin(spec.angle) * spec.speed;
  world.projectiles.push(p);
  return p;
}

/** Points the projectile at (x, y) without changing its speed. */
function aimProjectile(p, x, y) {
  const angle = atan2(y - p.y, x - p.x);
  p.vx = cos(angle) * p.speed;
  p.vy = sin(angle) * p.speed;
}

function expireProjectile(p) {
  const kind = PROJECTILE_KINDS[p.kind];
  if (kind.onExpire) kind.onExpire(p);
  else p.dead = true;
}

/** Shared "pierce, then bounce to the next enemy, then stop" behaviour of daggers and arrows. */
function pierceOrBounce(p, bounceRange, minLife) {
  if (p.pierce > 0) { p.pierce--; return true; }
  if (p.bounce > 0) {
    const target = nearestEnemy(p.x, p.y, bounceRange, p.hit);
    if (target) {
      p.bounce--;
      aimProjectile(p, target.x, target.y);
      p.life = Math.max(p.life, minLife);
      return true;
    }
  }
  return false;
}

const offScreen = p => p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40;

function updateProjectiles(dt) {
  const list = world.projectiles;
  // Index loop on purpose: hits may add new projectiles to the end of the list.
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    if (p.dead) continue;
    p.life -= dt;

    if (p.returning) {
      // boomerang daggers fly back to the castle and vanish there
      aimProjectile(p, cx, cy);
      if (dist(p.x, p.y, cx, cy) < 26 * U || p.life <= 0) { p.dead = true; continue; }
    } else if (p.homing) {
      steerTowardsEnemy(p, dt);
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.range !== undefined) {           // rolling balls stop after a distance
      p.travelled += p.speed * dt;
      if (p.travelled >= p.range) { expireProjectile(p); continue; }
    }
    if (!p.returning && (p.life <= 0 || offScreen(p))) {
      expireProjectile(p);
      if (p.dead) continue;
    }

    for (const e of world.enemies) {
      if (e.dead || p.hit.has(e) || dist(p.x, p.y, e.x, e.y) >= p.r + e.r) continue;
      p.hit.add(e);
      hurt(e, p.dmg, p.source, !p.heavy);
      const kind = PROJECTILE_KINDS[p.kind];
      if (kind.onHit) kind.onHit(p, e);
      if (p.dead) break;
    }
  }
}

/** Turns the projectile towards the nearest not-yet-hit enemy, at most 6 rad/s. */
function steerTowardsEnemy(p, dt) {
  const target = nearestEnemy(p.x, p.y, 170 * U, p.hit);
  if (!target) return;
  let heading = atan2(p.vy, p.vx);
  let turn = atan2(target.y - p.y, target.x - p.x) - heading;
  turn = atan2(sin(turn), cos(turn));   // normalise to -PI..PI
  heading += clamp(turn, -6 * dt, 6 * dt);
  p.vx = cos(heading) * p.speed;
  p.vy = sin(heading) * p.speed;
}

function drawProjectile(p) {
  PROJECTILE_KINDS[p.kind].draw(p, atan2(p.vy, p.vx));
}

/* ===== 10-weapon-sword.js ===== */
/*
 * Sword: melee slashes at the tapped point.
 *
 * Every weapon file follows the same layout: helpers, one small function per
 * ability, then the attack function that calls the abilities unlocked at the
 * current level (they all stack), then the projectile kinds and kill hooks.
 */

const SWORD_SOURCE = { weapon: 'sword' };

/** White crescent that sweeps open and fades. */
function slashEffect(x, y, angle, radius, rgb = '255,255,255') {
  addEffect(0.28, k => {
    const sweep = Math.min(1, k * 3.2);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.globalAlpha = 1 - k * k;
    ctx.fillStyle = `rgb(${rgb})`;
    ctx.shadowColor = `rgba(${rgb},.9)`;
    ctx.shadowBlur = 14 * U;
    ctx.beginPath();
    ctx.arc(-radius * 0.4, 0, radius * 1.2, -1.1, -1.1 + 2.2 * sweep);
    ctx.arc(-radius * 0.8, 0, radius * 1.38, (-1.1 + 2.2 * sweep) * 0.82, -1.1 * 0.82, true);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }, { cap: FX_CAP_COMMON });
}

/** A sword drops from the sky onto (x, y); `onImpact` runs when it lands. */
function fallingSword(x, y, scale, delay, onImpact) {
  const length = 64 * U * scale, restY = y - 58 * U * scale;
  addEffect(delay, k => {
    ctx.fillStyle = `rgba(0,0,0,${0.12 + 0.2 * k})`;   // growing shadow on the ground
    fillEllipse(ctx, x, y, 22 * U * scale * k, 9 * U * scale * k);
    drawSword(ctx, x, restY - (1 - k * k) * 420 * U, PI / 2, length);
  });
  after(delay, () => {
    onImpact();
    addEffect(0.35, k => {
      ctx.globalAlpha = 1 - k;
      drawSword(ctx, x, restY, PI / 2, length);
      ctx.globalAlpha = 1;
    });
  });
}

/* ---------- Abilities ---------- */

/** Lvl 1/5/10: one, two or three slashes side by side. Lvl 70 freezes what they hit. */
function swordSlashes(a, x, y, angle, damageShare) {
  const count = a.level >= 10 ? 3 : a.level >= 5 ? 2 : 1;
  for (let i = 0; i < count; i++) {
    const offset = (i - (count - 1) / 2) * a.radius * 1.05;
    const sx = x + cos(angle + PI / 2) * offset;
    const sy = y + sin(angle + PI / 2) * offset;
    slashEffect(sx, sy, angle + (i - (count - 1) / 2) * 0.35, a.radius, damageShare < 1 ? '190,225,255' : '255,255,255');
    areaDamage(sx, sy, a.radius, a.damage * damageShare, SWORD_SOURCE, e => {
      if (a.level >= 70) e.freeze = Math.max(e.freeze, 2);
    });
  }
}

/** The basic strike; from lvl 80 it is mirrored on the opposite side of the castle. */
function swordStrike(a, damageShare) {
  swordSlashes(a, a.x, a.y, a.angle, damageShare);
  if (a.level >= 80) swordSlashes(a, 2 * cx - a.x, 2 * cy - a.y, a.angle + PI, damageShare);
}

/** Lvl 25: three swords circle the castle for 3 s; attacking again extends them. */
function swordOrbit(a) {
  const existing = findZone('swordOrbit');
  if (existing) { existing.dur = existing.t + 3; return; }
  const bladeAngle = (zone, i) => zone.startAngle + zone.t * 4 + i * TAU / 3;
  addZone({
    tag: 'swordOrbit', dur: 3, startAngle: rnd(TAU),
    update(zone) {
      for (let i = 0; i < 3; i++) {
        const g = bladeAngle(zone, i);
        const x = cx + cos(g) * 92 * U, y = cy + sin(g) * 92 * U * 0.85;
        for (const e of world.enemies) {
          if (e.dead || e.orbitCd > 0 || dist(x, y, e.x, e.y) >= 20 * U + e.r) continue;
          e.orbitCd = 0.4;
          hurt(e, a.damage * 0.5, SWORD_SOURCE);
        }
      }
    },
    draw(zone) {
      ctx.globalAlpha = zoneFade(zone, 4, 3);
      for (let i = 0; i < 3; i++) {
        const g = bladeAngle(zone, i);
        drawSword(ctx, cx + cos(g) * 70 * U, cy + sin(g) * 70 * U * 0.85, g, 40 * U);
      }
      ctx.globalAlpha = 1;
    },
  });
}

/** Lvl 30: a crescent flies from the tap point to the screen edge through everything. */
function swordBladeWave(a) {
  addProjectile({
    kind: 'bladeWave', x: a.x, y: a.y, angle: a.angle, speed: 380 * U, r: 30 * U,
    dmg: a.damage * 0.8, life: 2, pierce: 99, heavy: true, source: { weapon: 'sword', color: '#bfe6ff' },
  });
}

/** Lvl 40: a ghost sword stays at the tap point and slashes on its own for 3 s (max. 4). */
function swordGhost(a) {
  if (zoneCount('ghostSword') >= 4) return;
  const { x, y } = a, radius = a.radius * 0.9;
  addZone({
    tag: 'ghostSword', dur: 3, tick: 0.3,
    update(zone, dt) {
      zone.tick += dt;
      if (zone.tick < 0.6) return;
      zone.tick = 0;
      slashEffect(x, y, rnd(TAU), radius, '200,180,255');
      areaDamage(x, y, radius, a.damage * 0.5, SWORD_SOURCE);
    },
    draw(zone) {
      ctx.globalAlpha = 0.55 * Math.min(1, (zone.dur - zone.t) * 2);
      drawSword(ctx, x, y - 30 * U + sin(zone.t * 5) * 4 * U, PI / 2 + sin(zone.t * 9) * 0.5, 44 * U, '#d9ccff', '#6b55a8');
      ctx.globalAlpha = 1;
    },
  });
}

/** Lvl 50: a giant sword falls on the tap point. */
function swordGiant(a) {
  const { x, y } = a;
  fallingSword(x, y, 2.4, 0.45, () => {
    areaDamage(x, y, a.radius * 1.9, a.damage * 3, SWORD_SOURCE);
    ring(x, y, a.radius * 2.1, '255,255,255', 0.5);
    session.shake = Math.max(session.shake, 12);
    puff(x, y, '#e9e2d0', 16);
  });
}

/** Lvl 90, every 3rd attack: lightning jumps across up to 7 enemies. */
function swordLightning(a) {
  const points = [[a.x, a.y]], struck = new Set();
  let px = a.x, py = a.y;
  for (let i = 0; i < 7; i++) {
    const e = nearestEnemy(px, py, 170 * U, struck);
    if (!e) break;
    struck.add(e);
    points.push([e.x, e.y]);
    px = e.x;
    py = e.y;
    hurt(e, a.damage * 1.5, { weapon: 'sword', color: '#fff59a' });
  }
  if (points.length < 2) points.push([a.x + rnd(-40, 40) * U, a.y - 60 * U]);   // strike into the air
  addEffect(0.3, k => {
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = '#fff59a';
    ctx.shadowColor = '#ffe24a';
    ctx.shadowBlur = 16 * U;
    ctx.lineWidth = 3 * U;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < points.length - 1; i++) {
      const [x1, y1] = points[i], [x2, y2] = points[i + 1];
      ctx.moveTo(x1, y1);
      for (let j = 1; j < 4; j++) {   // three jittered joints per jump, re-rolled every frame
        ctx.lineTo(x1 + (x2 - x1) * j / 4 + rnd(-9, 9) * U, y1 + (y2 - y1) * j / 4 + rnd(-9, 9) * U);
      }
      ctx.lineTo(x2, y2);
    }
    ctx.stroke();
    ctx.restore();
  });
}

/** Lvl 100: 14 swords rain down, mostly on enemies. */
function swordRain(a) {
  for (let i = 0; i < 14; i++) {
    after(i * 0.1, () => {
      const alive = world.enemies.filter(e => !e.dead);
      const target = alive.length && Math.random() < 0.7 ? alive[Math.floor(rnd(alive.length))] : null;
      const x = target ? target.x : rnd(30, W - 30);
      const y = target ? target.y : rnd(70, H - 110);
      fallingSword(x, y, 1, 0.3, () => {
        areaDamage(x, y, a.radius * 0.9, a.damage * 1.2, SWORD_SOURCE);
        ring(x, y, a.radius, '220,235,255', 0.3);
      });
    });
  }
}

/* ---------- Attack ---------- */

WEAPONS.sword.attack = function (x, y) {
  const level = S.lv.sword;
  // `a` bundles what the abilities need to know about this attack
  const a = { x, y, level, damage: damageOf('sword'), angle: atan2(y - cy, x - cx), radius: 50 * U * (1 + level * 0.004) };

  swordStrike(a, 1);
  if (level >= 15) after(0.35, () => swordStrike(a, 0.6));   // echo
  if (level >= 25) swordOrbit(a);
  if (level >= 30) swordBladeWave(a);
  if (level >= 40) swordGhost(a);
  if (level >= 50) swordGiant(a);
  if (level >= 90 && combat.attackCount % 3 === 0) swordLightning(a);
  if (level >= 100) swordRain(a);
};

/* ---------- Projectile kinds and kill hook ---------- */

PROJECTILE_KINDS.bladeWave = {
  draw(p, angle) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);
    ctx.fillStyle = 'rgba(190,230,255,.85)';
    ctx.shadowColor = '#8fd0ff';
    ctx.shadowBlur = 16 * U;
    ctx.beginPath();
    ctx.arc(-p.r * 0.6, 0, p.r * 1.2, -1.1, 1.1);
