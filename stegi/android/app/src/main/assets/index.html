  const r = (hatched() ? 120 : 95) * U * (1 + Math.sin(game.t * 3) * 0.05);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.25 * Math.sin(game.t * 3)).toFixed(2) + ')';
  ctx.lineWidth = 4 * U;
  ctx.setLineDash([10 * U, 12 * U]);
  ctx.lineDashOffset = -game.t * 20;
  ctx.beginPath(); ctx.arc(cc.x, cc.y + (standY - 60 * U - cc.y) * z, r, 0, TAU); ctx.stroke();
  ctx.restore();
}

/* ===== 09-ui.js ===== */
/* 09-ui.js – the HTML parts: need bars, action buttons, food tray, main menu, parents' settings
 * (opened by holding the gear for GEAR_HOLD seconds), "reset everything", play-time rest screen,
 * and the Back key (window.__back). */

/** Bottom buttons: id, icon, what they do. The bed button only shows in the sleepy half hour. */
const ACTIONS = [
  { id: 'food', icon: 'food', label: 'Essen', run: () => startMode('eat') },
  { id: 'drink', icon: 'drink', label: 'Trinken', run: () => startMode('drink') },
  { id: 'bath', icon: 'bath', label: 'Baden', run: () => startMode('bath') },
  { id: 'ball', icon: 'fun', label: 'Ball spielen', run: () => startMode('ball') },
  { id: 'brush', icon: 'brush', label: 'Zähne putzen', run: () => startMode('brush') },
  { id: 'bed', icon: 'bed', label: 'Licht aus', run: () => goToBed() },
];

/** Builds all buttons once. */
function buildUI() {
  $('needs').innerHTML = NEEDS.map(n => '<div class="need" id="need-' + n + '"><span class="ico">' + iconSVG(n) +
    '</span><i class="bar"><b></b></i></div>').join('');
  $('actions').innerHTML = ACTIONS.map(a => '<button class="round" id="act-' + a.id + '" type="button" aria-label="' + a.label + '">' +
    iconSVG(a.icon) + '</button>').join('');
  for (const a of ACTIONS) $('act-' + a.id).addEventListener('click', a.run);
  $('tray').innerHTML = FOODS.map(f => '<button class="food" id="food-' + f.id + '" data-food="' + f.id + '" type="button" aria-label="Futter"><canvas width="96" height="96"></canvas></button>').join('');
  for (const f of FOODS) {
    const c = $('food-' + f.id).querySelector('canvas').getContext('2d');
    c.save(); c.scale(96 / 60, 96 / 60); drawFood(c, f.id, 30, 30, 44); c.restore();
  }
  $('close').innerHTML = iconSVG('close');
  $('close').addEventListener('click', () => { sound('tap'); endMode(); });
  $('gear').insertAdjacentHTML('afterbegin', iconSVG('gear'));
  $('r-icon').innerHTML = iconSVG('bed');
  $('credit').textContent = '@made by Brownii (Claude.ai) · v' + VERSION;
  setupGear();
  setupSettings();
  $('m-exit').hidden = !window.Android;
  $('m-exit').addEventListener('click', () => { if (window.Android) window.Android.exit(); });
  $('r-ok').addEventListener('click', () => { $('rest').hidden = true; });
}

/** Shows/hides buttons for the current situation. Call after every mode or screen change. */
function refreshUI() {
  const inGame = game.screen === 'game', egg = !hatched() || game.mode === 'hatch';
  const sleeping = asleepNow();
  $('menu').classList.toggle('gone', inGame);
  $('m-title').textContent = S.name;
  $('needs').hidden = !inGame || egg;
  $('needs').classList.toggle('dim', sleeping);
  const idle = game.mode === 'idle';
  $('actions').hidden = !inGame || egg || sleeping || !idle;
  $('act-bed').hidden = !isSleepy(now()) || sleeping;
  $('act-bed').classList.add('glow');
  $('tray').hidden = !(inGame && game.mode === 'eat');
  $('close').hidden = !(inGame && ['eat', 'bath', 'brush', 'ball'].includes(game.mode));
  updateNeedBars();
}

/** Fill and colour of the five need bars. */
function updateNeedBars() {
  for (const n of NEEDS) {
    const v = S.needs[n], el = $('need-' + n);
    if (!el) continue;
    const b = el.querySelector('b');
    b.style.width = v.toFixed(0) + '%';
    b.style.background = v < NEED_SAD ? '#e5533d' : v < NEED_LOW ? '#ffb300' : '#5cc15a';
    el.classList.toggle('low', v < NEED_LOW && !asleepNow());
  }
}

/* ---------- screens ---------- */

/** Menu -> game: zoom from the big stego into the meadow. */
function enterGame() {
  if (game.screen === 'game') return;
  if (limitReached()) { showRest(); return; }
  sound('happy');
  game.screen = 'game';
  pet.x = 0; pet.tx = 0;
  refreshUI();
}

/** Game -> menu. */
function showMenu() {
  endMode();
  game.screen = 'menu';
  save();
  refreshUI();
}

/** The parents' daily play time is used up. */
function showRest() {
  if (game.screen === 'game') showMenu();
  $('rest').hidden = false;
}

/* ---------- parents' settings ---------- */

let gearHold = null;
function setupGear() {
  const g = $('gear');
  const stop = () => { if (gearHold) { cancelAnimationFrame(gearHold.raf); gearHold = null; } g.style.setProperty('--p', 0); };
  g.addEventListener('pointerdown', e => {
    e.preventDefault();
    stop();
    const start = performance.now();
    const step = () => {
      const p = (performance.now() - start) / 1000 / GEAR_HOLD;
      g.style.setProperty('--p', Math.min(1, p));
      if (p >= 1) { stop(); openSettings(); return; }
      gearHold.raf = requestAnimationFrame(step);
    };
    gearHold = { raf: requestAnimationFrame(step) };
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => g.addEventListener(ev, stop));
  g.addEventListener('contextmenu', e => e.preventDefault());
}

const hhmm = m => Math.floor(m / 60) + ':' + String(Math.round(m % 60)).padStart(2, '0') + ' Uhr';

function setupSettings() {
  const opt = (v, text) => '<option value="' + v + '">' + text + '</option>';
  $('s-sleep').innerHTML = SLEEP_CHOICES.map(m => opt(m, hhmm(m))).join('');
  $('s-wake').innerHTML = WAKE_CHOICES.map(m => opt(m, hhmm(m))).join('');
  $('s-limit').innerHTML = LIMIT_CHOICES.map(m => opt(m, m ? m + ' Minuten' : 'unbegrenzt')).join('');
  $('s-name').addEventListener('input', () => {
    const v = $('s-name').value.trim();
    if (v) { S.name = v.slice(0, 12); save(); refreshUI(); }
  });
  $('s-sound').addEventListener('click', () => { S.opts.sound = !S.opts.sound; save(); fillSettings(); });
  $('s-music').addEventListener('click', () => { S.opts.music = !S.opts.music; save(); fillSettings(); });
  $('s-sleep').addEventListener('change', () => { S.opts.sleep = +$('s-sleep').value; S.bedAt = 0; save(); refreshUI(); });
  $('s-wake').addEventListener('change', () => { S.opts.wake = +$('s-wake').value; save(); refreshUI(); });
  $('s-limit').addEventListener('change', () => { S.opts.limit = +$('s-limit').value; save(); });
  $('s-close').addEventListener('click', closeSettings);
  $('s-reset').addEventListener('click', () => { $('confirm').hidden = false; });
  $('c-no').addEventListener('click', () => { $('confirm').hidden = true; });
  $('c-yes').addEventListener('click', () => {
    resetAll();
    $('confirm').hidden = true;
    closeSettings();
    game.mode = 'idle'; game.ball = null; game.bath = null; game.brush = null;
    parts.length = 0;
    showMenu();
  });
}

function fillSettings() {
  $('s-name').value = S.name;
  $('s-sound').textContent = S.opts.sound ? 'an' : 'aus';
  $('s-sound').classList.toggle('on', S.opts.sound);
  $('s-music').textContent = S.opts.music ? 'an' : 'aus';
  $('s-music').classList.toggle('on', S.opts.music);
  $('s-sleep').value = S.opts.sleep;
  $('s-wake').value = S.opts.wake;
  $('s-limit').value = S.opts.limit;
  const t = now();
  $('s-info').textContent = hatched()
    ? 'Tag ' + lifeDay(t) + ' von ' + GROWN_DAY + ' · ' + STAGES[stageAt(t)].name
    : 'Noch im Ei · ' + S.egg.cracks + (S.egg.cracks === 1 ? ' Riss' : ' Risse') + ' von ' + EGG.cracks;
}

function openSettings() {
  fillSettings();
  $('settings').hidden = false;
}
function closeSettings() {
  $('settings').hidden = true;
  $('confirm').hidden = true;
  refreshUI();
}

/**
 * Back key (called from MainActivity). Returns true if the game handled it,
 * false = the app may close (only from the main menu).
 */
window.__back = () => {
  if (!$('confirm').hidden) { $('confirm').hidden = true; return true; }
  if (!$('settings').hidden) { closeSettings(); return true; }
  if (!$('rest').hidden) { $('rest').hidden = true; return true; }
  if (game.screen === 'game') {
    if (!['idle', 'hatch', 'party'].includes(game.mode)) { endMode(); return true; }
    showMenu(); return true;
  }
  return false;
};

/* ===== 10-input.js ===== */
/* 10-input.js – touches on the canvas and on the food tray.
 * One finger at a time. A "tap" is a touch shorter than 0.35 s that moved less than 14 px;
 * everything else is a stroke/drag. */

const touch = { active: false, id: 0, x: 0, y: 0, sx: 0, sy: 0, st: 0, moved: 0, trail: [], ball: false };

/** Is the screen point near the stego or egg in the menu (generous for small fingers)? */
function menuHit(x, y) { return Math.abs(x - W / 2) < 140 * U && y > standY - 280 * U && y < standY + 60 * U; }
/** Is the point on the egg? */
function eggHit(x, y) { return Math.abs(x - W / 2) < 85 * U && y > eggTop() - 30 * U && y < standY + 25 * U; }

function onDown(e) {
  if (touch.active) return;
  unlockAudio();
  Object.assign(touch, { active: true, id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY,
    st: performance.now(), moved: 0, trail: [{ x: e.clientX, y: e.clientY, t: performance.now() }], ball: false });
  if (game.screen !== 'game' || game.trans < 1) return;
  if (game.mode === 'brush' && game.brush && !game.brush.done) { game.brush.x = e.clientX; game.brush.y = e.clientY; }
  if (game.mode === 'ball' && game.ball && !game.ball.carried) {
    touch.ball = dist(e.clientX, e.clientY, game.ball.x, ballY()) < 60 * U;
  }
}

function onMove(e) {
  if (game.held) {
    const h = game.held;
    h.x = e.clientX; h.y = e.clientY;
    if (dist(h.x, h.y, h.sx, h.sy) > 14) h.moved = true;   // small jitter still counts as a tap
    return;
  }
  if (!touch.active || e.pointerId !== touch.id) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y, d = Math.hypot(dx, dy);
  touch.x = e.clientX; touch.y = e.clientY; touch.moved += d;
  touch.trail.push({ x: e.clientX, y: e.clientY, t: performance.now() });
  if (touch.trail.length > 8) touch.trail.shift();
  if (game.screen !== 'game' || game.trans < 1 || d === 0) return;
  game.rubX = e.clientX; game.rubY = e.clientY;
  if (!hatched()) { if (eggHit(e.clientX, e.clientY)) game.rubbing = 0.25; return; }
  if (asleepNow()) return;
  if (game.mode === 'brush' && game.brush && !game.brush.done) { game.brush.x = e.clientX; game.brush.y = e.clientY; game.rubbing = 0.25; return; }
  if (game.mode === 'bath') { game.rubbing = 0.25; return; }
  if (game.mode === 'ball') return;
  if ((game.mode === 'idle' || game.mode === 'eat') && game.stegoInfo && inBox(e.clientX, e.clientY, game.stegoInfo.box)) strokeStego(d);
}

function onUp(e) {
  if (game.held) { dropHeld(); return; }
  if (!touch.active || e.pointerId !== touch.id) return;
  touch.active = false;
  const isTap = touch.moved < 14 && performance.now() - touch.st < 350;
  const x = touch.sx, y = touch.sy;
  if (game.screen === 'menu') {
    if (isTap && game.trans === 0 && menuHit(x, y) && $('settings').hidden && $('rest').hidden) enterGame();
    return;
  }
  if (game.trans < 1) return;
  if (game.mode === 'ball' && touch.ball) {
    // Throw speed from the last ~0.12 s of the finger's movement.
    const tr = touch.trail, last = tr[tr.length - 1];
    let first = tr[0];
    for (const p of tr) if (last.t - p.t <= 120) { first = p; break; }
    const dt = Math.max(0.016, (last.t - first.t) / 1000);
    throwBall((last.x - first.x) / dt, (last.y - first.y) / dt);
    return;
  }
  if (!isTap) return;
  if (!hatched()) {
    if (eggHit(x, y) && game.mode !== 'hatch') { eggFx.wobbleV += 1.2; sound(isNight(now()) ? 'murmur' : 'egg'); }
    return;
  }
  for (let i = 0; i < S.poops.length; i++) {
    const p = poopPos(i);
    if (dist(x, y, p.x, p.y - 15 * U) < 38 * U) { removePoop(i); return; }
  }
  if ((game.mode === 'idle' || game.mode === 'eat') && game.stegoInfo && inBox(x, y, game.stegoInfo.box)) tapStego();
}

/** Food taken from the tray: dropped near the mouth or just tapped -> he eats it. */
function dropHeld() {
  const h = game.held;
  game.held = null;
  const m = game.stegoInfo && game.stegoInfo.mouth;
  if (!h.moved || (m && dist(h.x, h.y, m.x, m.y) < 90 * U) || (game.stegoInfo && inBox(h.x, h.y, game.stegoInfo.box))) offerFood(h.id, h.x, h.y);
}

function setupInput() {
  cv.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', e => { touch.active = false; game.held = null; });
  $('tray').addEventListener('pointerdown', e => {
    const b = e.target.closest('.food');
    if (!b || game.flying || pet.eatT > 0) return;
    e.preventDefault();
    unlockAudio();
    const r = b.getBoundingClientRect();
    game.held = { id: b.dataset.food, x: r.left + r.width / 2, y: r.top + r.height / 2, sx: e.clientX, sy: e.clientY, moved: false };
  });
  window.addEventListener('contextmenu', e => e.preventDefault());
}

/* ===== 11-main.js ===== */
/* 11-main.js – screen size, the frame loop, saving and the start of the game. */

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  U = clamp(Math.min(W / 360, H / 680), 0.75, 1.8);
  // The meadow starts a bit above the middle; the stego stands above the buttons.
  groundY = H * 0.52;
  standY = H - Math.max(150 * U, H * 0.2);
  stegoSize = Math.min(W * 0.92, 440 * U);
  makeDeco();
}

let lastFrame = 0, uiTimer = 0, saveTimer = 0;
/** If true, the frame loop does not simulate (tests drive the game with __st.step). */
let paused = false;

function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - lastFrame) / 1000));
  lastFrame = ts;
  if (!paused) {
    update(dt);
    uiTimer -= dt; saveTimer -= dt;
    if (uiTimer <= 0) { uiTimer = 0.5; refreshUI(); }
    if (saveTimer <= 0) { saveTimer = 5; save(); }
  }
  drawWorld();
  requestAnimationFrame(frame);
}

function start() {
  loadGame();
  resize();
  buildUI();
  setupInput();
  window.addEventListener('resize', resize);
  // Save when the app goes to the background; on return, time has passed (tick catches up).
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
  window.addEventListener('pagehide', save);
  game.sky = skyAt(now());
  refreshUI();
  requestAnimationFrame(ts => { lastFrame = ts; frame(ts); });
}

/* ===== 99-debug.js ===== */
/* 99-debug.js – window.__st: hooks for the tests (tests/*.js). The game itself never uses them.
 * Time travel: __st.setTime('2026-11-20T09:00') or __st.travel(hours) move now() (clock.offset). */

window.__st = {
  get S() { return S; },
  game, pet, clock, parts, soundLog, debugFlags,
  /** Music state: on = tune is scheduled, ctx = AudioContext state ('running' after a touch). */
  get music() { return { on: music.on, ctx: AC ? AC.state : 'none' }; },
  /** Sets the game clock to a local date/time string, e.g. '2026-11-20T09:00'. */
  setTime(s) { clock.offset = new Date(s).getTime() - Date.now(); },
  /** Moves the game clock forward by h hours. */
  travel(h) { clock.offset += h * 3600e3; },
  now, dayIndex, isNight, isSleepy, isAsleep: () => asleepNow(),
  /** Simulates sec seconds of game in 1/30 s steps (also draws, like a real frame). */
  step(sec) { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) { update(1 / 30); drawWorld(); } refreshUI(); },
  /** Stops/starts the real-time frame loop (tests that need exact control). */
  pause(p) { paused = p; },
  enterGame, showMenu, startMode, endMode, goToBed, offerFood, removePoop, tapStego, strokeStego, throwBall,
  eggPhase, eggProgress, eggRub, stageAt: () => stageAt(now()), growth: () => growthAt(now()), lifeDay: () => lifeDay(now()),
  lowest: lowestNeed, limitReached, save, load: loadGame, sanitizeSave, resetAll, blankSave,
  /** Drawing functions (used to render the app icon, see README 4.2). */
  draw: { stego: drawStego, egg: drawEgg },
  /** Screen positions for touches. */
  pos() {
    const i = game.stegoInfo;
    return { W, H, U, standY, groundY, egg: { x: W / 2, y: standY - eggHeight() / 2 },
      mouth: i && i.mouth, head: i && i.head, box: i && i.box, poops: S.poops.map((_, k) => poopPos(k)),
      ball: game.ball && { x: game.ball.x, y: ballY() } };
  },
  state() {
    return { screen: game.screen, trans: game.trans, mode: game.mode, hatched: hatched(), needs: { ...S.needs },
      egg: { ...S.egg }, poops: S.poops.length, asleep: asleepNow(), stage: hatched() ? stageAt(now()) : -1 };
  },
  visible() {
    const v = id => !$(id).hidden;
    return { needs: v('needs'), actions: v('actions'), tray: v('tray'), close: v('close'), bed: v('act-bed'),
      settings: v('settings'), confirm: v('confirm'), rest: v('rest'), exit: v('m-exit'), menuGone: $('menu').classList.contains('gone') };
  },
};

start();
})();
</script>
