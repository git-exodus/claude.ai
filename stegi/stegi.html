<style>
/* Stegi – all styles. Big round buttons for small fingers, soft colours. */
:root { --ink: #23405a; --card: rgba(255, 255, 255, 0.96); --accent: #4caf50; --danger: #e5533d; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: #6dbb4f; overflow: hidden; }
body { font-family: 'Nunito', system-ui, sans-serif; font-weight: 800; color: var(--ink);
  user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
#game { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
svg { display: block; width: 100%; height: 100%; }

/* Needs: five icons with a fill bar, top of the screen. */
#needs { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 64px;
  display: flex; gap: 6px; justify-content: flex-start; pointer-events: none; transition: opacity .4s; }
#needs.dim { opacity: .45; }
.need { flex: 0 1 52px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: rgba(255, 255, 255, .82); border-radius: 16px; padding: 5px 4px 6px; box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
.need .ico { width: 30px; height: 30px; }
.need .bar { width: 38px; height: 8px; border-radius: 4px; background: rgba(0, 0, 0, .12); overflow: hidden; }
.need .bar b { display: block; height: 100%; border-radius: 4px; background: #5cc15a; transition: width .4s, background .4s; }
.need.low { animation: wobble 1s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-8deg) } 75% { transform: rotate(8deg) } }

/* Gear: must be held for 3 s (ring fills), so the child does not open it by accident. */
#gear { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 10px; width: 46px; height: 46px; padding: 9px;
  border-radius: 50%; background: rgba(40, 60, 90, .35); --p: 0; }
#gear .ring { position: absolute; inset: -3px; border-radius: 50%;
  background: conic-gradient(#ffd54f calc(var(--p) * 1turn), transparent 0);
  -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%); mask: radial-gradient(circle, transparent 60%, #000 62%); }

/* Bottom action buttons. */
#actions { position: absolute; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
  display: flex; justify-content: center; gap: 8px; padding: 0 8px; flex-wrap: wrap; }
.round { width: 62px; height: 62px; border-radius: 50%; background: var(--card); padding: 13px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .15), 0 6px 14px rgba(0, 0, 0, .15); transition: transform .1s; }
.round:active { transform: translateY(3px) scale(.95); box-shadow: 0 1px 0 rgba(0, 0, 0, .15); }
.round.glow { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 213, 79, .9), 0 6px 14px rgba(0, 0, 0, .15) } 50% { box-shadow: 0 0 0 10px rgba(255, 213, 79, 0), 0 6px 14px rgba(0, 0, 0, .15) } }
#act-bed { background: #2c3570; }
#close { position: absolute; right: 14px; bottom: max(16px, env(safe-area-inset-bottom)); }

/* Food tray. */
#tray { position: absolute; left: 10px; right: 84px; bottom: max(12px, env(safe-area-inset-bottom));
  display: flex; gap: 6px; justify-content: center; background: rgba(255, 255, 255, .7); border-radius: 22px; padding: 6px; }
#tray .food { flex: 0 1 58px; height: 58px; border-radius: 16px; background: #fff; padding: 2px; touch-action: none; }
#tray canvas { width: 100%; height: 100%; pointer-events: none; }

/* Main menu: name on top, "Beenden" below, the stego in the middle is on the canvas. */
#menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: max(48px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); pointer-events: none; transition: opacity .5s; }
#menu.gone { opacity: 0; }
#menu h1 { margin: 0; font-family: 'Lilita One', 'Nunito', sans-serif; font-weight: 400; font-size: 64px; color: #fff;
  letter-spacing: 1px; text-shadow: 0 4px 0 #3d7a2c, 0 8px 18px rgba(0, 0, 0, .25); }
#menu button { pointer-events: auto; }

/* Big buttons, overlays and cards. */
.big { display: block; width: 100%; min-height: 54px; border-radius: 18px; background: var(--accent); color: #fff; font-size: 20px;
  padding: 10px 18px; margin: 8px 0 0; box-shadow: 0 4px 0 rgba(0, 0, 0, .18); }
.big:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .18); }
.big.danger { background: var(--danger); }
#m-exit { width: auto; min-width: 200px; background: #ffffff; color: var(--ink); }
.ov { position: absolute; inset: 0; background: rgba(20, 30, 60, .45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.card { width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto; background: var(--card); border-radius: 26px; padding: 18px 18px 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .3); touch-action: pan-y; }
.card h2 { margin: 0 0 6px; font-family: 'Lilita One', 'Nunito', sans-serif; font-weight: 400; font-size: 28px; text-align: center; }
.info { margin: 0 0 8px; text-align: center; font-weight: 600; font-size: 15px; color: #4a6276; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 2px; border-bottom: 1px solid rgba(0, 0, 0, .07); font-size: 17px; }
.row input, .row select { font: inherit; font-size: 17px; color: var(--ink); border: 2px solid #cfe0ea; border-radius: 12px; padding: 6px 10px; background: #fff; max-width: 55%; }
.toggle { min-width: 74px; border-radius: 20px; padding: 7px 12px; background: #cfd8dc; color: #546e7a; }

#r-icon { width: 72px; height: 72px; margin: 0 auto 6px; }
[hidden] { display: none !important; }

<div id="game">

<script>
(() => {
'use strict';

/* ===== 01-core.js ===== */
/* 01-core.js – small shared helpers, the canvas and the screen metrics.
 * All files in src/js are concatenated by build.py into ONE function scope (see README 4.1),
 * so everything declared here is visible in every later file. */

const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
/** Smooth 0..1 ramp (smoothstep). */
const smooth = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const $ = id => document.getElementById(id);

const cv = $('c');
const ctx = cv.getContext('2d');

/** Screen size in CSS pixels, device pixel ratio and the size unit U.
 *  U is 1 on a 360 px wide phone; every size in the game is a multiple of U. */
let W = 360, H = 740, DPR = 1, U = 1;
/** y of the ground line where the stego stands (set in resize()). */
let groundY = 500;

/** Linear blend of two "#rrggbb" colours, k = 0..1. */
function mix(c1, c2, k) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, k));
  return 'rgb(' + ch(16) + ',' + ch(8) + ',' + ch(0) + ')';
}

/* ===== 02-config.js ===== */
/* 02-config.js – every game value in one place (no side effects).
 * Change numbers here, then update README section 7 and the tests that check them. */

const VERSION = '0.1';
const SAVE_KEY = 'stegi-v1';

/** The five needs, in the order of the top bar. Each is 0 (empty) .. 100 (full). */
const NEEDS = ['food', 'drink', 'love', 'fun', 'clean'];
/** Awake hours a need takes to drop from 100 to 0. Needs do not drop while he sleeps. */
const NEED_HOURS = { food: 8, drink: 7, love: 8, fun: 8, clean: 16 };
/** Below this a need shows a thought bubble (and hunger makes the tummy rumble). */
const NEED_LOW = 30;
/** Below this the stego looks sad and whines now and then. */
const NEED_SAD = 20;
/** Needs right after hatching. */
const START_NEEDS = 70;

/** Plant food on the tray. value = how much "food" one piece fills. */
const FOODS = [
  { id: 'fern', value: 20 },
  { id: 'leaf', value: 20 },
  { id: 'berry', value: 15 },
  { id: 'apple', value: 25 },
  { id: 'melon', value: 30 },
];
/** One drink from the bowl. */
const DRINK_VALUE = 35;

/** Stroking: every PET_STEP * U pixels of finger movement over the stego gives PET_LOVE love. */
const PET_STEP = 90;
const PET_LOVE = 3;
/** Ball game: every ball brought back gives this much fun. */
const FETCH_FUN = 12;
/** Bath: seconds of scrubbing from dirty (0) to clean (100). */
const BATH_SECONDS = 6;
/** Teeth: seconds of brushing until done. Gives clean and love once. */
const BRUSH_SECONDS = 5;
const BRUSH_CLEAN = 10, BRUSH_LOVE = 5;
/** Removing one poop. */
const POOP_CLEAN = 5;

/** Egg: stroke it PET_SECONDS a day -> one more crack (max 3, at most one per calendar day).
 *  On a later day after the 3rd crack, HATCH_SECONDS of stroking makes it hatch. */
const EGG = { petSeconds: 120, cracks: 3, hatchSeconds: 15 };

/** Growth stages by day since hatching (hatch day = day 1). He also grows a little every day
 *  (size goes smoothly from SIZE_MIN on day 1 to 1 on GROWN_DAY). */
const STAGES = [
  { day: 1, name: 'Baby' },
  { day: 6, name: 'Kind' },
  { day: 13, name: 'Jugendlicher' },
  { day: 23, name: 'Fast groß' },
  { day: 30, name: 'Ganz groß' },
];
const GROWN_DAY = 30;
const SIZE_MIN = 0.385;   // baby = 38.5 % of the grown size (0.55 until 0.1, then 30 % smaller)

/** Poop: after every MEALS pieces of food, a poop appears DELAY_MIN minutes later (at most MAX lie around).
 *  Every poop lying around makes "clean" drop one time faster. */
const POOP = { meals: 4, delayMin: 2, max: 3 };

/** Default sleep window in minutes after midnight (parents can change it). */
const SLEEP_DEFAULT = 20 * 60;
const WAKE_DEFAULT = 7 * 60;
/** Minutes before bedtime when he gets sleepy and the "lights out" button appears. */
const SLEEPY_BEFORE = 30;
/** Choices in the parents' settings. */
const SLEEP_CHOICES = [18 * 60, 18.5 * 60, 19 * 60, 19.5 * 60, 20 * 60, 20.5 * 60, 21 * 60, 21.5 * 60, 22 * 60];
const WAKE_CHOICES = [5.5 * 60, 6 * 60, 6.5 * 60, 7 * 60, 7.5 * 60, 8 * 60, 8.5 * 60, 9 * 60];
/** Daily play time limit in minutes, 0 = off. */
const LIMIT_CHOICES = [0, 15, 30, 45, 60, 90];

/** Seconds the gear button must be held to open the parents' settings. */
const GEAR_HOLD = 3;

/** Switches for the tests (window.__stQuiet = true before load turns music off). */
const debugFlags = { music: !window.__stQuiet };

/** Icons used both as inline SVG (buttons) and on the canvas (thought bubbles).
 *  Coordinates are in a 24x24 box. Each part: d = SVG path, fill and/or stroke (+ w = width). */
const ICONS = {
  food: [
    { d: 'M4 20C4 10 10 3 21 3c0 11-6 17-17 17z', fill: '#5cc15a' },
    { d: 'M5 19L16 8', stroke: '#2e7d32', w: 1.8 },
  ],
  drink: [
    { d: 'M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-13z', fill: '#3fa9f5' },
    { d: 'M8.5 15a3.5 3.5 0 0 0 3.5 3.5', stroke: '#fff', w: 1.8 },
  ],
  love: [
    { d: 'M12 21C5 15 2 12 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 4-3 7-10 13z', fill: '#ff5c8a' },
    { d: 'M6 7.5a2.5 2.5 0 0 1 2.5-2', stroke: '#fff', w: 1.6 },
  ],
  fun: [
    { d: 'M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0z', fill: '#ffcc33' },
    { d: 'M3 8.5c6 2.5 12 2.5 18 0M3 15.5c6-2.5 12-2.5 18 0', stroke: '#e53935', w: 2.2 },
  ],
  clean: [
    { d: 'M2 15a6 6 0 1 0 12 0a6 6 0 1 0-12 0z', fill: '#8fd3ff' },
    { d: 'M13 7a4 4 0 1 0 8 0a4 4 0 1 0-8 0z', fill: '#bfe6ff' },
    { d: 'M15 18a3 3 0 1 0 6 0a3 3 0 1 0-6 0z', fill: '#a8dcff' },
    { d: 'M5 13a3 3 0 0 1 2.5-2.5', stroke: '#fff', w: 1.5 },
  ],
  bath: [
    { d: 'M2 11h20v2a7 7 0 0 1-7 7H9a7 7 0 0 1-7-7z', fill: '#5bb8f0' },
    { d: 'M5 11V6.5a2.5 2.5 0 0 1 5 0', stroke: '#90a4ae', w: 2 },
    { d: 'M12 8a2 2 0 1 0 4 0a2 2 0 1 0-4 0zM16.5 5a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0z', fill: '#bfe6ff' },
    { d: 'M6 20l-1 2.5M18 20l1 2.5', stroke: '#90a4ae', w: 2 },
  ],
  brush: [
    { d: 'M3.5 20.5L14 10', stroke: '#26a69a', w: 3.6 },
    { d: 'M12.5 8.5l4-4 3 3-4 4z', fill: '#fff', stroke: '#90a4ae', w: 1.2 },
    { d: 'M15 3.5l1.5-1.5M18 6.5l1.5-1.5M21 9.5l-1.5 1.5', stroke: '#4fc3f7', w: 1.6 },
  ],
  bed: [
    { d: 'M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11z', fill: '#ffd54f' },
    { d: 'M17 3l.8 1.7 1.7.8-1.7.8L17 8l-.8-1.7-1.7-.8 1.7-.8z', fill: '#fff59d' },
  ],
  close: [
    { d: 'M6 6l12 12M18 6L6 18', stroke: '#e5533d', w: 3.4 },
  ],
  gear: [
    { d: gearPath(), fill: '#ffffff' },
    { d: 'M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0z', fill: '#7a8a99' },
  ],
};

/** Outline of a gear with 8 teeth in the 24x24 icon box. */
function gearPath() {
  const pts = [];
  for (let i = 0; i < 32; i++) {
    const a = i / 32 * TAU, r = (i % 4 < 2) ? 10.5 : 7.8;
    pts.push((12 + Math.cos(a) * r).toFixed(2) + ' ' + (12 + Math.sin(a) * r).toFixed(2));
  }
  return 'M' + pts.join('L') + 'z';
}

/** Inline SVG markup for an icon (used for the HTML buttons). */
function iconSVG(name) {
  const parts = ICONS[name].map(p => '<path d="' + p.d + '" fill="' + (p.fill || 'none') + '"' +
    (p.stroke ? ' stroke="' + p.stroke + '" stroke-width="' + (p.w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' : '') + '/>');
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + parts.join('') + '</svg>';
}

/** Path2D objects for the icons, created once on first use. */
const iconPaths = {};
/** Draws an icon centred at (x, y), size s pixels, on the given canvas context. */
function drawIcon(c, name, x, y, s) {
  if (!iconPaths[name]) iconPaths[name] = ICONS[name].map(p => ({ ...p, path: new Path2D(p.d) }));
  c.save();
  c.translate(x - s / 2, y - s / 2);
  c.scale(s / 24, s / 24);
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const p of iconPaths[name]) {
    if (p.fill) { c.fillStyle = p.fill; c.fill(p.path); }
    if (p.stroke) { c.strokeStyle = p.stroke; c.lineWidth = p.w || 2; c.stroke(p.path); }
  }
  c.restore();
}

/* ===== 03-clock.js ===== */
/* 03-clock.js – real time: day numbers, night, sleepiness and the light of the sky.
 * Everything uses now(), never Date.now() directly, so the tests can "time travel"
 * by changing clock.offset (see 99-debug.js). */

/** offset = test time travel in ms; tests may preset it before loading with window.__stOffset. */
const clock = { offset: window.__stOffset || 0 };
const now = () => Date.now() + clock.offset;

/** Calendar day number of a timestamp in local time (days since 1970-01-01). Changes at midnight. */
function dayIndex(t) {
  const d = new Date(t);
  return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
}

/** Minutes after local midnight, with fractions (0 .. 1440). */
function minuteOfDay(t) {
  const d = new Date(t);
  return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60 + d.getMilliseconds() / 60000;
}

/** Minutes from a to b going forward around the clock (0 .. 1440). */
const minutesUntil = (a, b) => ((b - a) % 1440 + 1440) % 1440;
/** true if minute m lies in [from, to), also when the window wraps past midnight. */
const inWindow = (m, from, to) => minutesUntil(from, m) < minutesUntil(from, to);

/** Night = between bedtime and wake-up time (parents' settings, default 20:00 – 7:00). */
function isNight(t) { return inWindow(minuteOfDay(t), S.opts.sleep, S.opts.wake); }

/** The last SLEEPY_BEFORE minutes before bedtime: he yawns and can be put to bed early. */
function isSleepy(t) { return inWindow(minuteOfDay(t), (S.opts.sleep - SLEEPY_BEFORE + 1440) % 1440, S.opts.sleep); }

/** Is he asleep at time t? At night always; in the sleepy time only after "lights out" (S.bedAt). */
function isAsleep(t) {
  if (isNight(t)) return true;
  return S.bedAt > 0 && t >= S.bedAt && t - S.bedAt < SLEEPY_BEFORE * 60000 && isSleepy(t);
}

/** Seconds between a and b that are NOT night. Needs only drop during these.
 *  Long gaps (app closed) are walked in one-minute steps, at most 60 days. */
function awakeSeconds(a, b) {
  if (b <= a) return 0;
  if (b - a <= 60000) return isNight((a + b) / 2) ? 0 : (b - a) / 1000;
  let sum = 0;
  const end = Math.min(b, a + 60 * 864e5);
  for (let t = a; t < end; t += 60000) {
    const step = Math.min(60000, end - t);
    if (!isNight(t + step / 2)) sum += step / 1000;
  }
  return sum;
}

/**
 * Light of the sky at time t:
 *   light 0 (deep night) .. 1 (full day)
 *   warm  0 .. 1, orange glow around sunrise and sunset
 *   sun   0 .. 1 position of the sun between wake-up and bedtime (or of the moon at night)
 *   night true between bedtime and wake-up
 * Sunrise starts 30 minutes before wake-up, the evening glow 90 minutes before bedtime.
 */
function skyAt(t) {
  const m = minuteOfDay(t), sleep = S.opts.sleep, wake = S.opts.wake;
  const night = inWindow(m, sleep, wake);
  if (night) {
    const sinceSleep = minutesUntil(sleep, m), toWake = minutesUntil(m, wake);
    const dusk = 1 - smooth(sinceSleep / 40), dawn = 1 - smooth(toWake / 30);
    const len = minutesUntil(sleep, wake);
    return { light: Math.max(dusk * 0.35, dawn * 0.45), warm: Math.max(dusk, dawn) * 0.8, sun: sinceSleep / len, night };
  }
  const sinceWake = minutesUntil(wake, m), toSleep = minutesUntil(m, sleep);
  const len = minutesUntil(wake, sleep);
  const light = Math.min(lerp(0.45, 1, smooth(sinceWake / 60)), lerp(0.35, 1, smooth(toSleep / 90)));
  const warm = Math.max(1 - smooth(sinceWake / 90), 1 - smooth(toSleep / 100));
  return { light, warm, sun: sinceWake / len, night };
}

/* ===== 04-state.js ===== */
/* 04-state.js – the saved game S, loading/saving, and the passing of real time (tick).
 * S is always the same object; loading copies fields into it. */

/** A fresh game: an egg in the nest. t = creation time. */
function blankSave(t) {
  return {
    v: 1,
    name: 'Stegi',
    created: t,
    // Egg: petSec = seconds stroked on petDay; cracks 0..3; crackDay = day of the last crack;
    // hatchSec = stroking on hatch day.
    egg: { petDay: -1, petSec: 0, cracks: 0, crackDay: -1, hatchSec: 0 },
    hatchDay: null,          // day number of hatching (null = still an egg)
    needs: { food: START_NEEDS, drink: START_NEEDS, love: START_NEEDS, fun: START_NEEDS, clean: START_NEEDS },
    last: t,                 // time up to which needs have been updated
    meals: 0,                // food pieces since the last poop
    poopAt: 0,               // time when the next poop appears (0 = none due)
    poops: [],               // poops lying around: { x } as fraction of screen width (0..1)
    bedAt: 0,                // time of "lights out" in the sleepy half hour (0 = not put to bed)
    teethDay: -1,            // day the teeth were brushed last
    stageSeen: 0,            // highest growth stage already celebrated
    playDay: -1, playSec: 0, // play time today (for the parents' daily limit)
    opts: { sound: true, music: true, sleep: SLEEP_DEFAULT, wake: WAKE_DEFAULT, limit: 0 },
  };
}

let S = blankSave(Date.now());

/** Number in [a, b] or the fallback. */
const num = (v, a, b, fb) => (typeof v === 'number' && isFinite(v) ? clamp(v, a, b) : fb);

/** Checks every field of a loaded save; missing or broken fields get defaults.
 *  Old saves must always keep loading – add new fields here with a default. */
function sanitizeSave(o, t) {
  const b = blankSave(t);
  if (!o || typeof o !== 'object') return b;
  const e = o.egg || {};
  b.name = typeof o.name === 'string' && o.name.trim() ? o.name.trim().slice(0, 12) : b.name;
  b.created = num(o.created, 0, 1e14, t);
  b.egg = {
    petDay: num(e.petDay, -1, 1e6, -1), petSec: num(e.petSec, 0, 1e5, 0),
    cracks: Math.round(num(e.cracks, 0, EGG.cracks, 0)), crackDay: num(e.crackDay, -1, 1e6, -1),
    hatchSec: num(e.hatchSec, 0, 1e5, 0),
  };
  b.hatchDay = typeof o.hatchDay === 'number' && isFinite(o.hatchDay) ? o.hatchDay : null;
  for (const n of NEEDS) b.needs[n] = num(o.needs && o.needs[n], 0, 100, START_NEEDS);
  b.last = num(o.last, 0, 1e14, t);
  b.meals = Math.round(num(o.meals, 0, 100, 0));
  b.poopAt = num(o.poopAt, 0, 1e14, 0);
  b.poops = Array.isArray(o.poops) ? o.poops.filter(p => p && typeof p.x === 'number').slice(0, POOP.max)
    .map(p => ({ x: clamp(p.x, 0.05, 0.95) })) : [];
  b.bedAt = num(o.bedAt, 0, 1e14, 0);
  b.teethDay = num(o.teethDay, -1, 1e6, -1);
  b.stageSeen = Math.round(num(o.stageSeen, 0, STAGES.length - 1, 0));
  b.playDay = num(o.playDay, -1, 1e6, -1);
  b.playSec = num(o.playSec, 0, 1e6, 0);
  const op = o.opts || {};
  b.opts = {
    sound: op.sound !== false, music: op.music !== false,
    sleep: SLEEP_CHOICES.includes(op.sleep) ? op.sleep : SLEEP_DEFAULT,
    wake: WAKE_CHOICES.includes(op.wake) ? op.wake : WAKE_DEFAULT,
    limit: LIMIT_CHOICES.includes(op.limit) ? op.limit : 0,
  };
  return b;
}

/** Loads S from localStorage (or starts a new egg). */
function loadGame() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { raw = null; }
  Object.assign(S, sanitizeSave(raw, now()));
}

/** Writes S to localStorage. Ignores errors (private mode, full storage). */
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* not saved */ }
}

/** "Alles zurücksetzen": everything back to a new egg, settings included. */
function resetAll() {
  for (const k of Object.keys(S)) delete S[k];
  Object.assign(S, blankSave(now()));
  save();
}

const hatched = () => S.hatchDay !== null;

/** Day since hatching, hatch day = 1. */
function lifeDay(t) { return hatched() ? dayIndex(t) - S.hatchDay + 1 : 0; }

/** Growth stage index 0..4 (see STAGES). */
function stageAt(t) {
  const d = lifeDay(t);
  let i = 0;
  while (i + 1 < STAGES.length && d >= STAGES[i + 1].day) i++;
  return i;
}

/** Growth 0 (hatch day) .. 1 (GROWN_DAY and later), grows a bit every day. */
function growthAt(t) { return clamp((lifeDay(t) - 1) / (GROWN_DAY - 1), 0, 1); }

/** Lowest need and its value. */
function lowestNeed() {
  let best = NEEDS[0];
  for (const n of NEEDS) if (S.needs[n] < S.needs[best]) best = n;
  return { need: best, value: S.needs[best] };
}

/** Adds to a need, kept within 0..100. */
function addNeed(n, v) { S.needs[n] = clamp(S.needs[n] + v, 0, 100); }

/**
 * Lets real time pass up to t (called every frame and after the app was closed):
 * needs drop during awake time, a due poop appears. Night time does not count.
 * If the clock went backwards (time zone, manual change), nothing happens.
 */
function tick(t) {
  if (t <= S.last) { S.last = Math.min(S.last, t); return; }
  if (!hatched()) { S.last = t; return; }
  const sec = awakeSeconds(S.last, t);
  for (const n of NEEDS) {
    let rate = 100 / (NEED_HOURS[n] * 3600);
    if (n === 'clean') rate *= 1 + S.poops.length;
    S.needs[n] = clamp(S.needs[n] - rate * sec, 0, 100);
  }
  if (S.poopAt && t >= S.poopAt) {
    S.poopAt = 0;
    S.meals = 0;
    if (S.poops.length < POOP.max) S.poops.push({ x: newPoopX() });
    onPoop();
  }
  if (S.bedAt && !isSleepy(t) && !isNight(t)) S.bedAt = 0;  // the morning after: forget "lights out"
  S.last = t;
}

/** A free spot on the ground for a new poop, away from the middle where the stego stands. */
function newPoopX() {
  for (let i = 0; i < 20; i++) {
    const x = Math.random() < 0.5 ? rnd(0.1, 0.3) : rnd(0.7, 0.9);
    if (S.poops.every(p => Math.abs(p.x - x) > 0.09)) return x;
  }
  return rnd(0.1, 0.9);
}

/** Counts a meal; every POOP.meals meals a poop is scheduled. */
function countMeal() {
  S.meals++;
  if (S.meals >= POOP.meals && !S.poopAt) S.poopAt = now() + POOP.delayMin * 60000;
}

/** Play time for the parents' limit: adds seconds and tells whether today's limit is used up. */
function addPlayTime(sec) {
  const d = dayIndex(now());
  if (S.playDay !== d) { S.playDay = d; S.playSec = 0; }
  S.playSec += sec;
  return limitReached();
}
function limitReached() {
  return S.opts.limit > 0 && S.playDay === dayIndex(now()) && S.playSec >= S.opts.limit * 60;
}

/* ===== 05-audio.js ===== */
/* 05-audio.js – all sounds are synthesised live with WebAudio (no sound files, no speech).
 * Browsers and the Android WebView only allow sound after a touch: unlockAudio() runs on the
 * first touch. sound(name) plays one effect; music is in startMusic()/updateMusic(). */

let AC = null, master = null;
/** Short log of played sounds for the tests (name + time). */
const soundLog = [];

function getAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = 0.9;
      master.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  return AC;
}

/** Called on every touch until the AudioContext runs. */
function unlockAudio() {
  const a = getAudio();
  if (a && a.state === 'suspended') a.resume();
}
['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev =>
  window.addEventListener(ev, unlockAudio, { capture: true, passive: true }));

/** A tone: frequency f (to f2 if given) for dur seconds, starting `at` seconds from now. */
function tone(f, dur, { type = 'sine', vol = 0.2, f2 = 0, at = 0, attack = 0.01, vib = 0, out = master } = {}) {
  const a = AC, t0 = a.currentTime + at;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  if (vib) {   // vibrato: a slow oscillator wobbling the pitch
    const l = a.createOscillator(), lg = a.createGain();
    l.frequency.value = 7; lg.gain.value = vib;
    l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0 + dur);
  }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(out);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

let noiseBuf = null;
/** Filtered noise for dur seconds (splash, rumble, snore, crack ...). trem = tremolo speed in Hz. */
function noise(dur, { freq = 1000, q = 1, vol = 0.2, at = 0, type = 'bandpass', freq2 = 0, trem = 0, attack = 0.02 } = {}) {
  const a = AC, t0 = a.currentTime + at;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; s.loop = true;
  f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
  if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let out = g;
  if (trem) {  // tremolo: an extra gain stage wobbled by a slow oscillator
    const tg = a.createGain(), l = a.createOscillator(), lg = a.createGain();
    tg.gain.value = 0.5; l.frequency.value = trem; lg.gain.value = 0.5;
    l.connect(lg); lg.connect(tg.gain); l.start(t0); l.stop(t0 + dur);
    g.connect(tg); out = tg;
  }
  s.connect(f); f.connect(g); out.connect(master);
  s.start(t0); s.stop(t0 + dur + 0.05);
}

/** Every sound effect of the game. */
const SOUNDS = {
  // Content purring while being stroked.
  purr: () => { noise(0.9, { freq: 180, q: 2, vol: 0.35, type: 'lowpass', trem: 24 }); tone(55, 0.9, { vol: 0.08, type: 'triangle' }); },
  // "Hi-hi-hi" giggle.
  giggle: () => { [0, 0.11, 0.22, 0.33].forEach((at, i) => tone(820 + i * 70, 0.1, { at, vol: 0.13, f2: 1100 + i * 60, type: 'triangle' })); },
  // Big yawn.
  yawn: () => { tone(260, 1.3, { f2: 160, vol: 0.12, vib: 12, attack: 0.3, type: 'triangle' }); noise(1.2, { freq: 600, vol: 0.05, attack: 0.3 }); },
  // Snoring: breathing in (noise) and a soft whistle out.
  snore: () => { noise(1.0, { freq: 220, freq2: 320, q: 4, vol: 0.22, attack: 0.5, type: 'lowpass', trem: 30 }); tone(900, 0.5, { at: 1.1, f2: 650, vol: 0.03 }); },
  // Sad whining.
  whine: () => { tone(720, 0.55, { f2: 480, vol: 0.1, vib: 18, attack: 0.08 }); tone(680, 0.6, { at: 0.65, f2: 420, vol: 0.09, vib: 18, attack: 0.08 }); },
  // Hungry tummy rumbling.
  rumble: () => { noise(1.1, { freq: 110, q: 6, vol: 0.5, type: 'lowpass', trem: 9, attack: 0.15 }); tone(70, 1.0, { f2: 55, vol: 0.12, vib: 6, type: 'triangle', attack: 0.15 }); },
  // Chewing: three crunches.
  munch: () => { [0, 0.22, 0.44].forEach(at => noise(0.12, { at, freq: 1500, q: 1.5, vol: 0.28 })); },
  // Slurping water.
  slurp: () => { [0, 0.3, 0.6].forEach(at => noise(0.22, { at, freq: 500, freq2: 1600, q: 5, vol: 0.2 })); },
  // "Mm-mm", he does not want any more.
  refuse: () => { tone(240, 0.22, { vol: 0.12, type: 'triangle' }); tone(200, 0.3, { at: 0.28, vol: 0.12, type: 'triangle' }); },
  // Mumbling in his sleep.
  murmur: () => { tone(180, 0.6, { f2: 150, vol: 0.08, vib: 10, attack: 0.15, type: 'triangle' }); },
  // Splash in the bath / shower.
  splash: () => { noise(0.6, { freq: 1800, q: 0.7, vol: 0.25, freq2: 600 }); },
  // Soap bubble pop.
  pop: () => { tone(500 + Math.random() * 300, 0.07, { f2: 1200, vol: 0.08 }); },
  // Brushing teeth: scrub-scrub.
  scrub: () => { noise(0.15, { freq: 4000, q: 1, vol: 0.12 }); },
  // Sparkle when clean or brushed.
  sparkle: () => { [0, 0.07, 0.14, 0.21].forEach((at, i) => tone(1600 + i * 300, 0.25, { at, vol: 0.06 })); },
  // Poop gone.
  pling: () => { tone(1200, 0.25, { vol: 0.12 }); tone(1800, 0.35, { at: 0.08, vol: 0.1 }); },
  // Poop appears.
  plop: () => { tone(300, 0.15, { f2: 120, vol: 0.15, type: 'triangle' }); },
  // Ball bounce.
  boing: () => { tone(180, 0.25, { f2: 420, vol: 0.12, type: 'triangle' }); },
  // A little heart pling while stroking the egg.
  egg: () => { tone(880 + Math.random() * 200, 0.2, { vol: 0.06 }); },
  // Egg cracks.
  crack: () => { noise(0.08, { freq: 3500, q: 2, vol: 0.35 }); noise(0.12, { at: 0.1, freq: 2500, q: 2, vol: 0.3 }); tone(120, 0.15, { vol: 0.1, type: 'triangle' }); },
  // Peep from inside the egg.
  peep: () => { tone(1700, 0.12, { f2: 2200, vol: 0.09 }); tone(1800, 0.14, { at: 0.18, f2: 2300, vol: 0.09 }); },
  // Fanfare for hatching and growing up.
  fanfare: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, { at: i * 0.14, vol: 0.12, type: 'triangle' })); tone(1047, 0.8, { at: 0.56, vol: 0.1, type: 'triangle' }); },
  // Soft tap on a button.
  tap: () => { tone(660, 0.08, { vol: 0.06, type: 'triangle' }); },
  // Happy "hm!" when lying down / waking up.
  happy: () => { tone(500, 0.15, { f2: 700, vol: 0.1, type: 'triangle' }); tone(700, 0.2, { at: 0.15, f2: 900, vol: 0.1, type: 'triangle' }); },
};

/** Plays a sound effect if sound is on and allowed. */
function sound(name) {
  soundLog.push({ name, t: performance.now() });
  if (soundLog.length > 200) soundLog.shift();
  if (!S.opts.sound) return;
  const a = getAudio();
  if (!a || a.state !== 'running') return;
  try { SOUNDS[name](); } catch (e) { /* audio problems never stop the game */ }
}

/* ---------- Music: a gentle music-box tune, only by day ---------- */

const music = { on: false, next: 0, step: 0, gain: null };
/** 32 steps of melody (MIDI note numbers, 0 = rest) over a simple bass, C major pentatonic. */
const TUNE = [72, 0, 76, 79, 76, 0, 74, 72, 74, 0, 76, 74, 72, 0, 67, 0,
              69, 0, 72, 74, 76, 0, 79, 76, 74, 72, 74, 0, 72, 0, 0, 0];
const BASS = [48, 55, 52, 55, 43, 50, 47, 50];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);

/** Turns the music on/off depending on settings, screen and night. Called every frame. */
function updateMusic(wanted) {
  const a = AC;
  const want = wanted && S.opts.music && debugFlags.music && a && a.state === 'running';
  if (want && !music.on) {
    music.on = true;
    music.gain = a.createGain(); music.gain.gain.value = 0.0001; music.gain.connect(master);
    music.gain.gain.exponentialRampToValueAtTime(0.5, a.currentTime + 1.5);
    music.next = a.currentTime + 0.2;
  } else if (!want && music.on) {
    music.on = false;
    if (a) { const g = music.gain; g.gain.setTargetAtTime(0.0001, a.currentTime, 0.3); setTimeout(() => g.disconnect(), 2000); }
  }
  if (!music.on) return;
  // Schedule the next notes up to 0.5 s ahead.
  const beat = 0.32;
  while (music.next < a.currentTime + 0.5) {
    const at = music.next - a.currentTime, i = music.step % TUNE.length;
    if (TUNE[i]) tone(midi(TUNE[i]), 0.9, { at, vol: 0.05, type: 'sine', out: music.gain });
    if (i % 4 === 0) tone(midi(BASS[(i / 4) % BASS.length]), 1.2, { at, vol: 0.04, type: 'triangle', out: music.gain });
    music.next += beat;
    music.step++;
  }
}

/* ===== 06-draw-stego.js ===== */
/* 06-draw-stego.js – draws the stegosaurus in every growth stage and mood.
 * Everything is drawn with canvas paths in a "unit" system: the grown stego is about
 * 260 units long (tail tip to snout) and 0,0 is the ground under the middle of his body.
 * y goes up as negative numbers. drawStego() scales units to pixels. */

const STEGO_COLORS = {
  body: '#8bd35f', dark: '#5fa83c', belly: '#dcf3a6', line: '#2f5d24',
  plate: ['#ff9a4d', '#ffbe5c'], plateLine: '#b8571d', spot: '#71bd4a',
  eye: '#2a2a35', cheek: '#ff8fa8', mouth: '#7a2335', tongue: '#ff7b93',
  dirt: '#8a6a3f', nail: '#f6f2dc',
};

/** Number of back plates per growth stage. */
const PLATE_COUNT = [4, 5, 6, 7, 7];

/**
 * Draws the stego standing on the ground at screen point (x, y).
 *   size  pixel length of a fully grown stego; o.g (growth 0..1) shrinks him to SIZE_MIN.
 *   o     { colors (optional palette, default STEGO_COLORS), g, stage, t, dir (1 = looks right), pose ('stand'|'walk'|'lie'), walk (phase),
 *           eyes ('open'|'happy'|'closed'|'sad'), blink (0..1), mouth ('smile'|'open'|'chew'|
 *           'sad'|'yawn'|'grin'|'closed'), headDown (0..1), wiggle (0..1), dirt (0..1),
 *           jump (px up), wag (0..1) }
 * Returns screen positions: mouth {x, y}, head {x, y, r}, box {x, y, w, h} (for touches).
 */
function drawStego(c, x, y, size, o) {
  const C = o.colors || STEGO_COLORS, t = o.t || 0, g = o.g || 0, stage = o.stage || 0;
  const k = size * lerp(SIZE_MIN, 1, g) / 260;      // pixels per unit
  const dir = o.dir || 1, lie = o.pose === 'lie';
  const hs = lerp(1.5, 1.0, g);                       // head scale: babies have big heads
  const breathe = 1 + Math.sin(t * (lie ? 1.6 : 2.4)) * (lie ? 0.035 : 0.02);
  const legLen = lie ? 0 : lerp(18, 30, g);
  const rx = 62, ry = lerp(36, 42, g) * breathe;
  const cx = 0, cy = lie ? -ry * 0.78 : -legLen - ry * 0.78;
  const walk = o.pose === 'walk' ? o.walk || 0 : 0;
  const bob = o.pose === 'walk' ? Math.abs(Math.sin(walk)) * -3 : 0;

  c.save();
  c.translate(x, y - (o.jump || 0));
  c.scale(k * dir, k);
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.lineWidth = 3;
  c.strokeStyle = C.line;
  c.translate(0, bob);

  // Soft shadow on the ground (not lifted by the jump).
  c.save();
  c.translate(0, -bob + (o.jump || 0) / k);
  c.fillStyle = 'rgba(30,60,20,0.18)';
  c.beginPath(); c.ellipse(8, 2, 95 * (o.jump ? 0.85 : 1), 9, 0, 0, TAU); c.fill();
  c.restore();

  // ---- tail with spikes ----
  const tailLen = lerp(38, 78, g), wagA = Math.sin(t * (o.wag ? 9 : 2.2)) * (o.wag ? 7 : 3);
  const tipX = cx - rx - tailLen, tipY = cy - 6 + wagA + (lie ? 10 : 0);
  if (stage >= 1) {
    const sp = lerp(4, 25, g);   // tail spikes grow with him (+25 % since 0.2)
    c.fillStyle = C.nail; c.strokeStyle = C.plateLine; c.lineWidth = 2;
    // Up to four spikes near the tail tip, pointing up and backwards (two from stage 1, four from stage 3).
    const spikes = stage >= 3 ? [[5, -0.5], [9, 0.25], [17, -0.35], [21, 0.4]] : [[7, -0.4], [17, 0.3]];
    for (const [ox, lean] of spikes) {
      const bx = tipX + ox, by = tipY - 2;
      c.beginPath(); c.moveTo(bx - 3.5, by); c.lineTo(bx - sp * 0.45 + lean * sp, by - sp); c.lineTo(bx + 3.5, by);
      c.closePath(); c.fill(); c.stroke();
    }
    c.lineWidth = 3; c.strokeStyle = C.line;
  }
  c.fillStyle = C.body;
  c.beginPath();
  c.moveTo(cx - rx * 0.6, cy - ry * 0.55);
  c.quadraticCurveTo(cx - rx - tailLen * 0.45, cy - ry * 0.35, tipX, tipY);
  c.quadraticCurveTo(cx - rx - tailLen * 0.35, cy + ry * 0.45, cx - rx * 0.55, cy + ry * 0.62);
  c.closePath(); c.fill(); c.stroke();

  // ---- legs on the far side (darker, behind the body) ----
  const legW = lerp(21, 27, g);
  const leg = (lx, phase, far) => {
    if (lie) return;
    const swing = walk ? Math.sin(walk + phase) * 7 : 0, lift = walk ? Math.max(0, Math.cos(walk + phase)) * 4 : 0;
    const top = cy + ry * 0.2, bot = -lift;
    c.fillStyle = far ? C.dark : C.body;
    c.beginPath();
    c.moveTo(lx - legW / 2, top);
    c.lineTo(lx - legW / 2 + swing, bot - 6);
    c.quadraticCurveTo(lx - legW / 2 + swing, bot, lx + swing, bot);
    c.lineTo(lx + legW / 2 + swing + 2, bot);
    c.quadraticCurveTo(lx + legW / 2 + swing + 2, bot - 6, lx + legW / 2 + swing, bot - 8);
    c.lineTo(lx + legW / 2, top);
    c.closePath(); c.fill(); c.stroke();
    if (!far) {   // three little toenails
      c.fillStyle = C.nail;
      for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(lx + swing - legW / 2 + 5 + i * (legW / 2.6), bot - 1, 2.6, Math.PI, 0); c.fill(); }
    }
  };
  leg(-28, Math.PI, true);
  leg(38, 0, true);

  // ---- back plates (behind the body) ----
  const n = PLATE_COUNT[stage], plateBase = lerp(13, 39, g);   // plates grow from baby to grown (+50 % since 0.2)
  for (let i = 0; i < n; i++) {
    const f = n === 1 ? 0.5 : i / (n - 1);
    const a = lerp(Math.PI * 1.13, Math.PI * 1.86, f);
    const px = cx + Math.cos(a) * rx * 0.92, py = cy + Math.sin(a) * ry * 0.92;
    let nx = Math.cos(a) / rx, ny = Math.sin(a) / ry;
    const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
    const wig = (o.wiggle || 0) * Math.sin(t * 22 + i * 1.7) * 0.25;
    const ang = Math.atan2(ny, nx) + wig;
    const h = plateBase * (0.7 + 0.45 * Math.sin(Math.PI * (0.25 + f * 0.6)));
    c.save();
    c.translate(px, py); c.rotate(ang + Math.PI / 2);
    c.fillStyle = C.plate[i % 2];
    c.strokeStyle = C.plateLine;
    c.beginPath();
    c.moveTo(-h * 0.42, 6);
    c.quadraticCurveTo(-h * 0.5, -h * 0.55, 0, -h);
    c.quadraticCurveTo(h * 0.5, -h * 0.55, h * 0.42, 6);
    c.closePath(); c.fill(); c.stroke();
    c.restore();
  }
  c.strokeStyle = C.line;

  // ---- legs on the near side (drawn before the body, so the body hides their tops) ----
  leg(-40, 0, false);
  leg(26, Math.PI, false);

  // ---- body with belly, spots and dirt ----
  c.fillStyle = C.body;
  c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, TAU); c.fill(); c.stroke();
  c.save();
  c.beginPath(); c.ellipse(cx, cy, rx - 1.5, ry - 1.5, 0, 0, TAU); c.clip();
  c.fillStyle = C.belly;
  c.beginPath(); c.ellipse(cx + 10, cy + ry * 0.85, rx * 0.85, ry * 0.5, 0, 0, TAU); c.fill();
  c.fillStyle = C.spot;
  for (const [sx, sy, sr] of [[-28, -0.45, 7], [-6, -0.62, 6], [16, -0.4, 5], [-40, -0.05, 5], [30, -0.65, 4]]) {
    c.beginPath(); c.arc(cx + sx, cy + sy * ry, sr, 0, TAU); c.fill();
  }
  if (o.dirt > 0) {   // mud spots when he is dirty
    c.globalAlpha = clamp(o.dirt, 0, 1) * 0.75;
    c.fillStyle = C.dirt;
    for (const [sx, sy, sr] of [[-20, 0.2, 9], [12, 0.05, 7], [36, 0.3, 6], [-45, 0.4, 6], [0, -0.3, 5], [24, 0.55, 8]]) {
      c.beginPath(); c.ellipse(cx + sx, cy + sy * ry, sr * 1.3, sr, 0.4, 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
  }
  c.restore();

  // ---- neck and head (the head can be lowered to drink) ----
  const nbx = cx + rx * 0.72, nby = cy - ry * 0.05;
  const hx = cx + rx + 12 * hs, hy = lie ? -16 * hs : cy + 4 - (hs - 1) * 14;
  c.save();
  c.translate(nbx, nby);
  c.rotate((o.headDown || 0) * 0.55);
  c.translate(-nbx, -nby);
  c.fillStyle = C.body;
  c.beginPath();
  c.moveTo(cx + rx * 0.55, cy - ry * 0.6);
  c.quadraticCurveTo(hx - 18 * hs, hy - 22 * hs, hx - 6 * hs, hy - 18 * hs);
  c.lineTo(hx - 6 * hs, hy + 16 * hs);
  c.quadraticCurveTo(hx - 18 * hs, hy + 18 * hs, cx + rx * 0.6, cy + ry * 0.55);
  c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(cx + rx * 0.62, cy - ry * 0.68);
  c.quadraticCurveTo(hx - 18 * hs, hy - 22 * hs, hx - 6 * hs, hy - 18 * hs);
  c.moveTo(cx + rx * 0.78, cy + ry * 0.55);
  c.quadraticCurveTo(hx - 18 * hs, hy + 18 * hs, hx - 6 * hs, hy + 16 * hs);
  c.stroke();

  // Head = round skull + snout, outlined together.
  const skull = () => { c.beginPath(); c.ellipse(hx, hy, 25 * hs, 21 * hs, 0, 0, TAU); };
  const snout = () => { c.beginPath(); c.ellipse(hx + 16 * hs, hy + 6 * hs, 17 * hs, 13 * hs, 0.1, 0, TAU); };
  skull(); c.stroke(); snout(); c.stroke();
  c.fillStyle = C.body; skull(); c.fill(); snout(); c.fill();
  // Nostril and cheek.
  c.fillStyle = C.line;
  c.beginPath(); c.arc(hx + 28 * hs, hy + 1 * hs, 1.8 * hs, 0, TAU); c.fill();
  c.fillStyle = C.cheek; c.globalAlpha = 0.55;
  c.beginPath(); c.ellipse(hx + 10 * hs, hy + 9 * hs, 6 * hs, 4 * hs, 0, 0, TAU); c.fill();
  c.globalAlpha = 1;

  // Eye.
  const ex = hx + 1 * hs, ey = hy - 6 * hs, er = lerp(8.5, 7, g) * hs;
  const eyes = o.eyes || 'open';
  c.lineWidth = 2.6;
  if (eyes === 'happy') {
    c.beginPath(); c.arc(ex, ey + er * 0.3, er * 0.75, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
  } else if (eyes === 'closed') {
    c.beginPath(); c.arc(ex, ey - er * 0.2, er * 0.75, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
  } else {
    const open = 1 - clamp(o.blink || 0, 0, 1);
    c.save();
    c.translate(ex, ey); c.scale(1, Math.max(0.08, open));
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(0, 0, er, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = C.eye;
    c.beginPath(); c.arc(er * 0.22, er * 0.08, er * 0.62, 0, TAU); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(er * 0.42, -er * 0.25, er * 0.22, 0, TAU); c.fill();
    c.restore();
    if (eyes === 'sad') {   // worried eyebrow
      c.beginPath(); c.moveTo(ex - er * 0.9, ey - er * 1.25); c.lineTo(ex + er * 0.7, ey - er * 1.6); c.stroke();
    }
  }

  // Mouth.
  const mx = hx + 19 * hs, my = hy + 12 * hs;
  const mouth = o.mouth || 'smile';
  c.lineWidth = 2.4;
  const openMouth = (w, h) => {
    c.fillStyle = C.mouth;
    c.beginPath(); c.ellipse(mx, my + h * 0.3, w, h, 0, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = C.tongue;
    c.beginPath(); c.ellipse(mx + w * 0.1, my + h * 0.75, w * 0.6, h * 0.35, 0, 0, TAU); c.fill();
  };
  if (mouth === 'open') openMouth(7 * hs, 6 * hs);
  else if (mouth === 'yawn') openMouth(6 * hs, 9 * hs);
  else if (mouth === 'chew') {
    if (Math.sin(t * 16) > 0) openMouth(5 * hs, 3.5 * hs);
    else { c.beginPath(); c.moveTo(mx - 7 * hs, my); c.quadraticCurveTo(mx, my + 3 * hs, mx + 7 * hs, my - 1 * hs); c.stroke(); }
  } else if (mouth === 'grin') {
    c.fillStyle = C.mouth;
    c.beginPath(); c.moveTo(mx - 10 * hs, my - 2 * hs); c.quadraticCurveTo(mx, my + 12 * hs, mx + 9 * hs, my - 3 * hs); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#fff';
    c.fillRect(mx - 7 * hs, my - 2.2 * hs, 14 * hs, 3 * hs);
  } else if (mouth === 'sad') {
    c.beginPath(); c.moveTo(mx - 7 * hs, my + 3 * hs); c.quadraticCurveTo(mx, my - 3 * hs, mx + 7 * hs, my + 3 * hs); c.stroke();
  } else if (mouth === 'closed') {
    c.beginPath(); c.moveTo(mx - 5 * hs, my + 1 * hs); c.lineTo(mx + 5 * hs, my + 1 * hs); c.stroke();
  } else {
    c.beginPath(); c.moveTo(mx - 8 * hs, my - 1 * hs); c.quadraticCurveTo(mx, my + 7 * hs, mx + 8 * hs, my - 2 * hs); c.stroke();
  }
  c.restore();   // head rotation

  c.restore();

  // Screen positions of mouth, head and the whole body (for feeding and touching).
  const rot = (o.headDown || 0) * 0.55, toScreen = (ux, uy) => {
    const dx = ux - nbx, dy = uy - nby;
    const rxu = nbx + dx * Math.cos(rot) - dy * Math.sin(rot), ryu = nby + dx * Math.sin(rot) + dy * Math.cos(rot);
    return { x: x + rxu * k * dir, y: y - (o.jump || 0) + (ryu + bob) * k };
  };
  const m = toScreen(mx, my), h = toScreen(hx, hy);
  const left = Math.min(x + (tipX - 10) * k * dir, x + (hx + 45 * hs) * k * dir);
  const width = (hx + 45 * hs - tipX + 10) * k;
  const top = y - (o.jump || 0) + (cy - ry - plateBase * 1.1) * k;
  return { mouth: m, head: { x: h.x, y: h.y, r: 28 * hs * k }, box: { x: left, y: top, w: width, h: y - top }, k };
}

/* ===== 07-draw-scene.js ===== */
/* 07-draw-scene.js – the landscape (sky by real time, sun, moon, stars, clouds, hills, meadow)
 * and all small things: nest, egg with cracks, poop with flies, food, water bowl, bathtub,
 * toothbrush, ball and the particles (hearts, sparkles, bubbles, confetti, Zzz ...). */

const SKY = {
  night: ['#141a3d', '#2c3570'], dawn: ['#f3a07a', '#ffd9a0'],
  day: ['#4fa8e8', '#bfe6ff'], hillFar: '#7cc46a', hillNear: '#64b354', ground: ['#78c95a', '#4f9c3c'],
};

/** Fixed random decorations (stars, grass, flowers, clouds), made on resize. */
let deco = { stars: [], grass: [], flowers: [], clouds: [] };
function makeDeco() {
  const r = mulberry(7);
  deco.stars = Array.from({ length: 70 }, () => ({ x: r() * W, y: r() * groundY * 0.8, s: 0.6 + r() * 1.6, p: r() * TAU }));
  deco.grass = Array.from({ length: 70 }, () => ({ x: r() * W, y: groundY + 8 + r() * (H - groundY), h: 4 + r() * 7 }));
  deco.flowers = Array.from({ length: 14 }, () => ({ x: r() * W, y: groundY + 20 + r() * (H - groundY - 40), c: ['#fff', '#ffd54f', '#ff8fb1', '#b39ddb'][Math.floor(r() * 4)] }));
  deco.clouds = Array.from({ length: 4 }, (_, i) => ({ x: r() * W, y: 60 * U + i * 38 * U + r() * 30 * U, s: 0.7 + r() * 0.6, v: 4 + r() * 6 }));
}
/** Small seeded random generator so the meadow looks the same every time. */
function mulberry(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/** Background: sky, stars, sun or moon, clouds, hills and meadow for sky state `sky` (see skyAt). */
function drawBackground(c, sky, time) {
  const L = sky.light, Wm = sky.warm;
  // Sky gradient: night -> day, with an orange glow at dawn and dusk.
  let top = mix(SKY.night[0], SKY.day[0], L), bottom = mix(SKY.night[1], SKY.day[1], L);
  if (Wm > 0) { top = mixRGB(top, SKY.dawn[0], Wm * 0.35); bottom = mixRGB(bottom, SKY.dawn[1], Wm * 0.6); }
  const gr = c.createLinearGradient(0, 0, 0, groundY);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom);
  c.fillStyle = gr; c.fillRect(0, 0, W, groundY + 2);

  // Stars fade in at night and twinkle.
  const starA = clamp(1 - L * 1.6, 0, 1);
  if (starA > 0) {
    c.fillStyle = '#fff8d8';
    for (const s of deco.stars) {
      c.globalAlpha = starA * (0.55 + 0.45 * Math.sin(time * 2 + s.p));
      c.beginPath(); c.arc(s.x, s.y, s.s, 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
  }

  // Sun (day) or moon (night) on an arc across the sky.
  const p = clamp(sky.sun, 0, 1), arcX = lerp(W * 0.08, W * 0.92, p), arcY = groundY - Math.sin(p * Math.PI) * groundY * 0.72 + 40 * U;
  if (!sky.night) {
    const r = 26 * U;
    const glow = c.createRadialGradient(arcX, arcY, r * 0.5, arcX, arcY, r * 2.6);
    glow.addColorStop(0, 'rgba(255,240,170,0.55)'); glow.addColorStop(1, 'rgba(255,240,170,0)');
    c.fillStyle = glow; c.beginPath(); c.arc(arcX, arcY, r * 2.6, 0, TAU); c.fill();
    c.fillStyle = Wm > 0.4 ? '#ffb347' : '#ffe066';
    c.beginPath(); c.arc(arcX, arcY, r, 0, TAU); c.fill();
  } else {
    const r = 20 * U;
    c.fillStyle = 'rgba(255,250,220,0.15)'; c.beginPath(); c.arc(arcX, arcY, r * 2, 0, TAU); c.fill();
    c.fillStyle = '#fff6c8'; c.beginPath(); c.arc(arcX, arcY, r, 0, TAU); c.fill();
    c.fillStyle = mix(SKY.night[0], SKY.night[1], 0.4);
    c.beginPath(); c.arc(arcX + r * 0.45, arcY - r * 0.25, r * 0.85, 0, TAU); c.fill();
  }

  // Clouds drift slowly.
  c.fillStyle = 'rgba(255,255,255,' + (0.35 + L * 0.5).toFixed(2) + ')';
  for (const cl of deco.clouds) {
    const cxp = ((cl.x + time * cl.v * U) % (W + 160 * U)) - 80 * U, s = cl.s * U;
    c.beginPath();
    c.arc(cxp, cl.y, 20 * s, 0, TAU); c.arc(cxp + 22 * s, cl.y - 9 * s, 24 * s, 0, TAU);
    c.arc(cxp + 46 * s, cl.y, 18 * s, 0, TAU); c.rect(cxp, cl.y, 46 * s, 18 * s);
    c.fill();
  }

  // Two layers of hills.
  const dim = k => mix('#1d2a4a', k, clamp(L * 1.1, 0.25, 1));
  c.fillStyle = dim(SKY.hillFar);
  c.beginPath(); c.moveTo(0, groundY);
  for (let i = 0; i <= 8; i++) c.quadraticCurveTo(W * (i - 0.5) / 8, groundY - (55 + (i % 3) * 22) * U, W * i / 8, groundY - 25 * U);
  c.lineTo(W, groundY + 2); c.lineTo(0, groundY + 2); c.fill();
  c.fillStyle = dim(SKY.hillNear);
  c.beginPath(); c.moveTo(0, groundY - 10 * U);
  c.bezierCurveTo(W * 0.25, groundY - 50 * U, W * 0.45, groundY - 5 * U, W * 0.65, groundY - 30 * U);
  c.bezierCurveTo(W * 0.8, groundY - 48 * U, W * 0.92, groundY - 15 * U, W, groundY - 22 * U);
  c.lineTo(W, groundY + 2); c.lineTo(0, groundY + 2); c.fill();

  // Meadow with grass tufts and flowers.
  const gg = c.createLinearGradient(0, groundY, 0, H);
  gg.addColorStop(0, dim(SKY.ground[0])); gg.addColorStop(1, dim(SKY.ground[1]));
  c.fillStyle = gg; c.fillRect(0, groundY, W, H - groundY);
  c.strokeStyle = dim('#3f8a2e'); c.lineWidth = 2 * U; c.lineCap = 'round';
  c.beginPath();
  for (const gs of deco.grass) { c.moveTo(gs.x, gs.y); c.lineTo(gs.x - 2 * U, gs.y - gs.h * U); c.moveTo(gs.x, gs.y); c.lineTo(gs.x + 2 * U, gs.y - gs.h * U); }
  c.stroke();
  for (const f of deco.flowers) {
    c.fillStyle = dim(f.c);
    for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(f.x + Math.cos(i * TAU / 5) * 3.2 * U, f.y + Math.sin(i * TAU / 5) * 3.2 * U, 2.4 * U, 0, TAU); c.fill(); }
    c.fillStyle = dim('#ffb300'); c.beginPath(); c.arc(f.x, f.y, 2 * U, 0, TAU); c.fill();
  }
}

/** Blend of a css "rgb(r,g,b)" colour with a "#rrggbb" colour. */
function mixRGB(rgb, hex, k) {
  const m = rgb.match(/\d+/g).map(Number), b = parseInt(hex.slice(1), 16);
  const ch = (v, s) => Math.round(lerp(v, (b >> s) & 255, k));
  return 'rgb(' + ch(m[0], 16) + ',' + ch(m[1], 8) + ',' + ch(m[2], 0) + ')';
}

/** Darkens everything drawn so far at night (the stego stays visible). */
function drawNightShade(c, sky) {
  const a = (1 - sky.light) * 0.38;
  if (a <= 0.01) return;
  c.fillStyle = 'rgba(12,18,60,' + a.toFixed(3) + ')';
  c.fillRect(0, 0, W, H);
}

/** Nest of straw at ground point (x, y), width w. part 'back' or 'front' (the egg sits between). */
function drawNest(c, x, y, w, part) {
  c.save();
  c.lineCap = 'round';
  if (part === 'back') {
    c.fillStyle = '#9b6a3a';
    c.beginPath(); c.ellipse(x, y - w * 0.08, w * 0.5, w * 0.16, 0, Math.PI, TAU); c.fill();
  } else {
    c.fillStyle = '#b07a43';
    c.beginPath(); c.ellipse(x, y - w * 0.06, w * 0.52, w * 0.15, 0, 0, Math.PI); c.lineTo(x - w * 0.52, y - w * 0.06); c.fill();
    c.strokeStyle = '#e0b46e'; c.lineWidth = w * 0.025;
    const r = mulberry(3);
    for (let i = 0; i < 16; i++) {
      const a = r() * Math.PI, sx = x + Math.cos(a) * w * 0.48, sy = y - w * 0.06 + Math.sin(a) * w * 0.12;
      c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx + (r() - 0.5) * w * 0.25, sy + (r() - 0.5) * w * 0.06); c.stroke();
    }
  }
  c.restore();
}

/** Crack lines on the egg in egg units (egg is 100 high, 0,0 = bottom centre). One list per crack stage. */
const EGG_CRACKS = [
  [[-22, -62], [-12, -55], [-16, -46], [-4, -40]],
  [[4, -40], [12, -50], [8, -58], [20, -66], [16, -74], [28, -80]],
  [[-4, -40], [-6, -30], [6, -26], [2, -16], [14, -12], [30, -62], [34, -48], [24, -42], [36, -34]],
];

/**
 * The egg standing at (x, y) with height h pixels.
 *   cracks 0..3, glow 0..1 (being stroked), wobble (radians), t (time for sparkle)
 */
function drawEgg(c, x, y, h, cracks, glow, wobble, t) {
  const k = h / 100;
  c.save();
  if (glow > 0) {
    const gl = c.createRadialGradient(x, y - h * 0.45, h * 0.2, x, y - h * 0.45, h * 0.95);
    gl.addColorStop(0, 'rgba(255,240,180,' + (0.65 * glow).toFixed(2) + ')'); gl.addColorStop(1, 'rgba(255,240,180,0)');
    c.fillStyle = gl; c.beginPath(); c.arc(x, y - h * 0.45, h * 0.95, 0, TAU); c.fill();
  }
  c.translate(x, y); c.rotate(wobble); c.scale(k, k);
  const shape = () => {
    c.beginPath(); c.moveTo(0, 0);
    c.bezierCurveTo(-46, 0, -42, -70, 0, -100);
    c.bezierCurveTo(42, -70, 46, 0, 0, 0);
  };
  shape(); c.fillStyle = '#fff4d6'; c.fill();
  c.save(); shape(); c.clip();
  c.fillStyle = '#9ad9b0';
  for (const [sx, sy, r] of [[-18, -30, 9], [14, -52, 7], [-8, -75, 6], [22, -22, 6], [-26, -55, 5], [6, -14, 5]]) { c.beginPath(); c.arc(sx, sy, r, 0, TAU); c.fill(); }
  c.fillStyle = '#f7b2c4';
  for (const [sx, sy, r] of [[2, -36, 5], [-20, -12, 4], [20, -76, 4]]) { c.beginPath(); c.arc(sx, sy, r, 0, TAU); c.fill(); }
  c.fillStyle = 'rgba(255,255,255,0.55)';
  c.beginPath(); c.ellipse(-14, -70, 6, 12, 0.4, 0, TAU); c.fill();
  c.fillStyle = 'rgba(160,120,60,0.18)';
  c.beginPath(); c.ellipse(16, -30, 18, 40, 0.1, 0, TAU); c.fill();
  c.restore();
  c.lineWidth = 3; c.strokeStyle = '#b89b6a'; shape(); c.stroke();
  // Cracks: dark zigzag lines, each stage adds one more.
  c.strokeStyle = '#5b4630'; c.lineWidth = 2.6; c.lineJoin = 'round';
  for (let i = 0; i < cracks; i++) {
    c.beginPath();
    EGG_CRACKS[i].forEach(([px, py], j) => (j ? c.lineTo(px, py) : c.moveTo(px, py)));
    c.stroke();
  }
  c.restore();
}

/** A poop on the ground at (x, y), size s, with two flies buzzing around. */
function drawPoop(c, x, y, s, t) {
  c.save();
  c.translate(x, y);
  c.fillStyle = '#8d5a3b'; c.strokeStyle = '#5e3a24'; c.lineWidth = 1.5 * U;
  for (const [oy, rx, ry] of [[-5, 15, 7], [-14, 11, 6], [-22, 7, 5]]) {
    c.beginPath(); c.ellipse(0, oy * s, rx * s, ry * s, 0, 0, TAU); c.fill(); c.stroke();
  }
  c.beginPath(); c.moveTo(0, -27 * s); c.quadraticCurveTo(5 * s, -32 * s, 2 * s, -35 * s); c.lineWidth = 3 * s; c.strokeStyle = '#8d5a3b'; c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.35)';
  c.beginPath(); c.ellipse(-5 * s, -16 * s, 3 * s, 1.6 * s, -0.3, 0, TAU); c.fill();
  // Flies.
  for (let i = 0; i < 2; i++) {
    const a = t * (3 + i) + i * 2, fx = Math.cos(a) * 16 * s, fy = -30 * s + Math.sin(a * 1.7) * 9 * s;
    c.fillStyle = 'rgba(255,255,255,0.7)';
    c.beginPath(); c.ellipse(fx - 1.5 * s, fy - 2.5 * s, 2 * s, 1.2 * s, -0.5, 0, TAU); c.ellipse(fx + 1.5 * s, fy - 2.5 * s, 2 * s, 1.2 * s, 0.5, 0, TAU); c.fill();
    c.fillStyle = '#222'; c.beginPath(); c.arc(fx, fy, 1.8 * s, 0, TAU); c.fill();
  }
  c.restore();
}

/** A piece of food centred at (x, y), size s pixels. */
function drawFood(c, id, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s / 40, s / 40);
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (id === 'fern') {
    c.strokeStyle = '#2e7d32'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(-4, 18); c.quadraticCurveTo(2, 0, 4, -18); c.stroke();
    c.fillStyle = '#4caf50';
    for (let i = 0; i < 6; i++) {
      const yy = 12 - i * 5.5, len = 13 - i * 1.6, xx = -2 + i * 1;
      c.beginPath(); c.ellipse(xx - len / 2, yy, len / 2, 2.6, 0.35, 0, TAU); c.fill();
      c.beginPath(); c.ellipse(xx + len / 2 + 1, yy - 2, len / 2, 2.6, -0.35, 0, TAU); c.fill();
    }
  } else if (id === 'leaf') {
    c.fillStyle = '#7cc957'; c.strokeStyle = '#3d8b2a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-16, 16); c.bezierCurveTo(-18, -8, 2, -18, 17, -17); c.bezierCurveTo(16, 0, 6, 18, -16, 16); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-16, 16); c.lineTo(10, -10); c.stroke();
  } else if (id === 'berry') {
    c.strokeStyle = '#3d8b2a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0, -16); c.lineTo(-7, -4); c.moveTo(0, -16); c.lineTo(7, -2); c.moveTo(0, -16); c.lineTo(0, 4); c.stroke();
    c.fillStyle = '#6cbf4a'; c.beginPath(); c.ellipse(6, -17, 7, 3.5, -0.4, 0, TAU); c.fill();
    for (const [bx, by] of [[-8, 0], [8, 2], [0, 9], [-3, -3]]) {
      c.fillStyle = '#7b3fb0'; c.beginPath(); c.arc(bx, by, 7, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.6)'; c.beginPath(); c.arc(bx - 2.5, by - 2.5, 2, 0, TAU); c.fill();
    }
  } else if (id === 'apple') {
    c.fillStyle = '#e53935';
    c.beginPath(); c.arc(-6, 3, 13, 0, TAU); c.arc(6, 3, 13, 0, TAU); c.fill();
    c.strokeStyle = '#6d4c41'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(0, -8); c.lineTo(2, -16); c.stroke();
    c.fillStyle = '#66bb6a'; c.beginPath(); c.ellipse(8, -15, 6, 3, -0.5, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.45)'; c.beginPath(); c.ellipse(-9, -2, 3, 5, 0.4, 0, TAU); c.fill();
  } else if (id === 'melon') {
    c.fillStyle = '#43a047'; c.beginPath(); c.arc(0, -4, 20, 0, Math.PI); c.fill();
    c.fillStyle = '#c5e1a5'; c.beginPath(); c.arc(0, -4, 17, 0, Math.PI); c.fill();
    c.fillStyle = '#ef5350'; c.beginPath(); c.arc(0, -4, 15, 0, Math.PI); c.fill();
    c.fillStyle = '#3e2723';
    for (const [sx, sy] of [[-7, 2], [0, 6], [7, 2], [-3, 0], [4, 1]]) { c.beginPath(); c.ellipse(sx, sy, 1.4, 2.2, 0, 0, TAU); c.fill(); }
  }
  c.restore();
}

/** Water bowl at ground point (x, y), width w; level 0..1. */
function drawBowl(c, x, y, w, level) {
  c.save();
  c.fillStyle = '#3d7fd1';
  c.beginPath(); c.moveTo(x - w / 2, y - w * 0.3); c.lineTo(x + w / 2, y - w * 0.3); c.lineTo(x + w * 0.38, y); c.lineTo(x - w * 0.38, y); c.closePath(); c.fill();
  c.fillStyle = '#6fb0ff';
  c.beginPath(); c.ellipse(x, y - w * 0.3, w / 2, w * 0.1, 0, 0, TAU); c.fill();
  c.fillStyle = '#4fc3f7';
  c.beginPath(); c.ellipse(x, y - w * 0.3, w * 0.44 * (0.5 + 0.5 * level), w * 0.07 * (0.5 + 0.5 * level), 0, 0, TAU); c.fill();
  c.restore();
}

/** Bathtub at ground point (x, y), width w. part 'back' (inner wall) or 'front'. */
function drawTub(c, x, y, w, part) {
  c.save();
  const top = y - w * 0.26;
  if (part === 'back') {
    c.fillStyle = '#d6ecf7';
    c.beginPath(); c.ellipse(x, top, w / 2, w * 0.08, 0, Math.PI, TAU); c.fill();
  } else {
    c.fillStyle = '#9e9e9e';
    for (const fx of [-0.36, 0.36]) { c.beginPath(); c.arc(x + fx * w, y - w * 0.02, w * 0.04, 0, TAU); c.fill(); }
    c.fillStyle = '#ffffff'; c.strokeStyle = '#7fb8d6'; c.lineWidth = 3 * U;
    c.beginPath();
    c.moveTo(x - w / 2, top);
    c.lineTo(x + w / 2, top);
    c.bezierCurveTo(x + w / 2, y - w * 0.08, x + w * 0.35, y - w * 0.04, x + w * 0.3, y - w * 0.04);
    c.lineTo(x - w * 0.3, y - w * 0.04);
    c.bezierCurveTo(x - w * 0.35, y - w * 0.04, x - w / 2, y - w * 0.08, x - w / 2, top);
    c.fill(); c.stroke();
    c.fillStyle = '#7fd0ff';
    c.beginPath(); c.ellipse(x, top, w / 2, w * 0.06, 0, 0, Math.PI); c.fill();
    c.fillStyle = '#ffffff';
    for (let i = 0; i < 9; i++) { c.beginPath(); c.arc(x - w * 0.42 + i * w * 0.105, top - w * 0.01, w * 0.045, 0, TAU); c.fill(); }
  }
  c.restore();
}

/** Toothbrush with its head at (x, y). */
function drawBrush(c, x, y, s) {
  c.save(); c.translate(x, y); c.rotate(-0.6); c.scale(s / 40, s / 40);
  // Plain rectangles (roundRect is missing in older Android WebViews).
  c.fillStyle = '#26a69a'; c.fillRect(-4, 4, 8, 44);
  c.fillStyle = '#ffffff'; c.strokeStyle = '#90a4ae'; c.lineWidth = 1.5;
  c.beginPath(); c.rect(-6, -14, 12, 20); c.fill(); c.stroke();
  c.strokeStyle = '#4fc3f7'; c.lineWidth = 2;
  for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(-6, -11 + i * 5); c.lineTo(-13, -11 + i * 5); c.stroke(); }
  c.restore();
}

/** Ball centred at (x, y), radius r, rotation a. */
function drawBall(c, x, y, r, a) {
  c.save(); c.translate(x, y); c.rotate(a);
  c.fillStyle = '#ffcc33'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
  c.save(); c.beginPath(); c.arc(0, 0, r, 0, TAU); c.clip();
  c.fillStyle = '#e53935'; c.fillRect(-r, -r * 0.25, r * 2, r * 0.5);
  c.fillStyle = '#42a5f5'; c.fillRect(-r * 0.25, -r, r * 0.5, r * 2);
  c.restore();
  c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1.5 * U; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.5)'; c.beginPath(); c.arc(-r * 0.35, -r * 0.4, r * 0.22, 0, TAU); c.fill();
  c.restore();
}

/** Thought bubble with an icon of what he needs, above point (x, y). */
function drawThought(c, x, y, icon, t) {
  const bob = Math.sin(t * 2.5) * 3 * U, r = 26 * U;
  c.save();
  c.fillStyle = 'rgba(255,255,255,0.95)'; c.strokeStyle = 'rgba(60,80,110,0.35)'; c.lineWidth = 2 * U;
  c.beginPath(); c.arc(x - 18 * U, y + 22 * U + bob, 5 * U, 0, TAU); c.fill(); c.stroke();
  c.beginPath(); c.arc(x - 8 * U, y + 10 * U + bob, 8 * U, 0, TAU); c.fill(); c.stroke();
  c.beginPath(); c.arc(x + 14 * U, y - 18 * U + bob, r, 0, TAU); c.fill(); c.stroke();
  drawIcon(c, icon, x + 14 * U, y - 18 * U + bob, r * 1.25);
  c.restore();
}

/* ---------- particles ---------- */

const parts = [];
/** Adds a particle. kind: heart, sparkle, bubble, confetti, zzz, crumb, drop, shell, star. */
function addPart(kind, x, y, o = {}) {
  if (parts.length > 260) parts.shift();
  parts.push({ kind, x, y, vx: o.vx ?? rnd(-20, 20) * U, vy: o.vy ?? rnd(-60, -30) * U, g: o.g ?? 0, life: 0,
    max: o.max ?? 1.4, size: (o.size ?? 10) * U, rot: rnd(0, TAU), vr: rnd(-4, 4), color: o.color || '#fff' });
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * U * dt; p.rot += p.vr * dt;
    if (p.kind === 'zzz' || p.kind === 'heart') p.x += Math.sin(p.life * 4) * 12 * U * dt;
    if (p.life >= p.max) parts.splice(i, 1);
  }
}
function drawParts(c) {
  for (const p of parts) {
    const k = p.life / p.max, a = k < 0.15 ? k / 0.15 : 1 - smooth((k - 0.6) / 0.4);
    c.save(); c.globalAlpha = clamp(a, 0, 1); c.translate(p.x, p.y);
    if (p.kind === 'heart') drawIcon(c, 'love', 0, 0, p.size * 2);
    else if (p.kind === 'sparkle' || p.kind === 'star') {
      c.rotate(p.rot); c.fillStyle = p.kind === 'star' ? '#ffd740' : '#fffbe0';
      c.beginPath();
      for (let i = 0; i < 8; i++) { const r = i % 2 ? p.size * 0.35 : p.size; c.lineTo(Math.cos(i * Math.PI / 4) * r, Math.sin(i * Math.PI / 4) * r); }
      c.fill();
    } else if (p.kind === 'bubble') {
      c.fillStyle = 'rgba(255,255,255,0.75)'; c.strokeStyle = 'rgba(150,200,255,0.9)'; c.lineWidth = 1.2 * U;
      c.beginPath(); c.arc(0, 0, p.size * (0.6 + k * 0.4), 0, TAU); c.fill(); c.stroke();
    } else if (p.kind === 'confetti') {
      c.rotate(p.rot); c.fillStyle = p.color; c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else if (p.kind === 'zzz') {
      c.fillStyle = '#e8f0ff'; c.font = '800 ' + Math.round(p.size * 2) + 'px Nunito, sans-serif'; c.textAlign = 'center';
      c.fillText('Z', 0, 0);
    } else if (p.kind === 'crumb' || p.kind === 'shell') {
      c.rotate(p.rot); c.fillStyle = p.color;
      c.beginPath(); c.moveTo(-p.size, 0); c.lineTo(0, -p.size * 0.8); c.lineTo(p.size, p.size * 0.3); c.closePath(); c.fill();
    } else if (p.kind === 'drop') {
      c.fillStyle = '#7fd0ff'; c.beginPath(); c.ellipse(0, 0, p.size * 0.35, p.size * 0.6, 0, 0, TAU); c.fill();
    }
    c.restore();
  }
}

/* ===== 08-game.js ===== */
/* 08-game.js – what happens on screen: the egg, the stego's moods and moves, and the activities
 * (eat, drink, bath, teeth, ball, bed, hatching, growing party). update(dt) runs every frame,
 * drawWorld() draws everything. The HTML buttons are in 09-ui.js, touches in 10-input.js. */

/** Screen and activity state.
 *  screen: 'menu' | 'game'.  trans: 0 = menu camera .. 1 = game camera (animated).
 *  mode:   'idle' | 'eat' | 'drink' | 'bath' | 'brush' | 'ball' | 'hatch' | 'party'. */
const game = {
  screen: 'menu', trans: 0, mode: 'idle', modeT: 0, t: 0,
  flying: null,      // food on its way to the mouth: { id, x, y, sx, sy, k }
  held: null,        // food held by the finger: { id, x, y }
  rubbing: 0,        // seconds left of "finger is rubbing" (egg, bath, teeth)
  rubX: 0, rubY: 0,  // where the finger rubs
  bath: null,        // { phase: 'scrub'|'rinse'|'done', t }
  brush: null,       // { x, y, done, t, progress }
  ball: null,        // { x, h, vx, vh, rot, carried, thrown }
  amb: {},           // next time (game.t) of each ambient sound
  sky: null,
  stegoInfo: null,   // last result of drawStego (mouth, head, box)
};

/** The stego as an actor on screen. x is the offset from the screen centre in pixels. */
const pet = {
  x: 0, tx: 0, dir: 1, walk: 0, moving: false, jump: 0, jumpV: 0,
  blink: 0, nextBlink: 3, happyT: 0, giggleT: 0, eatT: 0, refuseT: 0, yawnT: 0,
  wiggle: 0, petDist: 0, purrT: 0,
};

/** Egg animation state. */
const eggFx = { glow: 0, wobble: 0, wobbleV: 0 };

/** Where things are on screen (set in resize()). */
let standY = 600, stegoSize = 290;

const today = () => dayIndex(now());
const asleepNow = () => hatched() && isAsleep(now());

/* ---------- egg ---------- */

/** 'growing' (cracks to come), 'done' (today's stroking done), 'hatchday' (ready to hatch). */
function eggPhase() {
  const e = S.egg, d = today();
  if (e.cracks >= EGG.cracks) return d > e.crackDay ? 'hatchday' : 'done';
  return e.crackDay === d ? 'done' : 'growing';
}

/** 0..1 progress shown as hearts above the egg. */
function eggProgress() {
  const e = S.egg, ph = eggPhase();
  if (ph === 'done') return 1;
  if (ph === 'hatchday') return clamp(e.hatchSec / EGG.hatchSeconds, 0, 1);
  return e.petDay === today() ? clamp(e.petSec / EGG.petSeconds, 0, 1) : 0;
}

/** The finger strokes the egg for dt seconds. */
function eggRub(dt) {
  const e = S.egg, d = today();
  if (e.petDay !== d) { e.petDay = d; e.petSec = 0; }
  const ph = eggPhase();
  if (ph === 'growing') {
    e.petSec += dt;
    if (e.petSec >= EGG.petSeconds) {
      e.cracks++; e.crackDay = d;
      sound('crack');
      eggFx.wobbleV += 3;
      for (let i = 0; i < 8; i++) addPart('star', W / 2 + rnd(-40, 40) * U, eggTop() + rnd(0, 60) * U, { size: 7 });
      save();
    }
  } else if (ph === 'hatchday') {
    e.hatchSec += dt;
    if (e.hatchSec >= EGG.hatchSeconds && game.mode !== 'hatch') startHatch();
  }
}

const eggHeight = () => 120 * U;
const eggTop = () => standY - eggHeight();

function startHatch() {
  game.mode = 'hatch'; game.modeT = 0;
  sound('crack');
}

/** The egg opens: the baby is there. */
function finishHatch() {
  const t = now();
  S.hatchDay = today();
  for (const n of NEEDS) S.needs[n] = START_NEEDS;
  S.last = t; S.stageSeen = 0; S.meals = 0; S.poopAt = 0; S.poops = [];
  save();
  sound('fanfare');
  for (let i = 0; i < 14; i++) addPart('shell', W / 2 + rnd(-30, 30) * U, standY - rnd(30, 90) * U,
    { vx: rnd(-160, 160) * U, vy: rnd(-260, -120) * U, g: 600, color: i % 2 ? '#fff4d6' : '#9ad9b0', size: 8, max: 1.6 });
  confetti();
  pet.x = 0; pet.tx = 0; pet.jumpV = 260 * U; pet.giggleT = 1.5;
}

function confetti() {
  const cols = ['#ff5c8a', '#ffcc33', '#5cc15a', '#3fa9f5', '#b388ff', '#ff9a4d'];
  for (let i = 0; i < 70; i++) addPart('confetti', rnd(0, W), rnd(-40, 0) * U,
    { vx: rnd(-40, 40) * U, vy: rnd(60, 200) * U, g: 40, color: cols[i % cols.length], size: 9, max: rnd(2.5, 4) });
}

/* ---------- activities ---------- */

/** Leaves the current activity (X button, back key, night falling). */
function endMode() {
  if (game.mode === 'hatch') return;   // hatching cannot be interrupted
  game.mode = 'idle'; game.modeT = 0;
  game.held = null; game.flying = null; game.bath = null; game.brush = null;
  if (game.ball) game.ball = null;
  pet.tx = 0;
  refreshUI();
}

/** Starts an activity from a bottom button. */
function startMode(m) {
  if (!hatched() || asleepNow() || game.mode !== 'idle') return;
  sound('tap');
  if (m === 'drink') {
    if (S.needs.drink >= 95) { refuse(); return; }
    pet.tx = 0;
    // The bowl stays where the mouth was, the head bends down to it.
    game.bowlX = game.stegoInfo ? game.stegoInfo.mouth.x + 12 * U : W / 2 + 90 * U;
  }
  if (m === 'bath') game.bath = { phase: 'scrub', t: 0 };
  if (m === 'brush') game.brush = { x: W * 0.75, y: standY - 60 * U, progress: 0, done: false, t: 0, scrubT: 0 };
  if (m === 'ball') game.ball = { x: Math.min(W - 40 * U, W / 2 + 140 * U), h: 0, vx: 0, vh: 0, rot: 0, carried: false, thrown: false };
  game.mode = m; game.modeT = 0;
  if (m !== 'ball') pet.tx = 0;
  refreshUI();
}

/** He shakes his head: does not want any more. */
function refuse() { pet.refuseT = 0.9; sound('refuse'); }

/** "Lights out" in the sleepy half hour before bedtime. */
function goToBed() {
  if (!hatched() || asleepNow() || !isSleepy(now())) return;
  endMode();
  S.bedAt = now();
  sound('yawn');
  save();
  refreshUI();
}

/** Food is offered (tapped on the tray or dropped near the mouth). from = screen point. */
function offerFood(id, fx, fy) {
  if (game.mode !== 'eat' || game.flying || pet.eatT > 0) return false;
  if (S.needs.food >= 95) { refuse(); return false; }
  const m = game.stegoInfo ? game.stegoInfo.mouth : { x: W / 2, y: standY - 80 * U };
  game.flying = { id, x: fx, y: fy, sx: fx, sy: fy, k: 0, tx: m.x, ty: m.y };
  return true;
}

/** The food arrived in the mouth. */
function eat(id) {
  const f = FOODS.find(x => x.id === id);
  addNeed('food', f.value);
  addNeed('love', 1);
  countMeal();
  pet.eatT = 1.3;
  sound('munch');
  const m = game.stegoInfo.mouth;
  const col = { fern: '#4caf50', leaf: '#7cc957', berry: '#7b3fb0', apple: '#e53935', melon: '#ef5350' }[id];
  for (let i = 0; i < 6; i++) addPart('crumb', m.x, m.y, { vx: rnd(-60, 60) * U, vy: rnd(-80, -20) * U, g: 400, color: col, size: 4, max: 0.8 });
  save();
}

/** A poop was tapped away. */
function removePoop(i) {
  const p = S.poops[i];
  S.poops.splice(i, 1);
  addNeed('clean', POOP_CLEAN);
  sound('pling');
  for (let k = 0; k < 6; k++) addPart('sparkle', p.x * W + rnd(-15, 15) * U, standY + 18 * U - rnd(0, 30) * U, { size: 7, max: 0.8 });
  save();
}
/** Called by tick() when a poop appears. */
function onPoop() { if (game.screen === 'game') sound('plop'); }

/** Screen position of poop i. */
const poopPos = i => ({ x: S.poops[i].x * W, y: standY + 22 * U });

/** He is stroked: dist = finger movement in pixels over his body. */
function strokeStego(dist) {
  pet.petDist += dist;
  pet.happyT = 0.6;
  pet.wiggle = 1;
  while (pet.petDist >= PET_STEP * U) {
    pet.petDist -= PET_STEP * U;
    addNeed('love', PET_LOVE);
    const h = game.stegoInfo ? game.stegoInfo.head : { x: W / 2, y: standY - 100 * U };
    addPart('heart', h.x + rnd(-30, 30) * U, h.y - 30 * U, { size: 8, vy: -50 * U });
  }
  if (game.t > pet.purrT) { sound('purr'); pet.purrT = game.t + 1.0; }
}

/** He is tapped once. */
function tapStego() {
  if (asleepNow()) { sound('murmur'); pet.dir = -pet.dir; return; }
  if (pet.jump > 0) return;
  pet.jumpV = 170 * U; pet.giggleT = 0.7;
  addNeed('love', 1);
  sound('giggle');
}

/** Stage-up party (and the first look after hatching). */
function startParty() {
  game.mode = 'party'; game.modeT = 0;
  sound('fanfare'); confetti();
  pet.jumpV = 240 * U; pet.giggleT = 2;
  refreshUI();
}

/* ---------- update ---------- */

function update(dt) {
  const t = now();
  game.t += dt;
  tick(t);
  game.sky = skyAt(t);
  // Camera between menu (0) and game (1).
  game.trans = clamp(game.trans + (game.screen === 'game' ? dt : -dt) / 0.7, 0, 1);
  game.modeT += dt;
  game.rubbing = Math.max(0, game.rubbing - dt);
  updateParts(dt);

  const sleeping = asleepNow();
  if (sleeping && !['idle', 'hatch'].includes(game.mode)) endMode();

  if (!hatched() || game.mode === 'hatch') updateEgg(dt);
  else updatePet(dt, sleeping);

  if (game.screen === 'game' && game.trans >= 1 && document.visibilityState !== 'hidden') {
    if (addPlayTime(dt)) showRest();
  }
  updateMusic(!game.sky.night);
}

function updateEgg(dt) {
  const ph = eggPhase(), night = isNight(now());
  // Wobble: a spring that gets kicks while being stroked and on hatch day.
  eggFx.wobbleV += -eggFx.wobble * 40 * dt; eggFx.wobbleV *= 1 - 3 * dt; eggFx.wobble += eggFx.wobbleV * dt;
  eggFx.glow = Math.max(0, eggFx.glow - dt * 1.5);
  if (game.mode === 'hatch') {
    if (Math.random() < dt * 8) eggFx.wobbleV += rnd(-2.5, 2.5);
    if (game.modeT > 0.6 && Math.floor(game.modeT * 2) !== Math.floor((game.modeT - dt) * 2)) sound('crack');
    if (game.modeT >= 1.8 && !hatched()) { finishHatch(); startParty(); }
    return;
  }
  if (game.screen !== 'game' || game.trans < 1) return;
  if (game.rubbing > 0 && !night) {
    eggRub(dt);
    eggFx.glow = Math.min(1, eggFx.glow + dt * 4);
    if (Math.random() < dt * 3) { eggFx.wobbleV += rnd(-0.6, 0.6); sound('egg'); addPart('heart', game.rubX, game.rubY - 20 * U, { size: 6, vy: -40 * U }); }
  }
  if (ph === 'hatchday' && !night && game.t > (game.amb.peep || 0)) {
    game.amb.peep = game.t + 5;
    sound('peep'); eggFx.wobbleV += 1.5;
  }
}

function updatePet(dt, sleeping) {
  const inGame = game.screen === 'game' && game.trans >= 1;
  // Timers.
  pet.happyT = Math.max(0, pet.happyT - dt);
  pet.giggleT = Math.max(0, pet.giggleT - dt);
  pet.eatT = Math.max(0, pet.eatT - dt);
  pet.refuseT = Math.max(0, pet.refuseT - dt);
  pet.yawnT = Math.max(0, pet.yawnT - dt);
  pet.wiggle = Math.max(0, pet.wiggle - dt * 1.5);
  // Jumping.
  if (pet.jumpV || pet.jump > 0) {
    pet.jump += pet.jumpV * dt; pet.jumpV -= 900 * U * dt;
    if (pet.jump <= 0) { pet.jump = 0; pet.jumpV = 0; }
  }
  // Blinking.
  pet.nextBlink -= dt;
  if (pet.nextBlink < 0) { pet.blink = 0.15; pet.nextBlink = rnd(2.5, 5); }
  pet.blink = Math.max(0, pet.blink - dt);
  // Walking towards tx.
  const speed = (game.mode === 'ball' ? 260 : 120) * U, dx = pet.tx - pet.x;
  pet.moving = Math.abs(dx) > 3 * U && !sleeping;
  if (pet.moving) {
    pet.x += Math.sign(dx) * Math.min(Math.abs(dx), speed * dt);
    pet.dir = Math.sign(dx);
    pet.walk += dt * 12;
  } else if (game.mode !== 'ball' && !sleeping) pet.dir = 1;

  // Activities.
  if (game.mode === 'eat' && game.flying) {
    const f = game.flying, m = game.stegoInfo ? game.stegoInfo.mouth : { x: f.tx, y: f.ty };
    f.k = Math.min(1, f.k + dt / 0.35);
    f.x = lerp(f.sx, m.x, smooth(f.k)); f.y = lerp(f.sy, m.y, smooth(f.k)) - Math.sin(f.k * Math.PI) * 50 * U;
    if (f.k >= 1) { game.flying = null; eat(f.id); }
  }
  if (game.mode === 'drink') {
    if (Math.floor(game.modeT / 0.8) !== Math.floor((game.modeT - dt) / 0.8) && game.modeT > 0.5) sound('slurp');
    if (game.modeT >= 2.6) { addNeed('drink', DRINK_VALUE); save(); game.mode = 'idle'; refreshUI(); }
  }
  if (game.mode === 'bath') updateBath(dt);
  if (game.mode === 'brush') updateBrush(dt);
  if (game.mode === 'ball') updateBall(dt);
  if (game.mode === 'party' && game.modeT > 3) { game.mode = 'idle'; refreshUI(); }
  if (game.mode === 'party' && pet.jump === 0 && game.modeT < 2.4) { pet.jumpV = 200 * U; }

  if (!inGame) return;
  // Ambient sounds and Zzz.
  const a = game.amb;
  if (sleeping) {
    if (game.t > (a.snore || 0)) { a.snore = game.t + 3.4; sound('snore'); }
    if (game.t > (a.zzz || 0)) { a.zzz = game.t + 1.3; const h = game.stegoInfo.head; addPart('zzz', h.x + 20 * U, h.y - 20 * U, { vx: 15 * U, vy: -35 * U, size: 10 + Math.random() * 6, max: 2.4 }); }
    return;
  }
  if (game.mode !== 'idle') return;
  const low = lowestNeed();
  if (S.needs.food < NEED_LOW && game.t > (a.rumble || 8)) { a.rumble = game.t + rnd(16, 26); sound('rumble'); }
  else if (low.value < NEED_SAD && game.t > (a.whine || 12)) { a.whine = game.t + rnd(18, 28); sound('whine'); }
  if (isSleepy(now()) && game.t > (a.yawn || 4)) { a.yawn = game.t + rnd(14, 22); pet.yawnT = 1.6; sound('yawn'); }
  // Stage-up party once a second check.
  if (stageAt(now()) > S.stageSeen) { S.stageSeen = stageAt(now()); save(); startParty(); }
}

function updateBath(dt) {
  const b = game.bath;
  b.t += dt;
  if (b.phase === 'scrub') {
    if (game.rubbing > 0 && game.stegoInfo && inBox(game.rubX, game.rubY, game.stegoInfo.box, 20 * U)) {
      addNeed('clean', 100 / BATH_SECONDS * dt);
      pet.happyT = 0.3;
      if (Math.random() < dt * 14) addPart('bubble', game.rubX + rnd(-20, 20) * U, game.rubY + rnd(-15, 15) * U, { vx: rnd(-10, 10) * U, vy: rnd(-30, -10) * U, size: rnd(5, 10), max: 2.5 });
      if (Math.random() < dt * 3) sound('pop');
      if (S.needs.clean >= 100) { b.phase = 'rinse'; b.t = 0; sound('splash'); }
    }
  } else if (b.phase === 'rinse') {
    for (let i = 0; i < 3; i++) addPart('drop', W / 2 + rnd(-90, 90) * U, standY - 230 * U, { vx: 0, vy: rnd(250, 350) * U, g: 300, size: 7, max: 0.8 });
    if (b.t > 1.6) { b.phase = 'done'; b.t = 0; sound('sparkle'); for (let i = 0; i < 12; i++) addPart('sparkle', W / 2 + rnd(-100, 100) * U, standY - rnd(20, 160) * U, { size: 9 }); save(); }
  } else if (b.t > 1.4) endMode();
}

function updateBrush(dt) {
  const b = game.brush;
  b.t += dt;
  if (b.done) { if (b.t > 1.4) endMode(); return; }
  const m = game.stegoInfo && game.stegoInfo.mouth;
  if (m && game.rubbing > 0 && dist(b.x, b.y, m.x, m.y) < 55 * U) {
    b.progress += dt / BRUSH_SECONDS;
    b.scrubT -= dt;
    if (b.scrubT <= 0) { sound('scrub'); b.scrubT = 0.2; }
    if (Math.random() < dt * 10) addPart('bubble', m.x + rnd(-12, 12) * U, m.y + rnd(-8, 8) * U, { vx: rnd(-20, 20) * U, vy: rnd(-25, -5) * U, size: rnd(3, 6), max: 1.2 });
    if (b.progress >= 1) {
      b.done = true; b.t = 0;
      S.teethDay = today();
      addNeed('clean', BRUSH_CLEAN); addNeed('love', BRUSH_LOVE);
      sound('sparkle');
      for (let i = 0; i < 10; i++) addPart('star', m.x + rnd(-30, 30) * U, m.y + rnd(-30, 10) * U, { size: 7 });
      save();
    }
  }
}

/** Ball physics in a side view: x across the screen, h = height above the ground. */
function updateBall(dt) {
  const b = game.ball, info = game.stegoInfo;
  if (!b || !info) return;
  if (b.carried) {
    b.x = info.mouth.x + pet.dir * 8 * U; b.h = standY - info.mouth.y - 4 * U;
    pet.tx = 0;
    if (!pet.moving && Math.abs(pet.x) < 4 * U) {   // back in the middle: drop it, happy
      b.carried = false; b.thrown = false; b.vx = 0; b.vh = 120 * U; b.x = Math.min(W - 40 * U, W / 2 + 140 * U);
      addNeed('fun', FETCH_FUN); save();
      pet.giggleT = 0.9; pet.jumpV = 160 * U; sound('giggle');
      for (let i = 0; i < 3; i++) addPart('heart', info.head.x + rnd(-20, 20) * U, info.head.y - 30 * U, { size: 8 });
    }
    return;
  }
  b.vh -= 900 * U * dt;
  b.h += b.vh * dt;
  if (b.h <= 0) {
    b.h = 0;
    if (b.vh < -80 * U) { b.vh = -b.vh * 0.55; sound('boing'); } else b.vh = 0;
    b.vx *= 1 - Math.min(1, 2.2 * dt);
  }
  b.x += b.vx * dt;
  b.rot += b.vx * dt / (16 * U);
  const r = BALL_R * U;
  if (b.x < r) { b.x = r; b.vx = Math.abs(b.vx) * 0.7; sound('boing'); }
  if (b.x > W - r) { b.x = W - r; b.vx = -Math.abs(b.vx) * 0.7; sound('boing'); }
  if (b.thrown) {
    // Run so that the mouth reaches the ball.
    const reach = (info.mouth.x - (W / 2 + pet.x));
    const side = b.x > W / 2 + pet.x ? 1 : -1;
    pet.tx = clamp(b.x - W / 2 - side * Math.abs(reach), -W / 2 + 60 * U, W / 2 - 60 * U);
    const slow = Math.abs(b.vx) < 90 * U && b.h < 25 * U;
    if (slow && Math.abs(info.mouth.x - b.x) < 30 * U) { b.carried = true; sound('happy'); }
  }
}

/** Ball thrown by the finger with velocity (vx, vy) in px/s. */
function throwBall(vx, vy) {
  const b = game.ball;
  if (!b || b.carried) return;
  const sp = Math.hypot(vx, vy);
  if (sp < 150 * U) { vx = (b.x > W / 2 + pet.x ? 1 : -1) * 260 * U; vy = -320 * U; }
  b.vx = clamp(vx, -900 * U, 900 * U); b.vh = clamp(-vy, 150 * U, 900 * U);
  b.thrown = true;
  sound('boing');
}

/** Ball radius in U and the screen y of its centre (it rolls in front of the stego). */
const BALL_R = 20;
const ballY = () => standY + 14 * U - game.ball.h - BALL_R * U;

const inBox = (x, y, b, pad = 0) => x >= b.x - pad && x <= b.x + b.w + pad && y >= b.y - pad && y <= b.y + b.h + pad;

/* ---------- drawing ---------- */

/** Pose and face of the stego right now. */
function stegoLook() {
  const sleeping = asleepNow(), low = lowestNeed();
